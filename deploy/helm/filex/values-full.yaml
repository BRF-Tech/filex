# Full install: bundled Postgres + Redis + S3 server, plus external draw.io wired
# in. Every add-on is a toggle - flip `enabled` to add/remove it. Office
# documents need no add-on: install the Office editor app (Admin -> Plugins ->
# Apps); an ONLYOFFICE Document Server is optional (below, off).
#
# Usage (this file ships inside the chart; `helm pull brf-tech/filex --untar`
# writes it to ./filex/values-full.yaml):
#   helm install filex brf-tech/filex -f filex/values-full.yaml \
#     --set ingress.host=files.example.com \
#     --set publicURL=https://files.example.com

# ── Bundled data services (deployed by this chart) ──────────────────────
postgresql:
  enabled: true
  password: change-me-postgres     # override with --set or a sealed secret

queue:
  driver: redis

redis:
  enabled: true

versitygw:
  enabled: true
  secretKey: change-me-s3

# Seed the bundled S3 server as the default storage on first boot - endpoint,
# region and credentials are auto-filled from the versitygw block above, so
# files have a home with zero admin-UI clicks.
storage:
  type: s3
  s3:
    bucket: filex
    prefix: files

# ── Zero-touch SSO (uncomment + fill to stand up OIDC with no UI clicks) ──
# auth:
#   drivers: "local,oidc"
#   oidc:
#     issuer: https://id.example.com/realms/main
#     clientId: filex
#     clientSecret: change-me-oidc
#     roleClaim: realm_access.roles
#     adminGroup: filex-admin
# admin:
#   email: admin@example.com
#   password: change-me-admin
# smtp:
#   host: smtp.example.com
#   from: no-reply@example.com

# ── External integrations (run separately; the chart wires filex) ───────
# Flip enabled=false to remove one later.
# ONLYOFFICE Document Server: optional, off. Turn it on for office thumbnails
# and the apps' office conversions (docs/ONLYOFFICE.md). Deploy it yourself
# from onlyoffice/documentserver:9.4.0.1 (never `latest`), JWT on.
onlyoffice:
  enabled: false
  url: ""                           # https://office.example.com - browser-facing
  jwtSecret: ""                     # must match the Document Server's JWT_SECRET

drawio:
  enabled: true
  url: https://draw.example.com     # self-host jgraph/drawio

# Mermaid needs nothing — it renders in the browser.

# ── Antivirus ───────────────────────────────────────────────────────────
# Left unset on purpose: this chart does not deploy ClamAV, and a filex told
# to scan with nothing listening reports scanning unavailable rather than
# scanning. Run `clamav/clamav` as its own Deployment + Service first, then
# uncomment. ⚠ First-boot seeds — after that, Settings → Protection.
# antivirus:
#   mode: daemon
#   address: "clamav:3310"
