# Default values for filex — a minimal install: one filex pod, SQLite on a PVC,
# an Ingress. Enable the toggles below (or use values-full.yaml) for Postgres,
# Redis and OnlyOffice.

# Every object is named `<release>-<nameOverride|chart name>`. Override it when
# the chart name is not what you want in the object names — e.g. two installs
# of filex in one namespace that must not collide. The templates have always
# read this value; it was simply not declared here, which meant you could only
# find it by reading _helpers.tpl.
nameOverride: ""

image:
  repository: ghcr.io/brf-tech/filex
  tag: ""                 # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

# The external URL users open. REQUIRED — it is baked into share links, the OIDC
# redirect and OnlyOffice callbacks. Usually https://<ingress.host>.
publicURL: "https://files.example.com"

replicaCount: 1

service:
  type: ClusterIP
  port: 5212

ingress:
  enabled: true
  className: ""           # e.g. "nginx"
  host: files.example.com
  # TLS secret name (e.g. issued by cert-manager). Empty = no TLS block.
  tlsSecretName: ""
  annotations: {}
    # Large uploads + websockets on nginx-ingress:
    # nginx.ingress.kubernetes.io/proxy-body-size: "5g"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  # MULTI-TENANT (docs/MULTI-TENANCY.md): one Ingress rule + TLS cert per
  # tenant host, all routed to the same filex. Set FILEX_MULTI_TENANT=1 in
  # `env` and provision each host as a provider over /api/admin/providers.
  # With cert-manager, an annotation above issues each host its own cert.
  extraHosts: []
  # - host: files.acme.example
  #   tlsSecretName: files-acme-example-tls
  # - host: files.beta.example
  #   tlsSecretName: files-beta-example-tls

# /data holds the SQLite DB (if used), the search index and the thumbnail cache.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# Database. Default is SQLite on the PVC. For an external DB set driver +
# dsn; or set postgresql.enabled=true to run a bundled Postgres.
database:
  driver: sqlite          # sqlite | postgres | mysql
  dsn: ""                 # external DSN (postgres://… / user:pass@tcp(host)/db)

postgresql:
  enabled: false          # deploy a bundled single-instance Postgres
  image: postgres:16-alpine
  password: change-me-postgres
  storage: 8Gi

# Queue. Default sqlite (shares the DB). Redis enables distributed workers.
# All three drivers order by priority, so an interactive operation is served
# ahead of a bulk backlog (a first storage import can queue tens of thousands).
#
# ⚠ Upgrading an install that already runs the redis driver: the pending set
# was a LIST and becomes a SORTED SET, converted at startup. Every queued
# operation survives, but an older filex cannot read the converted key —
# downgrading after this is not supported.
queue:
  driver: sqlite          # sqlite | postgres | redis
  dsn: ""

redis:
  enabled: false          # deploy a bundled single-instance Redis for the queue
  image: redis:7-alpine

# ── External integrations ───────────────────────────────────────────────
# Each is toggled with `enabled`. The chart wires filex to the service; run the
# service itself (its own chart / Deployment) and give its browser-facing
# `url` an Ingress + DNS. Set enabled=false to hide the feature in filex — e.g.
# drop OnlyOffice later by flipping one flag.

# OnlyOffice — edit Word / Excel / PowerPoint in the browser.
onlyoffice:
  enabled: false
  url: ""                 # https://office.example.com — browser-facing
  jwtSecret: ""           # MUST equal the Document Server's JWT_SECRET

# Drawio / diagrams.net — diagram editing, embedded as an iframe.
drawio:
  enabled: false
  url: ""                 # https://draw.example.com (self-host jgraph/drawio)

# Universal file converter (p2r3/convert fork, in-browser WASM). Run the
# ghcr.io/brf-tech/converter-filex image and point url at it (served under
# /convert). See docs/CONVERT-INTEGRATION.md.
convert:
  enabled: false
  url: ""                 # https://files.example.com/convert

# Mermaid diagrams render in the browser with no service — always available.

# ── Bundled MinIO (S3-compatible storage) ───────────────────────────────
# Deploys an internal MinIO. After install, add it as an S3 storage in the
# admin UI: endpoint=http://<release>-minio:9000, path_style=true, region=auto.
minio:
  enabled: false
  image: minio/minio:latest
  rootUser: filex
  rootPassword: change-me-minio
  storage: 20Gi

# ── Zero-touch config (seeded from env on first boot) ───────────────────
# Everything below is applied to the DB once, on first boot, only when unset —
# so a fresh install comes up fully configured with NO admin-UI clicks. Later
# edits in the admin UI win.

# Authentication. `drivers` is a comma list: local | oidc | ldap | proxy_header.
# For SSO, set drivers "local,oidc" and fill oidc.* — that is the whole setup.
auth:
  drivers: "local"
  oidc:
    issuer: ""            # e.g. https://id.example.com/realms/main
    clientId: ""
    clientSecret: ""
    redirectURL: ""       # blank → <publicURL>/api/auth/oidc/callback
    roleClaim: ""         # e.g. realm_access.roles
    adminGroup: ""        # token group/role that grants filex admin
  # LDAP / Active Directory. Set drivers "local,ldap" and fill url + baseDN.
  # Keep `local` FIRST in drivers: it is tried first, so admin@local stays
  # answerable while the directory is unreachable.
  ldap:
    url: ""               # ldaps://ldap.example.com or ldap://ad.example.com
    bindDN: ""            # service account; blank → anonymous search
    bindPassword: ""
    baseDN: ""            # e.g. dc=example,dc=com
    userFilter: ""        # blank → (mail=%s); EVERY %s is filled
    emailAttr: ""         # blank → mail
    startTLS: ""          # "true" to upgrade a plain ldap:// connection
    caFile: ""            # in-pod path to a PEM bundle for a private CA
    protocolLogin: ""     # "false" to keep directory passwords off WebDAV/SFTP/S3
    # Multi-tenant installs only. Tenant SLUG a just-in-time directory account
    # is homed in when the login carries no Host that maps to a tenant — an
    # SFTP/FTPS/NFS login. Blank ⇒ such a login REFUSES to create the account
    # rather than falling back to the confine-exempt supertenant.
    provider: ""
  # Reverse-proxy header auth. Set drivers "proxy_header" and fill trustedIPs.
  # ⚠ Only safe when the proxy is the SOLE ingress: anything that can reach
  # filex from inside trustedIPs can forge any identity.
  headerProxy:
    trustedIPs: ""        # comma list of proxy CIDRs; REQUIRED for this driver
    emailHeader: ""       # blank → X-Auth-Email
    groupHeader: ""       # blank → X-Auth-Roles
    adminGroup: ""        # group value that elevates to admin
    provider: ""          # multi-tenant only — tenant slug when Host matches none

# First admin user, created on first boot. Blank password → a random
# admin@local (printed once in the pod logs).
admin:
  email: ""
  password: ""

# SMTP for share / invite email. Seeded on first boot.
smtp:
  host: ""
  port: "587"
  username: ""
  password: ""
  from: ""
  tls: "starttls"         # starttls | tls | none

# Branding + trash policy.
siteName: ""
trashRetentionDays: ""

# Initial storage, seeded on first boot so files have a home immediately.
#   type: none | local | s3
#   local — a directory on a mounted volume (choose it under storage.local.volume)
#   s3    — an S3/MinIO bucket; blank endpoint + minio.enabled uses bundled MinIO
storage:
  type: none
  name: Files
  mountPath: "/"
  local:
    # Where the user files physically live.
    #   data     — reuse the /data PVC (simplest; files under /data/files)
    #   pvc      — a dedicated PersistentVolumeClaim
    #   nfs      — an NFS server export
    #   hostPath — a directory on the node
    volume:
      type: data          # data | pvc | nfs | hostPath
      size: 20Gi          # pvc
      storageClass: ""     # pvc (blank = cluster default)
      nfsServer: ""        # nfs
      nfsPath: ""          # nfs
      hostPath: ""         # hostPath
  s3:
    bucket: filex
    prefix: files
    endpoint: ""           # blank + minio.enabled → bundled MinIO
    region: auto
    accessKey: ""          # blank + minio.enabled → minio.rootUser
    secretKey: ""          # blank + minio.enabled → minio.rootPassword
    pathStyle: true
  # Connect an EXISTING external storage of ANY driver (sftp / webdav / ftp, or
  # advanced s3): set `type` to the driver name and fill `config` with that
  # driver's settings — it is passed through verbatim. Example:
  #   type: sftp
  #   config: { host: nas.example.com, user: filex, password: "s3cret", root: /srv/files }
  config: {}

# ── Antivirus (ClamAV) ──────────────────────────────────────────────────
# The filex images ship NO scanner — ClamAV plus its unpacked signature
# database is close to a gigabyte — so on Kubernetes you run `clamav/clamav`
# as its own Deployment + Service and point filex at it. filex STREAMS each
# file to the daemon, so the two need a network route and NOT a shared volume;
# `mode: daemon` is the only mode that can work in a pod with no scanner in
# the image.
#
# ⚠⚠ These are FIRST-BOOT SEEDS, not live switches — the same contract as
# every other zero-touch value above. Each is read on a boot where its setting
# has no stored row yet, and never again: from then on the switch, the mode and
# the address live in the database and are edited on Settings → Protection in
# the admin UI. Editing one here and upgrading does nothing, silently. Leave a
# field empty/null and the chart emits no variable for it at all, which leaves
# the running install's stored value alone. See docs/PROTECTION.md.
antivirus:
  # The kill-switch. null = don't seed it (filex's own default is ON, i.e.
  # "scan if you can"). `false` seeds an install that comes up not scanning;
  # a real YAML bool and the strings "false"/"0"/"off" all work.
  enabled: null
  # binary | daemon. Blank + a non-blank `address` seeds `daemon`, so naming a
  # clamd Service is enough — without that rule a chart that clearly points at
  # clamd would come up in binary mode, find no binary, and report scanning
  # unavailable.
  mode: ""
  # clamd address. A Service in this namespace (`clamav:3310`, or a bare
  # `clamav` — the default port is filled in), an explicit `tcp://host:port`,
  # or a unix socket path (`/var/run/clamav/clamd.ctl`) if you run clamd as a
  # sidecar and share the socket directory.
  address: ""

# Any extra FILEX_* overrides (see docs/CONFIGURATION.md). Everything the
# blocks above do not model goes here — including the antivirus variables that
# are deliberately env-only, e.g. FILEX_CLAMAV_BIN (a path filex EXECUTES, so
# it is not admin-editable), FILEX_CLAMAV_MAX and
# FILEX_CLAMAV_SAVE_WINDOW_MINUTES.
#
# ⚠ FILEX_INSTALLATION_* settings are decided at the FIRST boot and frozen:
# the pod refuses to start if one later changes. Set them here before the
# first install, or not at all. See
# docs/CONFIGURATION.md#install-time-settings-filex_installation_
extraEnv: {}
  # FILEX_LOG_LEVEL: debug
  # E2E key escrow — the PUBLIC half only, from `filex e2e-escrow keygen`.
  # Keep the private half OUT of the cluster; that is what makes a stolen
  # database worthless. Unset = escrow off, which is the default.
  # FILEX_INSTALLATION_E2E_ESCROW_KEY: "MIIBoj..."
  # Turning escrow on for a release that is already running needs this too,
  # for exactly one boot. It is NOT retroactive: no operator action gives an
  # existing encrypted folder an escrow slot. Their OWNERS are offered one at
  # unlock and can grant it with the folder password. Changing or removing
  # the key is still refused, flag or no flag.
  # docs/CONFIGURATION.md#adopting-escrow-later
  # FILEX_INSTALLATION_E2E_ESCROW_ADOPT: "1"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits: {}

nodeSelector: {}
tolerations: []
affinity: {}
# ⚠ Empty means the container runs as ROOT, which is what the image has
# always done. To run it as somebody else, set BOTH — `runAsUser` alone
# leaves the PVC owned by root and filex cannot open its own database:
#
#   podSecurityContext:
#     runAsUser: 1000
#     runAsGroup: 1000
#     fsGroup: 1000          # this is what re-owns the volume
#
# ⚠ On an EXISTING release whose PVC is full of root-owned files, the
# simpler move is `extraEnv: { PUID: "1000", PGID: "1000" }`: the
# entrypoint chowns the data directory once and then drops privilege,
# whereas fsGroup only fixes the group. See docs/DOCKER.md.
podSecurityContext: {}
securityContext: {}
