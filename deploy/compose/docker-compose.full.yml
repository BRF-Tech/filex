# filex — full stack (production-shaped) with toggleable integrations.
#
# Always-on core:  filex + PostgreSQL (DB) + Redis (queue) + Caddy (HTTPS proxy)
# Opt-in add-ons:  ONLYOFFICE · draw.io · S3 server (Versity S3 Gateway)
#                  · ClamAV (antivirus — this image ships no scanner)
#
# ── Toggling add-ons ────────────────────────────────────────────────────
# Every add-on is a Compose *profile*. Turn one on/off in your .env by editing
# COMPOSE_PROFILES (comma list) together with the matching FILEX_*_URL:
#
#   COMPOSE_PROFILES=onlyoffice,drawio,versitygw,clamav
#
# To drop ONLYOFFICE tomorrow: remove `onlyoffice` from COMPOSE_PROFILES and
# blank FILEX_ONLYOFFICE_URL, then:
#   docker compose -f docker-compose.full.yml --env-file .env up -d --remove-orphans
#
# Mermaid needs no service — filex renders .mmd / .mermaid in the browser.
#
# 1. cp .env.example .env   &&   edit domains + secrets + COMPOSE_PROFILES
# 2. Point DNS for every ENABLED domain at this host (80/443 open for HTTPS).
# 3. docker compose -f docker-compose.full.yml --env-file .env up -d
# 4. docker compose -f docker-compose.full.yml logs -f filex   # first-run admin creds
#
# Then add an S3 storage in the admin UI backed by the bundled S3 server:
#   driver=s3, endpoint=http://versitygw:7070, path_style=true,
#   region=us-east-1 (part of the signature: `auto` is refused),
#   bucket=<your bucket>, prefix=filex, access_key/secret_key = S3_ACCESS_KEY /
#   S3_SECRET_KEY. Or seed it as the default storage (.env, Option A).

services:
  filex:
    image: ghcr.io/brf-tech/filex:latest       # full image (thumbnails included)
    environment:
      FILEX_PUBLIC_URL: https://${FILEX_DOMAIN}
      FILEX_DB_DRIVER: postgres
      FILEX_DB_DSN: postgres://filex:${POSTGRES_PASSWORD}@postgres:5432/filex?sslmode=disable
      FILEX_QUEUE_DRIVER: redis
      FILEX_QUEUE_DSN: redis://redis:6379/0
      FILEX_THUMBS_ENABLED: "true"
      # ── Antivirus (optional) ───────────────────────────────────────────
      # ⚠ This image contains no scanner — the ClamAV image plus its unpacked
      # signature database is close to a gigabyte on disk, which is why it is
      # not baked in. Use the `clamav` service in this file instead:
      # filex streams each file to the daemon, so the two containers need a
      # network route and NOT a shared filesystem. Two steps: uncomment the
      # address below, and start with `--profile clamav`.
      # FILEX_CLAMAV_ADDR: "clamav:3310"      # -> antivirus.clamd_addr, and
      #                                       #    seeds antivirus.mode=daemon
      #
      # Same host over a unix socket instead (share the socket directory):
      # FILEX_CLAMAV_ADDR: "/var/run/clamav/clamd.ctl"
      #
      # FILEX_CLAMAV: "0"                     # the on/off switch (default on)
      # FILEX_CLAMAV_MODE: "daemon"           # or "binary" (a scanner on PATH)
      # FILEX_CLAMAV_BIN: /usr/bin/clamdscan  # binary mode only, and env-only:
      #                                       # this path is EXECUTED, so it is
      #                                       # deliberately not admin-editable
      #
      # ⚠⚠ Every FILEX_CLAMAV* variable except _BIN is a SEED, not an
      # override. Each is read on a boot where its setting has no stored row
      # yet, and never again — after that the value lives in the database and
      # is edited on Settings -> Protection in the admin UI. Changing one here
      # later does nothing, silently.
      #
      # ⚠ The switch, the mode and the address take effect at the NEXT
      # RESTART, in both directions; the two below apply to the next file
      # scanned. The Protection page says which is which.
      # FILEX_CLAMAV_MAX: "104857600"         # bytes -> antivirus.max_scan_mb (rounded up)
      # FILEX_CLAMAV_SAVE_WINDOW_MINUTES: "30" # editor save-scan window, 2-60
      # ── Reaching filex without a browser (docs/PROTOCOLS.md) ───────────
      # The S3 endpoint and /dav are already on and need no port of their own.
      # ⚠ Set this before anybody mints an S3 access key, saves an identity
      # provider on the admin page, puts a PIN on a share (My shares reads it
      # back) or installs an app that signs. The secret must be recoverable
      # (SigV4 recomputes an HMAC chain), so it is sealed with this key rather
      # than hashed. Without it those refuse instead of storing plaintext — and
      # losing it stops every existing access key verifying, so back it up with
      # the database.
      FILEX_SECRET_KEY: ${FILEX_SECRET_KEY:-}
      # Optional operator key escrow for end-to-end encrypted folders, and
      # the one decision on this list that a fresh deployment cannot defer
      # cheaply: a folder wraps its master key to the escrow identity when
      # it is CREATED. Set here, every folder this installation ever has is
      # covered. Decided later, adoption is possible
      # (FILEX_INSTALLATION_E2E_ESCROW_ADOPT=1, once) but is NOT
      # retroactive -- everything created before it stays outside the key,
      # permanently. ⚠ It is a second way into every such folder: read
      # docs/E2E-ENCRYPTION.md on what its use-notification can and cannot
      # promise before turning it on. Leave blank for no escrow.
      # Mint with: filex e2e-escrow keygen  (prints the private half ONCE
      # and stores it nowhere -- keep it where you keep a root password).
      FILEX_INSTALLATION_E2E_ESCROW_KEY: ${FILEX_INSTALLATION_E2E_ESCROW_KEY:-}
      # Which peers may tell filex a client's address (X-Forwarded-For /
      # X-Real-IP): the address the sign-in attempt limit counts by and the
      # audit log records. Blank = "auto": this machine and the containers on
      # filex's own networks - the caddy service on this compose network
      # included - never a network's gateway, never the LAN.
      # ⚠ A CDN in front of Caddy (Cloudflare's proxied DNS, say) is a PUBLIC
      # hop: list its published ranges (https://www.cloudflare.com/ips/) or
      # every visitor resolves to an edge address and shares its sign-in
      # counter - ten wrong passwords from anyone lock out everybody who
      # arrives through that edge. A list REPLACES the default, so keep auto:
      #   FILEX_TRUSTED_PROXIES=auto,173.245.48.0/20,103.21.244.0/22,...
      # ⚠ A proxy on the HOST instead of the caddy service reaches filex
      # through a published port and arrives from this network's gateway: list
      # it ("auto, <gateway>") only with the port published on 127.0.0.1.
      # The Sign-in security admin page names such a peer, offers to add it,
      # and wins once it saves a list. docs/CONFIGURATION.md -> "Trusted proxies".
      FILEX_TRUSTED_PROXIES: ${FILEX_TRUSTED_PROXIES:-}
      # SFTP / FTPS / NFS each open a LISTENER, so they stay off until asked
      # for — and each needs its port published below and opened on the
      # firewall. ⚠ FTPS also needs the whole passive range, or transfers hang
      # with no error on either side.
      FILEX_SFTP: ${FILEX_SFTP:-0}
      FILEX_FTPS: ${FILEX_FTPS:-0}
      FILEX_FTPS_PUBLIC_HOST: ${FILEX_DOMAIN}
      # Optional: hand FTPS the real certificate Caddy already renews for
      # FILEX_DOMAIN instead of the generated self-signed one. The files are
      # re-read when they change, so a renewal needs no restart. Mount the
      # certificate directory read-only (see the volumes block) and point at
      # the two files inside it.
      # FILEX_FTPS_CERT: /certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${FILEX_DOMAIN}/${FILEX_DOMAIN}.crt
      # FILEX_FTPS_KEY:  /certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${FILEX_DOMAIN}/${FILEX_DOMAIN}.key
      FILEX_NFS: ${FILEX_NFS:-0}
      # External integrations — each is blank unless you enable it (see header).
      # filex offers an integration as soon as its URL is set; it does not hide
      # one that is down. Settings -> External services -> Test says whether
      # filex AND your browser can actually reach it.
      FILEX_ONLYOFFICE_URL: ${FILEX_ONLYOFFICE_URL:-}
      FILEX_ONLYOFFICE_JWT: ${ONLYOFFICE_JWT_SECRET:-}
      # Only when the document server cannot reach FILEX_PUBLIC_URL (a public
      # hostname that does not resolve on the compose network, say). Empty
      # keeps the public URL, which is right for this stack as written.
      FILEX_ONLYOFFICE_CALLBACK_URL: ${FILEX_ONLYOFFICE_CALLBACK_URL:-}
      # The editor's api.js in a frame on the document server's own origin
      # instead of in filex's pages: https://${ONLYOFFICE_DOMAIN} (the Caddyfile
      # sends /filex-frame/* there to filex). Empty keeps it in filex's pages.
      FILEX_ONLYOFFICE_FRAME_ORIGIN: ${FILEX_ONLYOFFICE_FRAME_ORIGIN:-}
      FILEX_DRAWIO_URL: ${FILEX_DRAWIO_URL:-}
      # ── Zero-touch config (fill in .env) ────────────────────────────────
      # SSO: set FILEX_AUTH_DRIVERS=local,oidc + the FILEX_OIDC_* vars. These
      # are read on EVERY boot; the admin, SMTP, site name, trash retention and
      # default storage below are seeded on the FIRST boot only.
      FILEX_AUTH_DRIVERS: ${FILEX_AUTH_DRIVERS:-local}
      FILEX_OIDC_ISSUER: ${FILEX_OIDC_ISSUER:-}
      FILEX_OIDC_CLIENT_ID: ${FILEX_OIDC_CLIENT_ID:-}
      FILEX_OIDC_CLIENT_SECRET: ${FILEX_OIDC_CLIENT_SECRET:-}
      FILEX_OIDC_REDIRECT_URL: ${FILEX_OIDC_REDIRECT_URL:-}
      FILEX_OIDC_ROLE_CLAIM: ${FILEX_OIDC_ROLE_CLAIM:-}
      FILEX_OIDC_ADMIN_GROUP: ${FILEX_OIDC_ADMIN_GROUP:-}
      FILEX_ADMIN_EMAIL: ${FILEX_ADMIN_EMAIL:-}
      FILEX_ADMIN_PASSWORD: ${FILEX_ADMIN_PASSWORD:-}
      FILEX_SMTP_HOST: ${FILEX_SMTP_HOST:-}
      FILEX_SMTP_PORT: ${FILEX_SMTP_PORT:-587}
      FILEX_SMTP_USERNAME: ${FILEX_SMTP_USERNAME:-}
      FILEX_SMTP_PASSWORD: ${FILEX_SMTP_PASSWORD:-}
      FILEX_SMTP_FROM: ${FILEX_SMTP_FROM:-}
      FILEX_SMTP_TLS: ${FILEX_SMTP_TLS:-starttls}
      FILEX_SITE_NAME: ${FILEX_SITE_NAME:-}
      FILEX_TRASH_RETENTION_DAYS: ${FILEX_TRASH_RETENTION_DAYS:-}
      # Default storage seeded on first boot. Default = a local folder on the
      # ./files bind-mount. Switch to the bundled S3 server by setting
      # DRIVER=s3 + the S3 vars in .env and enabling the versitygw profile (it
      # makes the bucket itself on start).
      FILEX_DEFAULT_STORAGE_DRIVER: ${FILEX_DEFAULT_STORAGE_DRIVER:-local}
      FILEX_DEFAULT_STORAGE_PATH: ${FILEX_DEFAULT_STORAGE_PATH:-/srv/files}
      # Connect an existing external storage of any driver (sftp/webdav/ftp):
      # set DRIVER + this raw JSON config. See .env.example.
      FILEX_DEFAULT_STORAGE_CONFIG: ${FILEX_DEFAULT_STORAGE_CONFIG:-}
      FILEX_DEFAULT_STORAGE_S3_BUCKET: ${FILEX_DEFAULT_STORAGE_S3_BUCKET:-}
      FILEX_DEFAULT_STORAGE_S3_PREFIX: ${FILEX_DEFAULT_STORAGE_S3_PREFIX:-files}
      FILEX_DEFAULT_STORAGE_S3_ENDPOINT: ${FILEX_DEFAULT_STORAGE_S3_ENDPOINT:-}
      FILEX_DEFAULT_STORAGE_S3_REGION: ${FILEX_DEFAULT_STORAGE_S3_REGION:-auto}   # us-east-1 for the bundled server
      FILEX_DEFAULT_STORAGE_S3_ACCESS_KEY: ${FILEX_DEFAULT_STORAGE_S3_ACCESS_KEY:-}
      FILEX_DEFAULT_STORAGE_S3_SECRET_KEY: ${FILEX_DEFAULT_STORAGE_S3_SECRET_KEY:-}
      FILEX_DEFAULT_STORAGE_S3_PATH_STYLE: ${FILEX_DEFAULT_STORAGE_S3_PATH_STYLE:-true}
    # ⚠ Uncomment the ones you switched on above. They are NOT behind Caddy:
    # SFTP, FTPS and NFS are raw TCP and cannot go through an HTTP proxy, so
    # each is published straight from the container and has to be opened on the
    # firewall too. The web UI, the S3 endpoint and /dav all arrive over 443
    # via Caddy and need nothing here.
    # ports:
    #   - "2022:2022"               # FILEX_SFTP
    #   - "2121:2121"               # FILEX_FTPS control channel
    #   - "30000-30100:30000-30100" # ⚠ FILEX_FTPS passive range — without the
    #                               #   WHOLE range, transfers hang with no
    #                               #   error on either side
    #   - "2049:2049"               # ⚠ FILEX_NFS — unencrypted, LAN/VPN only
    volumes:
      # DB (if you switch to sqlite), search index, upload staging, cached
      # thumbnails, first-run secret. A cached thumbnail is released when its
      # file is purged, and orphans are swept every FILEX_THUMBS_SWEEP_INTERVAL
      # (default 6h; "0" disables the sweep).
      - filex-data:/data
      # - caddy-data:/certs:ro    # FILEX_FTPS_CERT/_KEY — Caddy's certificate store, read-only
      - ./files:/srv/files        # default local storage folder (seeded on boot)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: filex
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filex"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      FILEX_DOMAIN: ${FILEX_DOMAIN}
      # Add-on domains fall back to *.localhost (self-signed, never reached) when
      # you don't run that add-on — no public cert is requested for it.
      ONLYOFFICE_DOMAIN: ${ONLYOFFICE_DOMAIN:-onlyoffice.localhost}
      DRAWIO_DOMAIN: ${DRAWIO_DOMAIN:-drawio.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - filex
    restart: unless-stopped

  # ── Opt-in add-ons (Compose profiles) ──────────────────────────────────
  onlyoffice:
    image: onlyoffice/documentserver:latest
    profiles: ["onlyoffice"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}     # must match FILEX_ONLYOFFICE_JWT
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
    restart: unless-stopped

  drawio:
    image: jgraph/drawio:latest
    profiles: ["drawio"]
    environment:
      DRAWIO_SELF_CONTAINED: "1"
    restart: unless-stopped

  # ClamAV as its own container — the normal way to scan under Docker, since
  # the filex image ships no scanner. Start it with `--profile clamav` and set
  # FILEX_CLAMAV_ADDR: "clamav:3310" above.
  #
  # ⚠ The daemon refuses commands for the first minute or two after it starts
  # while it loads its signature database. filex reports that as "not
  # answering" on Settings -> Protection rather than as a scanner that works,
  # and scans queued in the meantime retry.
  clamav:
    image: clamav/clamav:latest
    profiles: ["clamav"]
    volumes:
      # ⚠ Keep the signature database across restarts. Without this volume
      # every restart re-downloads the ~300 MB signature set from ClamAV's
      # mirrors, which is both slow and a good way to get rate-limited.
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  # The bundled S3 server (versitygw profile): Versity S3 Gateway, posix
  # backend. Every object is a plain file under s3-data/<bucket>/<key>, and
  # a bucket is a directory: the entrypoint makes the default one before the
  # gateway starts, so an s3 default storage seeds cleanly.
  # ⚠ The region is part of the signature: us-east-1 (filex signs a blank
  #   region as `auto`, which the gateway refuses).
  # Versioning is available (s3-versions holds the older versions; a bucket
  # turns it on with PutBucketVersioning). filex keeps its own versions and
  # does not need it; see docs/STORAGE.md, "A local S3 server".
  # ⚠ This replaced the bundled MinIO (minio/minio is no longer published).
  #   An old minio-data volume is in MinIO's own format: copy it across
  #   first (docs/STORAGE.md, "Moving off the bundled MinIO").
  versitygw:
    image: versity/versitygw:v1.8.0
    profiles: ["versitygw"]
    entrypoint: ["/bin/sh", "-c", "mkdir -p \"/data/$$S3_BUCKET\" && exec /usr/local/bin/docker-entrypoint.sh"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${FILEX_DEFAULT_STORAGE_S3_BUCKET:-filex}
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_VERSIONING_DIR: /versions
      VGW_HEALTH: /health
    volumes:
      - s3-data:/data
      - s3-versions:/versions
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  filex-data:
  clamav-db:
  postgres-data:
  redis-data:
  onlyoffice-data:
  s3-data:
  s3-versions:
  caddy-data:
  caddy-config:
