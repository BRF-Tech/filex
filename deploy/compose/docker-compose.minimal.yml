# filex — minimal single-container stack.
#
# Just filex: SQLite database, embedded search + thumbnails, and one local
# storage folder. No external services. Great for trying it out or small use.
#
#   docker compose -f docker-compose.minimal.yml up -d
#   docker compose -f docker-compose.minimal.yml logs -f   # first-run admin creds
#   open http://localhost:5212/admin   # the operator's panel
#   open http://localhost:5212/drive   # the same file manager, for your users
#
# The first run prints (once) the generated admin@local password; it is also
# saved to the filex-data volume at /data/.first-run.txt (mode 0600).

services:
  filex:
    image: ghcr.io/brf-tech/filex:latest
    ports:
      - "5212:5212"
    environment:
      # ⚠ Must be the URL users actually open in the browser — every share
      # link and every link in an e-mail is built on it. `http://localhost:5212`
      # is only right on the machine running this file; on a server, behind a
      # reverse proxy, set your real https://… domain or every share link will
      # say localhost (issue #32). The variable is spelled exactly like this;
      # FILEX_APPLICATION_URL, APP_URL and BASE_URL are not read.
      FILEX_PUBLIC_URL: http://localhost:5212
      # A local storage is auto-created on first boot pointing at /srv/files
      # (the ./files bind-mount below) — so you can upload immediately, no
      # admin-UI setup needed.
      FILEX_DEFAULT_STORAGE_DRIVER: local
      FILEX_DEFAULT_STORAGE_PATH: /srv/files
      # The container runs as ROOT by default, so everything it writes into
      # /data is root-owned and you need sudo to delete your own data
      # directory. Uncomment these two (with YOUR ids -- `id -u`, `id -g`)
      # and the entrypoint takes ownership of /data once and drops to that
      # user. Safe on an install that has been running as root; see
      # docs/DOCKER.md -> "Which user the container runs as".
      # PUID: 1000
      # PGID: 1000
      # Optional: preset the first admin instead of a random password.
      # FILEX_ADMIN_EMAIL: admin@example.com
      # FILEX_ADMIN_PASSWORD: change-me
    volumes:
      # DB + search index + thumbnail cache + first-run secret.
      - filex-data:/data
      # The folder your files live in (seeded as the default local storage).
      - ./files:/srv/files
    restart: unless-stopped

volumes:
  filex-data:
