manifestVersion: 1
id: filex
category: files
name: filex
version: "0.4.0"
tagline: Self-hosted file manager for all your storages
description: >-
  filex is a fast, self-hosted file manager with a single-binary backend and a
  modern web UI. Browse, upload, preview, rename, share and edit files across
  pluggable storage backends — local folders, S3/MinIO, SFTP, WebDAV, FTP and
  SMB/NAS shares.


  It also works the other way round: the same tree is reachable AS S3, SFTP,
  FTPS, NFS and WebDAV, so rclone, restic, aws s3, WinSCP, a backup job or a
  media player can point straight at it — with the same permissions, trash and
  quota as the web UI. `filex mount` attaches it as a folder on Linux or a
  drive letter on Windows.


  Highlights: public share links with PIN and expiry, file-drop upload links,
  resumable uploads, full-text search, image/video/PDF thumbnails, trash and
  file versioning, role-based access control, TOTP 2FA, optional SSO
  (OIDC/LDAP), a desktop app with two-way folder sync, an embeddable web
  component, and an AI/MCP API for agents. OnlyOffice and draw.io can be
  connected for in-browser document and diagram editing.


  On Umbrel, filex stores its database in the app data directory and manages a
  dedicated files folder out of the box. Sign in with the username and password
  shown by Umbrel, then add more storages in the admin UI.
