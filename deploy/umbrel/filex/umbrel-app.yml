releaseNotes: |-
  filex v0.43.0 — 2026-09-24
  • Apps (app plugins) — a sandboxed plugin that adds things to do with files.
  • Language packs — filex can be translated without a release.
  • Right-to-left layout.
  • Appearance: the instance can wear your colours.
  • Desktop sync is live: an edit on either side arrives in about a second.
  Full changelog: https://github.com/BRF-Tech/filex/blob/main/CHANGELOG.md
tagline: Self-hosted file manager for all your storages
description: >-
  filex is a fast, self-hosted file manager with a single-binary backend and a
  modern web UI. Browse, upload, preview, rename, share and edit files across
  pluggable storage backends — local folders, S3/MinIO, SFTP, WebDAV, FTP and
  SMB/NAS shares.


  It also works the other way round: the same tree is reachable AS S3, SFTP,
  FTPS, NFS and WebDAV, so rclone, restic, aws s3, WinSCP, a backup job or a
  media player can point straight at it — with the same permissions, trash and
  quota as the web UI. `filex mount` attaches it as a folder on Linux or a
  drive letter on Windows.


  Browsing opens on Home — your storages, what you opened last, what you
  starred. + New makes a folder or a document: Markdown, text, CSV or code
  straight away, and Word, Excel, PowerPoint or OpenDocument once an
  ONLYOFFICE server is connected. The templates are real documents compiled
  into the binary, so nothing here needs LibreOffice installed. Select a dozen
  files and Download hands back one ZIP, streamed rather than assembled, so a
  large archive costs the server almost no memory. Every file records its
  owner, so the listing has an Owner column, the filter row a People entry,
  and quota counts against the owner rather than whoever touched the file
  last.


  Highlights: public share links with PIN and expiry, file-drop upload links,
  resumable uploads, full-text search, thumbnails of the file itself (a PDF's
  first page, a video's first frame that is not black, a text file's first
  lines), trash and file versioning, end-to-end encrypted folders (encrypted
  in your browser, so the server only ever holds ciphertext) each with a
  recovery key shown once, role-based access control, TOTP 2FA, optional SSO
  (OIDC/LDAP), a desktop app with two-way folder sync, an embeddable web
  component, and an AI/MCP API for agents. An open folder keeps itself current
  over a WebSocket, so a file somebody else uploads appears without a refresh.
  ONLYOFFICE and draw.io can be connected for in-browser document and diagram
  editing, and so can a ClamAV container: give filex its address and every
  file written is scanned, with infected ones quarantined into the trash.


  On Umbrel, filex stores its database in the app data directory and manages a
  dedicated files folder out of the box. Sign in with the username and
  password shown by Umbrel, then add more storages in the admin UI.
