# /etc/nginx/sites-available/demo-fm.brf.sh
# CloudPanel-managed; if you edit by hand, copy this out before the
# next CloudPanel sync overwrites it.

server {
    listen 80;
    listen [::]:80;
    server_name demo-fm.brf.sh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo-fm.brf.sh;

    ssl_certificate     /etc/letsencrypt/live/demo-fm.brf.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo-fm.brf.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Filex requires real client IP for audit + rate limiting.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Long-lived uploads (multipart presigned PUT goes direct-to-S3 so
    # only the init/finalize JSON is proxied, but be generous anyway).
    client_max_body_size 5G;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # WebSocket / SSE friendly (sync worker streaming progress later).
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:5212;
    }

    # Gzip for the embedded admin SPA.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
