# filex on CasaOS — compose with the x-casaos store extension.
# Schema modelled on the official CasaOS AppStore entries
# (github.com/IceWhaleTech/CasaOS-AppStore, e.g. Apps/Nextcloud).
#
# Install: CasaOS UI -> App Store -> "Install a customized app" -> paste this
# file (or drop the folder into a CasaOS app store repo).
name: filex
services:
  filex:
    image: ghcr.io/brf-tech/filex:v0.42.1
    container_name: filex
    network_mode: bridge
    restart: unless-stopped
    ports:
      - target: 5212
        published: "5212"
        protocol: tcp
    environment:
      # Set to the URL you actually open, e.g. http://<NAS-IP>:5212 — share
      # links and SSO redirects are built from it.
      FILEX_PUBLIC_URL: http://localhost:5212
      # Seed a local storage on first boot so uploads work immediately.
      FILEX_DEFAULT_STORAGE_DRIVER: local
      FILEX_DEFAULT_STORAGE_PATH: /srv/files
      # Optional: preset the first admin instead of a random password.
      # FILEX_ADMIN_EMAIL: admin@example.com
      # FILEX_ADMIN_PASSWORD: change-me
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
      - type: bind
        source: /DATA/AppData/$AppID/files
        target: /srv/files
      - type: bind
        source: /DATA
        target: /media/DATA
    x-casaos:
      envs:
        - container: FILEX_PUBLIC_URL
          description:
            en_US: The URL users open in the browser (http://<NAS-IP>:5212). Share links and SSO redirects are built from it.
      ports:
        - container: "5212"
          description:
            en_US: Web UI + API port
      volumes:
        - container: /data
          description:
            en_US: filex database (SQLite), search index and thumbnail cache.
        - container: /srv/files
          description:
            en_US: Default storage folder, seeded on first boot.
        - container: /media/DATA
          description:
            en_US: Whole CasaOS /DATA folder — add it as an extra "local" storage in the filex admin UI to manage your NAS files.

x-casaos:
  architectures:
    - amd64
    - arm64
  main: filex
  author: BRF-Tech
  developer: BRF-Tech
  category: Cloud
  description:
    en_US: >-
      filex is a fast, self-hosted file manager: browse, upload, preview,
      share and edit files across local folders, S3/MinIO, SFTP, WebDAV,
      FTP and SMB/NAS shares. It also works the other way round — the same
      tree is reachable AS S3, SFTP, FTPS, NFS and WebDAV, so rclone,
      restic, WinSCP or a media player can point straight at it, and
      `filex mount` attaches it as a drive. Browsing opens on Home — your
      storages, what you opened last, what you starred — and + New
      makes a folder or a document: Markdown, text, CSV or code straight
      away, and Word, Excel, PowerPoint or OpenDocument once you connect
      an OnlyOffice server. The templates are real documents compiled into
      the binary, so no LibreOffice is installed anywhere. A multi-file
      selection downloads as one streamed ZIP. Public share links with PIN
      and expiry, file-drop upload links, resumable uploads, full-text
      search, thumbnails of the file itself (a PDF's first page, a video's
      first frame that is not black, a text file's first lines), trash and
      versioning, file ownership with an Owner column and a People filter,
      end-to-end encrypted folders with a recovery key, RBAC, TOTP 2FA,
      optional SSO (OIDC/LDAP), a desktop app with folder sync and an
      AI/MCP API for agents. An open folder keeps itself up to date over a
      WebSocket, so a file somebody else uploads appears without a
      refresh. Antivirus is optional and needs no fatter image: point
      filex at a ClamAV container over the network and every file written
      is scanned, infected ones quarantined into the trash. On first start
      it creates an admin account and prints the password once in the
      container logs (also saved to /data/.first-run.txt), unless
      FILEX_ADMIN_EMAIL / FILEX_ADMIN_PASSWORD are set.
  tagline:
    en_US: Self-hosted file manager for all your storages
  title:
    en_US: filex
  icon: https://raw.githubusercontent.com/BRF-Tech/filex/main/docs/logo.png
  # ⚠ The social card is NOT under docs/screenshots and never was — it is
  # rendered from site/social-preview.src.html into site/assets/, and site/ is
  # withheld from the public repository, so no raw.githubusercontent URL can
  # reach it. filex.sh serves it (the og:image of site/index.html).
  thumbnail: https://filex.sh/assets/social-preview.png
  # The current release's pictures (e2e/shots/release.mjs names the folder).
  screenshot_link:
    - https://raw.githubusercontent.com/BRF-Tech/filex/main/docs/screenshots/v0.41.1/explorer-grid-light.png
    - https://raw.githubusercontent.com/BRF-Tech/filex/main/docs/screenshots/v0.41.1/admin-dashboard.png
    - https://raw.githubusercontent.com/BRF-Tech/filex/main/docs/screenshots/v0.41.1/share-modal.png
  tips:
    before_install:
      en_US: >-
        After install, check the container logs for the one-time admin@local
        password (or set FILEX_ADMIN_EMAIL / FILEX_ADMIN_PASSWORD before
        starting). Set FILEX_PUBLIC_URL to the address you really use.
        Antivirus is off until you run a scanner: this image ships none, so
        install a ClamAV container and give filex its address on
        Settings -> Protection.
  index: /
  port_map: "5212"
  scheme: http
  store_app_id: filex
  version: "0.42.1"
  website: https://filex.sh
  repo: https://github.com/BRF-Tech/filex
  support: https://github.com/BRF-Tech/filex/issues
