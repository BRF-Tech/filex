# goreleaser config for filex
# Docs: https://goreleaser.com
#
# Build matrix: linux/darwin/windows × amd64/arm64 (8 binaries)
# CGO_ENABLED=0 + modernc.org/sqlite — no C toolchain needed.
#
# Pre-flight assumes web/dist and packages/webcomponent/dist already exist
# and have been synced into backend/embed/{admin,web} (see scripts/sync-embed.mjs
# or the GitLab CI job that runs before this).
#
# Usage:
#   goreleaser release --snapshot --clean --skip=publish    # local dry run
#   goreleaser release --clean                              # tag-triggered (GitLab CI)

version: 2

project_name: filex

# NOTE: removed `before.hooks` here because goreleaser v2's stricter
# YAML parser refuses the `sh -c '... && ...'` string forms that v1
# accepted ("yaml: unmarshal errors: cannot unmarshal !!map into
# string"). The hooks were also redundant — the GitLab CI script
# (release:goreleaser) already runs the embed mkdir+cp dance, and
# the build:backend stage takes care of `go mod tidy` indirectly.
# If you need a local-friendly assertion, run scripts/sync-embed.mjs
# before invoking goreleaser.

builds:
  - id: filex
    main: ./cmd/filex
    dir: backend
    binary: filex
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Must match the package var declarations in internal/version/version.go.
      # `-X main.version=...` silently no-ops because cmd/filex/main.go has no
      # `version` symbol; the linker skips unknown -X targets, so binaries
      # ship as "0.1.0-dev (unknown, unknown)" even on tagged release builds.
      - -s -w
      - -X github.com/brf-tech/filex/backend/internal/version.Version={{.Version}}
      - -X github.com/brf-tech/filex/backend/internal/version.Commit={{.ShortCommit}}
      - -X github.com/brf-tech/filex/backend/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Reproducible builds-friendly mod-timestamp.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: filex
    # `ids:` (was `builds:` — renamed upstream; the old key still works but
    # `goreleaser check` now exits non-zero on it).
    ids:
      - filex
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

  # ⚠ A second, UNVERSIONED set of bare binaries. docs/CLI.md tells people to
  # install with one line —
  #   curl -fL -o filex .../releases/latest/download/filex-linux-amd64
  # — and a `latest/download/<name>` link only resolves if an asset with that
  # exact, version-free name exists. None did: the documented install command
  # answered 404 (measured 2026-08-14, against v0.17.1). Publishing the binary
  # under a stable name keeps the promise the docs already made, and keeps it
  # true release after release rather than depending on somebody remembering to
  # upload it by hand.
  - id: filex-bare
    ids:
      - filex
    name_template: "filex-{{ .Os }}-{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# ── Package managers: the CLI as `filex` ─────────────────────────────────
#
# Names (Burak, 2026-09-25): the CLI is plain `filex` in every package
# manager — the command's own name — and the desktop app is `filex-app`
# (desktop/scripts/pkg-manifests.mjs publishes that one after the installers
# are built). Homebrew's own rule for an app beside a same-named tool is the
# `-app` suffix (tailscale/tailscale-app, ollama/ollama-app).
#
# ⚠ Both blocks publish only from GitHub Actions (release.yml passes the
# deploy key and the token); the GitLab release job runs with --skip=publish. And both skip
# themselves when their token is not there — an unset variable in a template
# would otherwise fail the whole release, binaries and all.
#
# ⚠ `brews` (formulas) is deprecated for pre-built binaries; casks are what
# Homebrew wants for them. A cask's download is quarantined on macOS, and the
# binary is not signed with a Developer ID (no Developer ID — Burak's call), so
# the caveat says how to let it through. Removing the quarantine for people
# (the documented xattr hook) is what Homebrew declines to make easy, and its
# legacy postflight block is deprecated for third-party taps.
homebrew_casks:
  - name: filex
    ids:
      - filex                     # the tar.gz archives, not the 185 MB bare binaries
    binaries:
      - filex
    directory: Casks
    homepage: "https://filex.sh/"
    description: "Self-hosted file manager: server, folder sync and CLI in one binary"
    caveats: |
      On macOS: filex is not signed with an Apple Developer ID, so macOS may
      refuse to run it the first time. Allow it once in System Settings →
      Privacy & Security ("Open Anyway"), then run the command again.
    commit_author:
      name: filex release
      email: hello@brf.sh
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}auto{{ else }}true{{ end }}'
    repository:
      owner: BRF-Tech
      name: homebrew-filex
      branch: main
      # A deploy key with write access to the tap and nothing else (added
      # 2026-09-25, "filex release pipeline"); the private half lives only in
      # this repository's HOMEBREW_TAP_DEPLOY_KEY secret. Rotating it = a new
      # key pair, swap the deploy key and the secret.
      git:
        url: "git@github.com:BRF-Tech/homebrew-filex.git"
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'

winget:
  - name: filex                   # also the Moniker: `winget install filex`
    package_identifier: BRFTech.filex
    package_name: filex
    # What Apps & features shows for filex's own installers (the desktop NSIS
    # writes "BRF Tech" from package.json's author).
    publisher: BRF Tech
    publisher_url: "https://github.com/BRF-Tech"
    publisher_support_url: "https://github.com/BRF-Tech/filex/issues"
    privacy_url: "https://filex.sh/privacy/"
    homepage: "https://filex.sh/"
    license: MIT
    license_url: "https://github.com/BRF-Tech/filex/blob/main/LICENSE"
    copyright: "© BRF Tech"
    short_description: "filex server, folder sync and command-line client in one binary"
    release_notes_url: "{{ .ReleaseURL }}"
    tags:
      - file-manager
      - file-sync
      - self-hosted
      - webdav
      - sftp
      - s3
      - cli
    # ⚠ No `additional_locales`: goreleaser (v2.18) copies `Moniker` into the
    # extra locale manifest, which the schema allows only in the default one —
    # `winget validate` answers "Unknown field. [Moniker]" (measured on a
    # snapshot build, 2026-09-25). The desktop app's manifests carry tr-TR.
    # The Windows zip: winget installs it as a portable package and puts a
    # `filex` command on the PATH. The desktop app adds nothing to the PATH
    # (NSIS and MSIX alike), so the two never shadow each other.
    ids:
      - filex
    commit_author:
      name: filex release
      email: hello@brf.sh
    # Pinned, because release.yml's "Did the CLI reach winget" step looks the
    # pull request up by exactly this title.
    commit_msg_template: "New version: {{ .PackageIdentifier }} {{ .Version }}"
    skip_upload: '{{ if envOrDefault "WINGET_TOKEN" "" }}auto{{ else }}true{{ end }}'
    repository:
      # The fork the pull request comes from: the account that owns WINGET_TOKEN.
      owner: brkfun
      name: winget-pkgs
      token: '{{ envOrDefault "WINGET_TOKEN" "" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{.ShortCommit}}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  # GitLab native release. Set GITLAB_TOKEN in CI env.
  gitlab:
    owner: brftech
    name: filemanager
  draft: false
  replace_existing_draft: true
  prerelease: auto
  name_template: "v{{ .Version }}"
  # The interface's string catalogue — every key, its English, and which
  # grammar a translation of it follows — so a translator can start a
  # language pack from the release alone (docs/PLUGIN-KIT.md → "Writing a
  # language pack"). The web build writes it (web/vite.config.ts) and the
  # embed step copies it here with the SPA, so it is always the catalogue of
  # THIS release's interface.
  extra_files:
    - glob: ./backend/embed/admin/i18n/filex-catalogue-*.json
  header: |
    ## filex v{{ .Version }}

    Self-hosted file manager — Go single binary + multi-framework frontend.

    Download a binary below, or pull a Docker image:

    ```bash
    docker pull ghcr.io/brf-tech/filex:slim-{{ .Tag }}
    docker pull ghcr.io/brf-tech/filex:full-{{ .Tag }}
    ```
  # ⚠ Every URL here has to survive scripts/export-public.sh, which rewrites
  # this file on the way to the public repo. A GitLab route (`/-/issues`) used
  # to arrive on GitHub verbatim and 404 on every release page from v0.33.0 to
  # v0.35.0 — the export now translates the route shape too, and refuses the
  # export if a `github.com/.../-/...` survives anywhere in the tree. Write
  # GitLab-canonical URLs here and let the export do the translation; do not
  # hand-write github.com URLs, because then the GitLab side is the wrong one.
  #
  # ⚠ The four lines are indented under a `-` so Markdown renders them as a
  # list. Bare `Issues: <url>` lines were joined into one paragraph by GitHub's
  # renderer, which is why the release pages showed them run together.
  footer: |
    ---
    **Verify:** `sha256sum -c checksums.txt`

    - **Documentation** — <https://docs.filex.sh>
    - **Report a bug** — <https://github.com/BRF-Tech/filex/issues>
    - **Full changelog** — <https://github.com/BRF-Tech/filex/blob/main/CHANGELOG.md>
    - **Every release** — <https://github.com/BRF-Tech/filex/releases>

