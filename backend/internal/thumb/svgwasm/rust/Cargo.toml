[package]
name = "filex-svgthumb"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# resvg is Apache-2.0 OR MIT since 0.46. No system fonts, no file system,
# no network: everything the guest sees arrives through the exports below.
resvg = { version = "=0.48.1", default-features = false, features = ["text", "raster-images"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
