# filex GitLab CI pipeline.
#
# Stages
#   lint    : Go vet + staticcheck + gofmt; eslint workspaces.
#   test    : Go race + cover; pnpm -r test.
#   build   : npm packages -> admin UI -> Go binary (with embed).
#   release : tag-triggered. goreleaser binaries, npm publish to GitLab
#             package registry, Docker push (slim + full) to GitLab container
#             registry.
#
# Cache strategy
#   - pnpm store : keyed on pnpm-lock.yaml; shared across web/lint/test/build jobs.
#   - go build  : keyed on go.sum; shared across go jobs.
# Both use `pull-push` so feature-branch caches still warm up but don't pollute
# main.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   GITLAB_TOKEN        : maintainer-scoped PAT (api, write_repository) for goreleaser
#   CI_REGISTRY_*       : provided automatically
#   CI_JOB_TOKEN        : provided automatically (used for npm publish + container registry)

stages:
  - lint
  - test
  - build
  - release

variables:
  # Bumped to 1.24 because go-redis/v9 (Round B persistent queue) requires
  # it. The toolchain directive in backend/go.mod auto-downloads 1.24 even
  # on a 1.23 image, but using a 1.24 image avoids an extra download in CI.
  GO_VERSION: "1.24"
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"
  PNPM_HOME: "/root/.local/share/pnpm"
  GOFLAGS: "-mod=readonly"
  GOPATH: "$CI_PROJECT_DIR/.gocache/go"
  GOCACHE: "$CI_PROJECT_DIR/.gocache/build"

# ---------------------------------------------------------------------------
# Reusable templates
# ---------------------------------------------------------------------------
.node:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - node_modules/
      - packages/*/node_modules/
      - web/node_modules/
    policy: pull-push

.go:
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git ca-certificates
    - mkdir -p .gocache/go .gocache/build
  cache:
    key:
      files:
        - backend/go.sum
    paths:
      - .gocache/
    policy: pull-push

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
lint:go:
  extends: .go
  stage: lint
  script:
    - cd backend
    - go vet ./...
    - go install honnef.co/go/tools/cmd/staticcheck@latest
    - $GOPATH/bin/staticcheck ./...
    - test -z "$(gofmt -l .)" || (echo 'gofmt diff:' && gofmt -d . && exit 1)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:web:
  extends: .node
  stage: lint
  script:
    - pnpm -r lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test:go:
  extends: .go
  stage: test
  script:
    - cd backend
    - go test -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out | tail -1
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.out
    expire_in: 1 week
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:web:
  extends: .node
  stage: test
  script:
    - pnpm -r test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
build:packages:
  extends: .node
  stage: build
  script:
    - pnpm -r --filter='./packages/*' build
  artifacts:
    name: "filex-packages-${CI_COMMIT_SHORT_SHA}"
    paths:
      - packages/core/dist/
      - packages/webcomponent/dist/
      - packages/react/dist/
    expire_in: 1 day

build:admin:
  extends: .node
  stage: build
  needs:
    - job: build:packages
      artifacts: true
  script:
    - pnpm --filter='./web' build
  artifacts:
    name: "filex-admin-${CI_COMMIT_SHORT_SHA}"
    paths:
      - web/dist/
    expire_in: 1 day

build:backend:
  extends: .go
  stage: build
  needs:
    - job: build:packages
      artifacts: true
    - job: build:admin
      artifacts: true
  script:
    - mkdir -p backend/embed/admin backend/embed/web
    - cp -r web/dist/. backend/embed/admin/
    - cp -r packages/webcomponent/dist/. backend/embed/web/
    - cd backend
    - >
      CGO_ENABLED=0 go build
      -trimpath
      -ldflags="-s -w
        -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}
        -X main.commit=${CI_COMMIT_SHORT_SHA}
        -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      -o ../bin/filex
      ./cmd/filex
    - ../bin/filex --version
  artifacts:
    name: "filex-bin-${CI_COMMIT_SHORT_SHA}"
    paths:
      - bin/filex
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Release (tag-triggered only)
# ---------------------------------------------------------------------------
release:goreleaser:
  stage: release
  image: goreleaser/goreleaser:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - job: build:packages
      artifacts: true
    - job: build:admin
      artifacts: true
  before_script:
    - apk add --no-cache git nodejs
  script:
    - mkdir -p backend/embed/admin backend/embed/web
    - cp -r web/dist/. backend/embed/admin/
    - cp -r packages/webcomponent/dist/. backend/embed/web/
    - goreleaser release --clean
  artifacts:
    name: "filex-${CI_COMMIT_TAG}"
    paths:
      - dist/
    expire_in: 30 days

release:npm:
  extends: .node
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - job: build:packages
      artifacts: true
  script:
    # GitLab project-scoped npm registry. CI_JOB_TOKEN has package_registry write.
    - echo "@brftech:registry=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" >> ~/.npmrc
    - echo "//gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
    - pnpm publish --filter='./packages/*' --no-git-checks --access public

release:docker:
  stage: release
  image: docker:25
  services:
    - docker:25-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Slim image
    - >
      docker build
      --build-arg VERSION=${CI_COMMIT_TAG}
      --build-arg COMMIT=${CI_COMMIT_SHORT_SHA}
      --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      -t ${CI_REGISTRY_IMAGE}:slim-${CI_COMMIT_TAG}
      -t ${CI_REGISTRY_IMAGE}:slim
      -t ${CI_REGISTRY_IMAGE}:latest
      -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      -f docker/Dockerfile .
    # Full image
    - >
      docker build
      --build-arg VERSION=${CI_COMMIT_TAG}
      --build-arg COMMIT=${CI_COMMIT_SHORT_SHA}
      --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      -t ${CI_REGISTRY_IMAGE}:full-${CI_COMMIT_TAG}
      -t ${CI_REGISTRY_IMAGE}:full
      -f docker/Dockerfile.full .
    # Push everything we just tagged.
    - docker push --all-tags ${CI_REGISTRY_IMAGE}
