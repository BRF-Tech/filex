name: Microsoft Store (resubmit a release)

# Sends a published release's Store package to the Microsoft Store again, with
# the same script and credentials release.yml uses:
#
#   gh workflow run msstore-resubmit.yml -R BRF-Tech/filex -f tag=v0.47.0
#
# For a release whose own submission did not happen: it was skipped because an
# earlier submission was still in certification, or it failed (v0.47.0 passed
# the package as `-i`, which msstore 0.4.x reads as a directory). The package
# is the msix-<tag> artifact the release run kept (90 days); the script is the
# one on the default branch, so a fix to it applies here at once.
#
# Nothing is rebuilt: the bytes are the ones the release tested.
#
# The package is the .msixbundle (x64 + arm64) when the run built one, else
# its single .appx. A run that only ADDED the ARM packages to a release
# (release.yml -f only=arm64) is dispatched from a branch, not the tag: pass
# its run id as well:
#
#   gh workflow run msstore-resubmit.yml -R BRF-Tech/filex -f tag=v0.48.0 -f run=<run id>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.47.0
        required: true
        type: string
      run:
        description: The release.yml run that kept the package (default, the tag's own run)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  submit:
    runs-on: windows-latest
    env:
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      TAG: ${{ inputs.tag }}
      RUN: ${{ inputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the release's Store package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "tag must look like v1.2.3, got '$env:TAG'" }
          if ($env:RUN -and $env:RUN -notmatch '^\d+$') { throw "run must be a run id, got '$env:RUN'" }
          $run = $env:RUN
          if (-not $run) {
            $run = gh run list -R $env:GITHUB_REPOSITORY --workflow release.yml --limit 100 `
              --json databaseId,headBranch --jq '[.[] | select(.headBranch == env.TAG)][0].databaseId'
          }
          if (-not $run) { throw "no release.yml run for $env:TAG" }
          gh run download $run -R $env:GITHUB_REPOSITORY -n "msix-$env:TAG" -D pkg
          if ($LASTEXITCODE -ne 0) { throw "run $run has no msix-$env:TAG artifact (kept 90 days)" }
          Get-ChildItem pkg
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Submit to the Microsoft Store
        shell: pwsh
        run: |
          # The bundle when there is one; otherwise the .appx, which the CLI
          # takes under an .msix name (.msix/.msixbundle/.msixupload only).
          $msix = (Get-ChildItem pkg/*.msixbundle | Select-Object -First 1).FullName
          if (-not $msix) {
            $appx = Get-ChildItem pkg/*.appx | Select-Object -First 1
            $msix = Join-Path $appx.DirectoryName ($appx.BaseName + '.msix')
            Copy-Item $appx.FullName $msix
          }
          ./.github/workflows/scripts/msstore-submit.ps1 -Msix $msix -Version $env:TAG.TrimStart('v')
