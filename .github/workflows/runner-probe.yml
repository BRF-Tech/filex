name: Runner probe

# Throwaway: answers one question before the release workflow is rewritten to
# depend on it — does this repository get GitHub's free native arm64 runner?
# Building the arm64 image under QEMU is the slowest part of a release (the
# apk layer installs LibreOffice + a JRE under emulation), so the rewrite is
# only worth doing if `ubuntu-24.04-arm` actually resolves here.
#
# Delete this file once the answer is recorded.

on:
  workflow_dispatch:

jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          echo "arch: $(uname -m)"
          echo "kernel: $(uname -a)"
          echo "cpus: $(nproc)"
          echo "mem: $(free -h | awk '/Mem:/{print $2}')"
