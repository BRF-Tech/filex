name: Live S3

# The Go tests that talk to a real S3 server (#364, #365): the provider
# conformance suite, the driver's Init, the B2 report reader over S3 and issue
# #21's rename (backend/internal/testutil/lives3 reads FILEX_TEST_S3_*).
# Weekly, on the `nightly` branch's commit, and by hand on any ref.
#
# The server is the run's own: the Versity S3 Gateway ci.yml's S3 line starts
# (`ci-s3.sh live`, the image e2e/lib/s3server.mjs pins), on 127.0.0.1:7070,
# with a bucket of its own and a root key made up for that container. No
# secret is read and no provider is reached (the owner, 2026-11-18: no real
# token for a test). What it measures is filex's S3 code over the wire against
# a real S3 implementation - requests signed for us-east-1, path-style
# addressing, a listing with a delimiter, a ranged read, a multipart upload, a
# rename by copy, a presigned GET, a delete, the sync worker's catalogue -
# not one provider's behaviour: B2's, AWS's or Garage's own answers are
# measured by hand with the conformance test (docs/STORAGE.md). Until
# 2026-11-18 the build host ran these tests with a B2 demo account's key.
#
# Everywhere else each of them skips itself, and a skip reads as a pass: here
# a test that only skipped is red. The region is part of the request
# signature (lesson #927): the gateway refuses one signed for "auto".

on:
  schedule:
    - cron: "10 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-live
  cancel-in-progress: false

env:
  TESTS: TestLiveProviderConformance TestInit_Integration TestB2_OverRealS3 TestRenameOnS3_TheReportersSequence
  PKGS: ./internal/storage/drivers/s3 ./internal/usage ./internal/api/handlers

jobs:
  s3-live:
    name: Live S3 (a gateway in the job)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: An S3 gateway for the live tests
        run: bash .github/workflows/scripts/ci-s3.sh live
      # backend/embed/{admin,web} are build output: //go:embed refuses an empty directory.
      - name: Embed placeholders
        run: |
          mkdir -p backend/embed/admin backend/embed/web
          touch backend/embed/admin/.placeholder backend/embed/web/.placeholder
      - name: The live tests
        shell: bash
        working-directory: backend
        env:
          INTEGRATION: "1"
        run: |
          set -uo pipefail
          run="^($(echo $TESTS | tr ' ' '|'))\$"
          go test -count=1 -v -timeout 20m -run "$run" $PKGS > ../s3-live.out 2>&1
          rc=$?
          grep -E '^(=== RUN|--- (PASS|FAIL|SKIP)|\s+--- (PASS|FAIL|SKIP)|panic:|FAIL|ok )' ../s3-live.out | head -80
          notpassed=""
          for t in $TESTS; do
            grep -qE "^--- PASS: $t " ../s3-live.out || notpassed="$notpassed $t"
          done
          if [ "$rc" -eq 0 ] && [ -n "$notpassed" ]; then
            echo "::error::did not pass:$notpassed - a skip is not a pass here"
            rc=1
          fi
          echo "### Live S3: $([ "$rc" -eq 0 ] && echo "every test passed" || echo "RED -${notpassed:- see the log}")" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
