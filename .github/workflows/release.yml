name: Release

# On a version tag (v*): publish the binaries (goreleaser -> GitHub Release),
# the Docker images (-> ghcr.io/brf-tech/filex), the npm packages and the
# desktop installers. The frontend is built and embedded first so the
# binaries carry the admin UI. The images rebuild the frontend themselves
# inside their multi-stage Dockerfiles.
#
# Job graph — and why it is shaped like this:
#
#   binaries ───── desktop  (installers, attached to the Release; the snap
#                     │      also to the Snap Store) ── aur (PKGBUILD push)
#   docker ─────── docker-manifest   (one native runner per architecture)
#   npm            (independent)
#
# `binaries` is goreleaser alone: it is what CREATES the GitHub Release, and
# the only thing the other two need. Until v0.25.0 goreleaser and the docker
# builds were ONE job, so `desktop` (needs: that job) waited for the arm64
# QEMU emulation to finish before it could upload — measured on v0.20.2:
# goreleaser done at minute 5, the job done at minute 30, the installers idle
# for the 25 minutes in between. Splitting the job lets docker and desktop run
# side by side and puts the installers on the Release while the images are
# still building.
#
# npm publishing is a SEPARATE job (`npm`) so it can be re-run on its own — a
# failed publish (e.g. a bad token) does not force goreleaser to re-run, which
# would fail on the "release already exists" tag. Re-run just the npm job with
#   gh run rerun <id> --repo BRF-Tech/filex --failed

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push images to ghcr.io

jobs:
  # ── The gate ────────────────────────────────────────────────────────────
  #
  # ⚠⚠ Everything that publishes anything needs this. It exists because
  # nothing connected a tag to the test suite: CI runs on the branch push and
  # this workflow on the tag pushed two seconds later, in parallel, neither
  # aware of the other, and the repository required no status check at all.
  #
  # Measured 2026-09-06: CI had been red since v0.31.0 and FOUR tags shipped
  # over it. The failure was real -- a user who had chosen Turkish saw an
  # English admin panel on any second device -- and it was the release
  # process's blind spot, not a flake: the documented steps check README,
  # screenshots, links, anchors and version manifests, and never once run a
  # test.
  #
  # Cost: the release critical path grows by one CI run (~7 min). A release
  # that has to wait seven minutes to prove it works is not a cost worth
  # arguing about against four releases nobody could see were broken.
  test:
    name: Test suite
    uses: ./.github/workflows/ci.yml
    # ⚠⚠ No `with: skip_docker`. The gate builds both images before
    # `binaries`, `docker` and `npm` may start: v0.43.0 skipped that build here,
    # its images failed, and the npm packages and the GitHub Release were already
    # out (run 36026548054). The build this adds to the gate is the price of
    # never publishing half a release again.

  # ── Binaries (linux/macOS/windows × amd64/arm64) → GitHub Release ───────
  # Creates the Release. Everything that uploads to it depends on this job
  # and on nothing else.
  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Frontend → backend/embed (the binaries need it prebuilt) ────────
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # ⚠⚠ Each of these ships the image somebody who installs filex actually
      # runs: the chart's values.yaml leaves the tag empty and the helper
      # resolves it to .Chart.appVersion, and the CasaOS/Umbrel/Runtipi
      # manifests pin the tag outright. Left behind, a release quietly hands
      # those users an old filex -- the chart sat at v0.4.0 for twenty-three
      # releases before anyone noticed, and the three store manifests for
      # twenty-nine. A release that forgot one fails HERE, before anything is
      # published, rather than shipping something nobody can see is wrong.
      - name: Every deployment target matches the release
        run: node scripts/sync-deploy-versions.mjs --check

      - run: pnpm install --frozen-lockfile
      - name: Build frontend + sync into backend/embed
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          pnpm -r --filter='./packages/*' build
          pnpm --filter='./web' build
          mkdir -p backend/embed/admin backend/embed/web
          cp -r web/dist/. backend/embed/admin/
          cp -r packages/webcomponent/dist/. backend/embed/web/

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # ⚠⚠ The release BODY. GoReleaser builds it from `git log`, and the
      # filters in .goreleaser.yml drop `docs:`, `test:`, `chore:` and `ci:` —
      # so a release whose work landed under those prefixes published a page
      # with nothing on it. Measured on v0.34.2, this was the ENTIRE body:
      #
      #     ## Changelog
      #     ### Others
      #     * 99eb9eb… chore(release): v0.34.2
      #
      # while CHANGELOG.md carried 1,445 characters of prose for that same
      # version. The Releases page is where a stranger decides whether the
      # project is alive; it now carries the prose that already exists.
      #
      # ⚠ Measured on goreleaser v2.17.1: `--release-notes` replaces the
      # GENERATED CHANGELOG ONLY — `release.header` and `release.footer` from
      # .goreleaser.yml are still prepended and appended — so the file must not
      # repeat the `## filex vX` title the header already prints.
      #
      # ⚠ The script exits non-zero when the tag has no CHANGELOG.md section.
      # That stops the release HERE, before a single binary, image or package
      # is published, rather than after.
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs --github "${GITHUB_REF_NAME}" > /tmp/release-notes.md
          wc -c /tmp/release-notes.md
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .goreleaser.yml → homebrew_casks (`filex` into BRF-Tech/homebrew-filex,
          # over this deploy key) and winget (`BRFTech.filex`, a PR to
          # microsoft/winget-pkgs from brkfun's fork). Each block skips itself
          # when its secret is absent.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      # ⚠ goreleaser logs a failed winget/Homebrew publish and carries on
      # ("will not fail the pipeline"), so a release could miss both stores and
      # still show green. This step makes that visible.
      - name: Did the CLI reach winget and Homebrew?
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -uo pipefail
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in *-*) echo "pre-release: the stores are skipped on purpose"; exit 0 ;; esac
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::warning title=Homebrew::HOMEBREW_TAP_DEPLOY_KEY is not set, the filex cask was not published."
          elif gh api repos/BRF-Tech/homebrew-filex/contents/Casks/filex.rb --jq .content | base64 -d | grep -qF "version \"${VER}\""; then
            echo "Homebrew: Casks/filex.rb is at ${VER}"
          else
            echo "::warning title=Homebrew::Casks/filex.rb is not at ${VER}, see the goreleaser log above."
          fi
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning title=winget::WINGET_TOKEN is not set, BRFTech.filex was not submitted."
          else
            # The trailing space keeps "BRFTech.filex-app <ver>" (the desktop PR) out.
            n=$(GH_TOKEN="$WINGET_TOKEN" gh pr list --repo microsoft/winget-pkgs --state all --author "@me" --search "BRFTech.filex ${VER} in:title" --json title --jq "[.[] | select(.title | contains(\"BRFTech.filex ${VER}\"))] | length")
            if [ "${n:-0}" -gt 0 ]; then
              echo "winget: pull request for BRFTech.filex ${VER} is open"
              # The CLA bot asks on every pull request (scripts/winget-cla.sh).
              GH_TOKEN="$WINGET_TOKEN" CLA_COMPANY="BRF TEKNOLOJİ LİMİTED ŞİRKETİ" \
                bash .github/workflows/scripts/winget-cla.sh "New version: BRFTech.filex ${VER}"
            else
              echo "::warning title=winget::No pull request for BRFTech.filex ${VER}, see the goreleaser log above."
            fi
          fi

  # ── Docker images → ghcr.io ────────────────────────────────────────────
  #
  # Two images, built once per architecture on a runner of that architecture:
  #
  #   docker/Dockerfile       full toolchain (ffmpeg, ghostscript, poppler,
  #                           libreoffice + a JRE, fonts)  → latest, vX, full,
  #                           full-vX
  #   docker/Dockerfile.slim  the binary and nothing else  → slim, slim-vX
  #
  # ⚠ Two things here were wrong for a long time and are worth stating so they
  # are not reintroduced:
  #
  # 1. `slim` was built from the FULL recipe. docs/DOCKER.md promised ~40 MB
  #    and the registry served 511 MB compressed — measured on v0.30.0, all
  #    three of latest/slim/full were byte-for-byte the same image. The only
  #    difference between the two Dockerfiles was one package (imagemagick vs
  #    vips-tools), and neither is called by anything in backend/internal/thumb.
  #    docker/Dockerfile.slim now makes the name true.
  #
  # 2. arm64 was emulated. QEMU only ever hurt the runtime stage — the Node and
  #    Go stages are pinned to $BUILDPLATFORM and the binary cross-compiles for
  #    free (CGO_ENABLED=0) — but that stage is `apk add libreoffice + JRE`,
  #    which is exactly the expensive thing to emulate. GitHub's free
  #    `ubuntu-24.04-arm` runner (verified for this repo: aarch64, 4 cpus,
  #    15 GiB) removes the emulation entirely. Each runner builds and pushes
  #    ONE architecture by digest; `docker-manifest` then joins the digests
  #    into the multi-arch tags.
  #
  # `needs:` is deliberately absent. The docker job builds its own binary from
  # source inside the Dockerfile and takes nothing from the Release, so waiting
  # for goreleaser only lengthened the critical path (measured on v0.30.0:
  # binaries 544 s, then docker 696 s = 20.7 min wall). The cost of running in
  # parallel is that a goreleaser failure can leave a :vX image behind with no
  # GitHub Release beside it — delete the tag from ghcr.io by hand if that
  # happens; it has to be a deliberate cleanup, not a silent inconsistency.
  docker:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # No setup-qemu-action: each job is native for its platform. Adding it
      # back would silently re-enable emulation for whichever arch is missing
      # a runner, turning a broken matrix into a slow build instead of a
      # visible failure.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Full image
        id: full
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=full-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=full-${{ matrix.arch }}
          # Push by digest only; docker-manifest attaches the human tags.
          outputs: type=image,name=ghcr.io/brf-tech/filex,push-by-digest=true,name-canonical=true,push=true

      - name: Slim image
        id: slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.slim
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=slim-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=slim-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/brf-tech/filex,push-by-digest=true,name-canonical=true,push=true

      # The digests travel to the manifest job as files named after the digest,
      # so two matrix legs writing into one artifact never collide.
      - name: Record digests
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/full /tmp/digests/slim
          touch "/tmp/digests/full/${FULL_DIGEST#sha256:}"
          touch "/tmp/digests/slim/${SLIM_DIGEST#sha256:}"
        env:
          FULL_DIGEST: ${{ steps.full.outputs.digest }}
          SLIM_DIGEST: ${{ steps.slim.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-architecture digests into the tags people actually pull.
  # Nothing is tagged until BOTH architectures have pushed, so a half-built
  # release never appears as `:latest`.
  docker-manifest:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        run: |
          set -euo pipefail
          img=ghcr.io/brf-tech/filex
          ver="${GITHUB_REF_NAME}"

          join() {                       # join <variant> <tag...>
            local variant="$1"; shift
            local srcs=()
            for f in /tmp/digests/"$variant"/*; do
              srcs+=("${img}@sha256:$(basename "$f")")
            done
            [ "${#srcs[@]}" -eq 2 ] || {
              echo "expected 2 digests for ${variant}, found ${#srcs[@]}" >&2
              exit 1
            }
            local args=()
            for t in "$@"; do args+=(-t "${img}:${t}"); done
            docker buildx imagetools create "${args[@]}" "${srcs[@]}"
          }

          join full "latest" "${ver}" "full" "full-${ver}"
          join slim "slim" "slim-${ver}"

          docker buildx imagetools inspect "${img}:${ver}"
          docker buildx imagetools inspect "${img}:slim-${ver}"

  # ── npm packages → npmjs (@brftech scope) ─────────────────────────────
  # Independent of `binaries` so it can be re-run on its own. Publishes only if
  # an NPM_TOKEN repo secret is set — and that token MUST be an npm *Automation*
  # token (or a granular access token), which bypasses 2FA; a "Publish" token
  # still demands an OTP and fails with EOTP in CI. Package versions are pinned
  # to the tag, so a `v0.1.60` tag publishes @brftech/*@0.1.60.
  npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm -r --filter='./packages/*' build
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "NPM_TOKEN not set — skipping npm publish"; exit 0; fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          VER="${GITHUB_REF_NAME#v}"
          pnpm -r --filter='./packages/*' exec npm version "$VER" --no-git-tag-version --allow-same-version
          pnpm publish --filter='./packages/*' --access public --no-git-checks

  # ── Desktop packages ────────────────────────────────────────────────────
  #
  # ⚠⚠ These used to be built BY HAND, which is why they drifted: at v0.20.0
  # the desktop app was still shipping 0.18.2, so the connections and tokens
  # screens the release was named after did not exist for anyone who had
  # installed it. A package that is produced only when somebody remembers is a
  # package that is two releases old.
  #
  # ⚠⚠ `needs: binaries`, and the reason is the UPLOAD rather than the build.
  # The installer embeds the CLI, but desktop/scripts/fetch-cli.mjs builds that
  # from source when FILEX_CLI_BIN is unset, so the build itself waits for
  # nothing — which is why this job first ran in parallel. The GitHub Release
  # is created by goreleaser inside `binaries`, and `gh release upload` against
  # a tag with no release yet fails: v0.20.1 duly produced a 125 MB AppImage
  # and an 87 MB .deb, then attached neither. It does NOT wait for `docker`:
  # the images are not an input to the installers, and waiting for them cost
  # every release ~25 minutes of idle (v0.20.2 measurement in the header).
  #
  # ⚠ macOS ships UNSIGNED but ad-hoc SEALED (desktop/scripts/adhoc-sign.cjs).
  # The distinction is what dialog the user gets: a linker-signed-only bundle
  # (what electron-builder emits with no certificate) is treated as TAMPERED —
  # macOS 26 says "malware blocked and moved to Trash", no override offered
  # (measured 2026-08-18). A deep ad-hoc re-seal turns that into the honest
  # "unverified developer" dialog with the System Settings → Open Anyway path.
  # Still second-best: a Developer ID certificate + notarization removes the
  # dialog entirely, and mac AUTO-update stays inert until then (Squirrel.Mac
  # refuses to swap an unsigned app). arm64 only — macOS 26 deprecates Rosetta,
  # and the fleet this ships to is Apple Silicon.
  #
  # ⚠ The artefacts are attached to the GitHub Release, which is NOT the
  # auto-update feed: this repository is private, and pointing electron-updater
  # at it would mean embedding a token in the app. The feed stays on
  # filex.sh/desktop/ and is published by scripts/filex-publish-desktop.sh from
  # these files.
  desktop:
    name: Desktop packages (${{ matrix.label }})
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            script: "dist:win"
          - os: ubuntu-latest
            label: linux
            script: "dist:linux"
          # Pinned rather than macos-latest: the runner's arch IS the
          # artifact's arch (electron-builder defaults to the host, and
          # fetch-cli.mjs compiles the embedded CLI for the host), so a silent
          # image bump must not silently change what users download.
          - os: macos-14
            label: macos
            script: "dist:mac"
          # The Microsoft Store package (MSIX). Built, installed and checked
          # as a Store copy on the runner (desktop/scripts/store-e2e.mjs),
          # then kept as a workflow artifact and — once the Partner Center
          # credentials exist — submitted. It is NOT attached to the Release:
          # an unsigned .appx installs for nobody; the Store signs it.
          - os: windows-latest
            label: store
            script: "dist:store"
    runs-on: ${{ matrix.os }}
    env:
      # Partner Center → an Entra ID app with the Manager role
      # (desktop/store/microsoft/listing.md). Mapped to env because a step's
      # `if:` cannot read `secrets` directly.
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      # A classic PAT with `public_repo`, from the account whose fork of
      # microsoft/winget-pkgs the pull requests come from (brkfun).
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      # The tap's deploy key (write access to BRF-Tech/homebrew-filex only).
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: pnpm install --frozen-lockfile
      # desktop/scripts/sync-web.mjs copies packages/webcomponent/dist into the
      # app, so the packages have to exist before the installer is built.
      - name: Build packages
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm -r --filter='./packages/*' build
      # ⚠⚠ The tag is the version, not desktop/package.json. That file is
      # maintained by hand and was still on 0.20.0 while this workflow built
      # v0.20.1 — which would have stamped `latest.yml` with 0.20.0, so an app
      # already on 0.20.0 would read the feed, compare equal, and report itself
      # up to date forever. The package would have been built, published, and
      # invisible.
      - name: Stamp the version from the tag
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cd desktop
          npm version "$VER" --no-git-tag-version --allow-same-version
          node -e "console.log('desktop version =', require('./package.json').version)"
      # `dist:linux` builds an .rpm as well (desktop/electron-builder.yml), and
      # fpm hands that to rpmbuild, which ubuntu-latest does not ship.
      - name: rpmbuild for the .rpm
        if: matrix.label == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Build installer
        env:
          # Never let the mac runner auction its keychain: a stray self-signed
          # certificate would produce a "signed" build that fails Gatekeeper
          # WORSE than the ad-hoc seal. Delete this line (and set CSC_LINK /
          # CSC_KEY_PASSWORD secrets) when a real Developer ID lands.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter ./desktop run ${{ matrix.script }}
      # The snap is its own target (never part of `dist:linux`), packed from
      # the app the step above just built — no second web/main build, no second
      # CLI. electron-builder's snap template needs no snapcraft here.
      # ⚠ `--publish never`: on a tag electron-builder publishes by itself, and
      # a snap's default publisher is the Snap Store — the upload is the
      # explicit step further down, which says so when it cannot run.
      - name: Build snap
        if: matrix.label == 'linux'
        run: pnpm --filter ./desktop exec electron-builder --linux snap --publish never
      # Listed before uploading so a build that produced nothing is visible in
      # the log as an empty directory rather than as a silently short release.
      - name: What was produced
        shell: bash
        run: ls -la desktop/release
      # store-e2e registers the package from loose files, which needs no
      # certificate but does need Developer Mode. The runner is a throwaway
      # admin VM, so it is switched on here rather than signing a test cert.
      - name: Developer Mode (for the Store package check)
        if: matrix.label == 'store'
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      # ⚠ Before anything leaves the runner: installed, launched through its
      # protocol, and asked over DevTools whether it knows it is a Store copy.
      # A package Partner Center accepts is not a package that works.
      # The checks that need Windows to ACTIVATE the package (a protocol
      # launch, the app answering from inside it, its toast in Action Center)
      # only warn here: this runner has never activated one (v0.44.2 through
      # v0.46.1, see desktop/scripts/lib/store-activation.mjs). They are hard
      # gates in the local release run instead (scripts/release/plan.mjs,
      # "desktop: the Store package works as a Store copy"), on a desktop, for
      # the same commit, before the tag exists.
      - name: Install the Store package and check it as a Store copy
        if: matrix.label == 'store'
        run: pnpm --filter ./desktop run e2e:store
      - name: Keep the Store package for Partner Center
        if: matrix.label == 'store'
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ github.ref_name }}
          path: desktop/release/*.appx
          if-no-files-found: error
          retention-days: 90
      - name: Microsoft Store CLI
        if: matrix.label == 'store' && env.MSSTORE_CLIENT_SECRET != '' && env.MSSTORE_PRODUCT_ID != ''
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Submit to the Microsoft Store
        if: matrix.label == 'store' && env.MSSTORE_CLIENT_SECRET != '' && env.MSSTORE_PRODUCT_ID != ''
        shell: pwsh
        run: |
          # The CLI looks for .msix/.msixupload; an .appx is the same format.
          $appx = Get-ChildItem desktop/release/*.appx | Select-Object -First 1
          $msix = Join-Path $appx.DirectoryName ($appx.BaseName + '.msix')
          Copy-Item $appx.FullName $msix
          # Uploads, points "What's new" at the GitHub Release in every
          # listing language and sends the submission to certification; skips
          # with a warning while an earlier one is still in certification
          # (scripts/msstore-submit.ps1). Never fails the release.
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          ./.github/workflows/scripts/msstore-submit.ps1 -Msix $msix -Version $ver
          exit 0
      # Not a silent skip: a release that did not reach the Store says so.
      - name: Store submission skipped
        if: matrix.label == 'store' && (env.MSSTORE_CLIENT_SECRET == '' || env.MSSTORE_PRODUCT_ID == '')
        shell: bash
        run: |
          echo "::warning title=Microsoft Store::Not submitted — MSSTORE_* secrets or the MSSTORE_PRODUCT_ID variable are not set. Upload the msix-${GITHUB_REF_NAME} artifact in Partner Center by hand."
      - name: Attach to the release
        if: matrix.label != 'store'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/release/*.exe desktop/release/*.blockmap desktop/release/*.AppImage \
                 desktop/release/*.deb desktop/release/*.rpm desktop/release/*.snap \
                 desktop/release/*.dmg desktop/release/*.zip \
                 desktop/release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no desktop artefacts to upload" >&2
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
      # ── winget + Homebrew (the desktop app; the CLI goes through goreleaser) ──
      # desktop/scripts/pkg-manifests.mjs writes both, hashing the files this
      # job just built and pointing at the VERSIONED release URL.
      # ⚠ From here on this tag's assets are pinned by hash in two public
      # stores: never re-upload them. A fix is a new patch release.
      - name: Package-manager manifests
        if: matrix.label == 'windows' || matrix.label == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.label }}" = windows ]; then
            node desktop/scripts/pkg-manifests.mjs --version "$VER" --release-date "$(date -u +%F)" \
              --windows desktop/release/filex-desktop-x64.exe --out pkg-out
          else
            node desktop/scripts/pkg-manifests.mjs --version "$VER" \
              --mac desktop/release/filex-desktop-arm64.dmg --out pkg-out
          fi
      # ⚠ `winget validate` exits non-zero for WARNINGS too. v0.44.2: the
      # runner's winget did not know schema 1.12.0 yet and warned about the
      # `$schema` header lines ("succeeded with warnings") — the same header
      # goreleaser writes and microsoft/winget-pkgs accepts — and the step
      # failed, so BRFTech.filex-app was never submitted. Warnings are shown
      # as an annotation; only a failed validation stops the release.
      - name: Validate the winget manifests
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          $dir = (Get-ChildItem pkg-out/winget/manifests -Recurse -Filter '*.installer.yaml' | Select-Object -First 1).Directory.FullName
          $out = (winget validate --manifest $dir 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          # -1978335192 (0x8A150028) = "validation succeeded with warnings";
          # -1978335191 is a failed validation. Measured with winget 1.29.
          if ($code -ne 0 -and $code -ne -1978335192) { exit 1 }
          if ($code -ne 0) { Write-Host "::warning title=winget::winget validate passed with warnings; see the log of this step." }
          "WINGET_DIR=$dir" >> $env:GITHUB_ENV
          # ⚠⚠ GitHub ends a pwsh step with `exit $LASTEXITCODE`: without this
          # line the tolerated warning code above still fails the step (v0.45.1,
          # run 36182595696 — the desktop winget PR was never opened).
          exit 0
      - name: Submit to winget
        if: matrix.label == 'windows' && env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          ./wingetcreate.exe submit --no-open --prtitle "New version: BRFTech.filex-app $ver" --token $env:WINGET_TOKEN $env:WINGET_DIR
      # The CLA bot asks on every pull request, not once per account
      # (scripts/winget-cla.sh). Same script as the CLI's step.
      - name: Sign the CLA on the winget pull request
        if: matrix.label == 'windows' && env.WINGET_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          CLA_COMPANY: BRF TEKNOLOJİ LİMİTED ŞİRKETİ
        run: |
          bash .github/workflows/scripts/winget-cla.sh "New version: BRFTech.filex-app ${GITHUB_REF_NAME#v}"
      - name: Commit the cask to the tap
        if: matrix.label == 'macos' && env.HOMEBREW_TAP_DEPLOY_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:BRF-Tech/homebrew-filex.git tap
          mkdir -p tap/Casks
          cp pkg-out/homebrew/Casks/filex-app.rb tap/Casks/
          cd tap
          git add Casks/filex-app.rb
          if git diff --cached --quiet; then echo "cask already at ${VER}"; exit 0; fi
          git -c user.name="filex release" -c user.email="hello@brf.sh" commit -m "filex-app ${VER}"
          git push origin HEAD
      # Not a silent skip: a release that did not reach a store says so.
      - name: Package-manager submission skipped
        if: (matrix.label == 'windows' && env.WINGET_TOKEN == '') || (matrix.label == 'macos' && env.HOMEBREW_TAP_DEPLOY_KEY == '')
        shell: bash
        run: |
          echo "::warning title=${{ matrix.label == 'windows' && 'winget' || 'Homebrew' }}::Not submitted — the ${{ matrix.label == 'windows' && 'WINGET_TOKEN' || 'HOMEBREW_TAP_DEPLOY_KEY' }} secret is not set. The manifests are in the pkg-${{ matrix.label }} artifact."
      # always(): a failed validation or submission is exactly when the
      # manifests are needed, to submit them by hand.
      - name: Keep the manifests
        if: always() && (matrix.label == 'windows' || matrix.label == 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.label }}-${{ github.ref_name }}
          path: pkg-out
          retention-days: 90
      # ⚠⚠ Never a silent skip. Without the secret the snap is still on the
      # Release (above) but NOT in the Snap Store, and the run says so as a
      # warning annotation and in the summary — a store that quietly stops
      # getting releases is found months later by a user, not by us.
      # The secret is `snapcraft export-login --snaps=filex-app --acls=…` output
      # (desktop/README.md, "Publishing"); the snap is `filex-app` — `filex` is
      # the CLI's name. Straight to `stable`: the snap
      # is the same build the .deb is, and the Store's own review runs first.
      - name: Upload to the Snap Store
        if: matrix.label == 'linux'
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          snap=desktop/release/filex-desktop-amd64.snap
          [ -f "$snap" ] || { echo "no $snap to upload" >&2; exit 1; }
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS:-}" ]; then
            msg="SNAPCRAFT_STORE_CREDENTIALS is not set: $snap was NOT uploaded to the Snap Store (credentials missing). It is attached to the GitHub Release only."
            echo "::warning title=Snap Store: not uploaded::$msg"
            echo "### Snap Store: not uploaded (no credentials)" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo snap install snapcraft --classic
          snapcraft whoami
          snapcraft upload --release=stable "$snap"
          echo "### Snap Store: uploaded to stable" >> "$GITHUB_STEP_SUMMARY"

  # ── AUR (filex-app-bin) ─────────────────────────────────────────────
  #
  # The PKGBUILD repackages the .deb just attached, so it runs after `desktop`
  # and hashes THAT file. packaging/aur/update-pkgbuild.sh sets pkgver and the
  # checksums and regenerates .SRCINFO; both are kept as a run artifact either
  # way. The push needs the SSH key registered with the AUR account — without
  # it the run says so (warning + summary) instead of pretending.
  aur:
    name: AUR package (filex-app-bin)
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PKGBUILD and .SRCINFO for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" -p filex-desktop-amd64.deb -D "$RUNNER_TEMP/rel"
          bash packaging/aur/update-pkgbuild.sh "${GITHUB_REF_NAME}" --deb "$RUNNER_TEMP/rel/filex-desktop-amd64.deb"
          cat packaging/aur/filex-app-bin/.SRCINFO
      - uses: actions/upload-artifact@v4
        with:
          name: aur-filex-app-bin
          path: |
            packaging/aur/filex-app-bin/PKGBUILD
            packaging/aur/filex-app-bin/.SRCINFO
          include-hidden-files: true
      - name: Push to the AUR
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            msg="AUR_SSH_PRIVATE_KEY is not set: filex-app-bin was NOT pushed to the AUR. PKGBUILD and .SRCINFO are in this run's artifacts."
            echo "::warning title=AUR: not pushed::$msg"
            echo "### AUR: not pushed (no SSH key)" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The committed PKGBUILD is a template (SKIP checksums) until the
          # step above has rewritten it for this tag; never push that.
          if grep -q "'SKIP'" packaging/aur/filex-app-bin/PKGBUILD; then
            echo "PKGBUILD still carries SKIP checksums — not pushing" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/filex-app-bin.git "$RUNNER_TEMP/aur"
          cp packaging/aur/filex-app-bin/PKGBUILD packaging/aur/filex-app-bin/.SRCINFO "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "AUR already at ${GITHUB_REF_NAME}"; exit 0; fi
          git -c user.name="BRF Teknoloji" -c user.email="security@brf.sh" commit -q -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master
          echo "### AUR: pushed ${GITHUB_REF_NAME#v}" >> "$GITHUB_STEP_SUMMARY"
