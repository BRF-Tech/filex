name: Release

# On a version tag (v*): publish the binaries (goreleaser -> GitHub Release),
# the Docker images (-> ghcr.io/brf-tech/filex), the npm packages and the
# desktop installers. The frontend is built and embedded first so the
# binaries carry the admin UI. The images rebuild the frontend themselves
# inside their multi-stage Dockerfiles.
#
# Job graph — and why it is shaped like this:
#
#   plan ── verify ─┬─ binaries ─┬─ desktop  (installers, attached to the
#                   │            │     │      Release; the snaps also to the
#                   │            │     │      Snap Store)
#                   │            │     ├─ desktop-arm64-check (install + open
#                   │            │     │   on real arm64 machines and Linux
#                   │            │     │   x64, sandbox or snap confinement
#                   │            │     │   checked, screenshots)
#                   │            │     └─ aur (PKGBUILD push)
#                   │            └─ cli-smoke (CLI + server on arm64)
#                   ├─ docker              (a run by hand, and a tag run with
#                   │                       nothing to promote: one native
#                   │                       runner per arch)
#                   ├─ promote-check ── docker-manifest   (a tag run)
#                   └─ npm       (independent)
#
# No job here runs the test suite (#174). The push of main runs ci.yml's
# full matrix on the very commit a release lands, and `verify` asks for that
# run before a tag run publishes anything (see "The gate" below). A dry run
# packages at once, beside that matrix, instead of after a second copy of it.
#
# ⚠⚠ A tag run builds no image and no desktop package: it PROMOTES what the
# dry run of its commit built (#174). That dry run is a release candidate
# (`plan`: a run of everything on a version no tag has yet): it stamps the
# version itself, pushes both images to ghcr.io by digest only, with no tag
# anybody pulls, and keeps every desktop row's files with their sha256 sums.
# The tag run then checks each image was built from its commit as its
# version (`promote-check`: the labels, and `filex --version` run on its own
# architecture), joins the digests into the tags people pull
# (`docker-manifest`), and publishes the desktop files after checking their
# sums - in minutes, not the 30-50 a rebuild took. The CLI binaries are still
# built by goreleaser in the tag run: it is what creates the Release, opens
# the winget pull request and commits the Homebrew cask, and GoReleaser OSS
# cannot publish a build it did not make.
#
# ⚠ Unless there is no dry run to promote (#181). When GitHub Actions was
# down as the commit was gated, the release tool took CircleCI's `ci`
# workflow as its test (`pnpm release X.Y.Z --resume --gate circleci`) and
# no dry run ran. `verify` then takes that green CircleCI workflow instead
# (circleci-green.mjs), and the tag run builds what it would have
# promoted, as a tag run did before #174: `docker` builds both images and
# pushes them by digest, `promote-check` checks them as it checks a dry
# run's, and every desktop row builds its packages.
#
# `binaries` is goreleaser alone: it is what CREATES the GitHub Release, and
# the only thing the other two need. Until v0.25.0 goreleaser and the docker
# builds were ONE job, so `desktop` (needs: that job) waited for the arm64
# QEMU emulation to finish before it could upload — measured on v0.20.2:
# goreleaser done at minute 5, the job done at minute 30, the installers idle
# for the 25 minutes in between. Splitting the job lets docker and desktop run
# side by side and puts the installers on the Release while the images are
# still building.
#
# npm publishing is a SEPARATE job (`npm`) so it can be re-run on its own — a
# failed publish (e.g. a package npm has no trusted publisher for yet) does not
# force goreleaser to re-run, which would fail on the "release already exists"
# tag. Re-run just the npm job with
#   gh run rerun <id> --repo BRF-Tech/filex --failed
#
# ── Run by hand (workflow_dispatch) ─────────────────────────────────────────
#
#   gh workflow run release.yml -R BRF-Tech/filex --ref <branch>
#       A DRY RUN of the whole release on that branch: everything is built —
#       goreleaser (--snapshot), both images (smoke-tested on their own
#       architecture), every desktop package including arm64 — and kept as
#       run artifacts. Nothing is published: no Release, no image tag, no
#       npm, no store. It waits for no test suite: the push of its commit
#       runs ci.yml's full matrix beside it.
#       The run is named "dry run all <commit>" (run-name, below). Before a
#       tag, the release tool starts one on main with -f publish=false, on the
#       export commit it is about to tag, and the tag run's `verify` looks for
#       exactly that name on its commit (docs/CONTRIBUTING.md → Release
#       process, step 7). On a version no tag has yet it is the release
#       candidate the tag run promotes (above): its images go to ghcr.io by
#       digest, untagged, and its desktop files are kept 14 days.
#
#   gh workflow run release.yml -R BRF-Tech/filex --ref main -f publish=false -f macos=false
#       The same dry run without the macOS row, while GitHub has no macOS
#       runner (docs/CONTRIBUTING.md, Release process: the release then goes
#       out without the macOS packages and its notes say so). The tag run
#       promotes what it kept and publishes no macOS package; a run with
#       only=macos adds them once the runners are back.
#
#   gh workflow run release.yml -R BRF-Tech/filex -f tag=v0.48.0 -f only=arm64 [-f publish=true]
#       The ARM packages for a release that shipped without them: the Linux
#       arm64 AppImage/.deb/.rpm/.snap, the Windows arm64 installer and
#       portable .exe, and the arm64 Store package, built from THAT tag. With
#       publish=true they are attached to its Release, the Windows update feed
#       (latest.yml) gains the arm64 installer beside the x64 one, the snap
#       goes to the Snap Store and the Store package to the Microsoft Store.
#       Without it, a dry run of exactly that. With it, `verify` first asks
#       the same of THAT tag's commit as of a tag push: CI and a dry run of
#       everything passed on it. A tag cut before #76 has neither, and its
#       ARM packages are not published from here.
#
#   gh workflow run release.yml -R BRF-Tech/filex -f tag=v0.52.0 -f only=macos [-f publish=true]
#       The macOS desktop packages for a release that shipped without them:
#       the .dmg, the .zip and latest-mac.yml, built from THAT tag on the
#       macos row of a full run (the same runner, script and arch). With
#       publish=true they are attached to its Release (--clobber), and the
#       Homebrew desktop cask (filex-app) is written from the .dmg just built
#       and committed to the tap. Nothing else is built or published: no
#       binaries, images, npm, winget, Store, snap or AUR, no CLI smoke test,
#       and no desktop-arm64-check (it installs Linux and Windows packages
#       this run does not build). Without publish, a dry run of exactly that.
#       With it, `verify` asks of THAT tag's commit what it asks for
#       only=arm64: CI and a dry run of everything passed on it.
#       (v0.52.0: GitHub Actions was down at the tag, every other channel was
#       published from a PC, and macOS needs a Mac to build on.)
#
#   gh workflow run release.yml -R BRF-Tech/filex -f tag=v0.52.0 -f only=snap-arm64 [-f publish=true]
#       The Linux arm64 snap alone, for a release that shipped without it:
#       the linux-arm64 row of a full run (ubuntu-24.04-arm, snapcraft in
#       LXD), built from THAT tag, but without the row's own build: no
#       AppImage, .deb or .rpm. The Release has those already, and the winget
#       pull request and the update feeds pin its files by hash, so this run
#       never builds them again. With publish=true the snap goes to the Snap
#       Store (the same step and channel as a full run) and
#       filex-desktop-arm64.snap, named and nothing else, to the Release
#       (--clobber: a re-run after a failed Store upload replaces its own).
#       No latest*.yml, no binaries, images, npm, winget, Store, cask or AUR,
#       no CLI smoke test and no desktop-arm64-check (it installs the .deb
#       and the AppImage this run does not build). The app and the CLI
#       inside the snap are still checked to be arm64. Without publish, a dry
#       run of exactly that, the snap kept as a run artifact. With it,
#       `verify` asks of THAT tag's commit what it asks for only=arm64.
#       (v0.52.0: the release was published from a PC, and snapcraft cannot
#       cross-build an arm64 snap.)
#
# A FULL release publishes from its tag push and nothing else: `plan` refuses
# publish=true without only=arm64, only=macos or only=snap-arm64 (goreleaser
# cannot recreate a Release, and a half-rerun release is how v0.34.0's tag had
# to be moved). And the tag push publishes only a commit that passed ci.yml's
# full matrix and a dry run first (`verify`), and publishes that dry run's
# images and desktop files rather than its own builds - or, when GitHub lacks
# them, a commit CircleCI's `ci` workflow passed, and then its own builds
# (#181).
#
# ⚠ In a run on a tag the workflow file comes from the branch it was started
# on and the code from the tag. The tag's tree has the tag's
# .github/workflows/scripts, not these; every job that runs a script from there
# checks this commit's copy out into .ci/ and runs that one (CI_SCRIPTS).

# ⚠ The name says what a run was asked to do, because GitHub's API does not
# give a run's inputs: "dry run all <commit>" is a run by hand with publish
# off, every package and no tag - the one dry run that tested everything on
# that commit, which the release tool waits for before a tag and `verify`
# looks for on a tag run. "dry run arm64 v1.2.3 <commit>" and "publish arm64
# v1.2.3 <commit>" are the ARM-only runs, "dry run macos v1.2.3 <commit>" and
# "publish macos v1.2.3 <commit>" the macOS-only ones, "dry run snap-arm64
# v1.2.3 <commit>" and "publish snap-arm64 v1.2.3 <commit>" the arm64 snap
# alone; a tag push is "Release v1.2.3".
# scripts/release/checks.mjs (dryRunTitle) spells the same name.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} {1} {2}{3}', inputs.publish && 'publish' || 'dry run', inputs.only, inputs.tag && format('{0} ', inputs.tag) || '', github.sha) || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to build (v1.2.3). Empty: the branch this runs on."
        type: string
        default: ""
      only:
        description: "all: every package. arm64: only the ARM packages (needs a tag). macos: only the macOS desktop packages (needs a tag). snap-arm64: only the Linux arm64 snap, to the Snap Store (needs a tag)."
        type: choice
        options: [all, arm64, macos, snap-arm64]
        default: all
      publish:
        description: "Attach to the tag's Release and send to the stores. Off: build, test and keep artifacts only."
        type: boolean
        default: false
      macos:
        description: "Build the macOS desktop packages in a run of everything. Off only while GitHub has no macOS runner: the release then goes out without them, and only=macos adds them later."
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push images to ghcr.io

# ⚠ Never cancels anything. A tag push is its own group (refs/tags/vX), so a
# run started by hand on a branch cannot touch a release in flight, and a
# second run on the same branch and tag waits for the first instead of
# killing it halfway through a store upload. (ci.yml, the test this release
# reads, never cancels a run of a push either: it groups a push by its commit.)
concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # This commit's own helper scripts (see the note on runs on a tag above).
  CI_SCRIPTS: .ci/.github/workflows/scripts

jobs:
  # ── What this run is ────────────────────────────────────────────────────
  #
  # One place turns the trigger into the few facts every job branches on, so
  # no job reads `github.ref_name` (the BRANCH name in a dispatch) as a
  # version:
  #   tag      v1.2.3, or empty for a dry run of a branch
  #   ref      what to check out (the tag, or this commit)
  #   version  1.2.3 (a branch: desktop/package.json's)
  #   stamp    what the images and binaries report (the tag, or v<version>-dryrun)
  #   publish  true on a tag push, or when asked for (only=arm64, only=macos,
  #            only=snap-arm64)
  #   full     false when only the ARM packages, the macOS packages or the
  #            arm64 snap are built
  #   only     all, arm64, macos or snap-arm64 (a tag push: all)
  #   desktop  the desktop matrix
  #   candidate  true for the dry run a tag run promotes: by hand, everything,
  #            nothing published, on a version no tag has yet. It stamps
  #            v<version> (not -dryrun), pushes its images by digest and keeps
  #            its desktop files for the tag run of the same commit.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      ref: ${{ steps.p.outputs.ref }}
      version: ${{ steps.p.outputs.version }}
      stamp: ${{ steps.p.outputs.stamp }}
      publish: ${{ steps.p.outputs.publish }}
      full: ${{ steps.p.outputs.full }}
      only: ${{ steps.p.outputs.only }}
      desktop: ${{ steps.p.outputs.desktop }}
      candidate: ${{ steps.p.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          sparse-checkout: desktop/package.json
          sparse-checkout-cone-mode: false
      - id: p
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          IN_ONLY: ${{ inputs.only }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_MACOS: ${{ inputs.macos }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            tag="$GITHUB_REF_NAME"; only=all; publish=true; macos=true
          else
            tag="$IN_TAG"; only="${IN_ONLY:-all}"; publish="${IN_PUBLISH:-false}"; macos="${IN_MACOS:-true}"
          fi
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::a tag looks like v1.2.3, not '$tag'"; exit 1; }
            version="${tag#v}"
            stamp="$tag"
          else
            version=$(node -p "require('./desktop/package.json').version")
            stamp="v${version}-dryrun"
          fi
          if [ "$only" = arm64 ] && [ -z "$tag" ]; then
            echo "::error::only=arm64 adds to a release: give its tag (-f tag=v1.2.3)"; exit 1
          fi
          if [ "$only" = macos ] && [ -z "$tag" ]; then
            echo "::error::only=macos adds to a release: give its tag (-f tag=v1.2.3)"; exit 1
          fi
          if [ "$only" = snap-arm64 ] && [ -z "$tag" ]; then
            echo "::error::only=snap-arm64 adds to a release: give its tag (-f tag=v1.2.3)"; exit 1
          fi
          if [ "$EVENT" != push ] && [ "$publish" = true ]; then
            [ "$only" = snap-arm64 ] || [ "$only" = macos ] || [ "$only" = arm64 ] || { echo "::error::a full release publishes from its tag push only. To add the ARM packages to $tag, run with only=arm64; the macOS packages, with only=macos; the arm64 snap alone, with only=snap-arm64."; exit 1; }
            gh release view "$tag" -R "$GITHUB_REPOSITORY" --json tagName >/dev/null || { echo "::error::$tag has no GitHub Release to add to"; exit 1; }
          fi
          # The desktop rows. `script` is the package.json script for the
          # row's own (x64 or native) build; `arches` what the row produces.
          # ⚠ macos-15 is pinned rather than macos-latest: the runner's arch IS
          # the artifact's arch (electron-builder defaults to the host, and
          # fetch-cli.mjs compiles the embedded CLI for the host), so a silent
          # image bump must not silently change what users download. It was
          # macos-14, whose images GitHub retires on 2026-11-02; cli-smoke pins
          # the same image.
          # ⚠ Linux arm64 builds NATIVELY on ubuntu-24.04-arm: its snap has no
          # prebuilt electron-builder template (x64 and armv7l only) and is
          # built by real snapcraft, which cannot cross-build. Windows arm64
          # cross-builds on the x64 runner (no native modules; the embedded
          # CLI is GOARCH=arm64) and is then installed and opened on a real
          # windows-11-arm machine by desktop-arm64-check.
          if [ "$only" = arm64 ]; then
            desktop='{"include":[
              {"os":"windows-latest","label":"windows","script":"","arches":"arm64"},
              {"os":"ubuntu-24.04-arm","label":"linux-arm64","script":"dist:linux","arches":"arm64"},
              {"os":"windows-latest","label":"store","script":"","arches":"arm64"}]}'
          else
            desktop='{"include":[
              {"os":"windows-latest","label":"windows","script":"dist:win","arches":"x64 arm64"},
              {"os":"ubuntu-latest","label":"linux","script":"dist:linux","arches":"x64"},
              {"os":"ubuntu-24.04-arm","label":"linux-arm64","script":"dist:linux","arches":"arm64"},
              {"os":"macos-15","label":"macos","script":"dist:mac","arches":"arm64"},
              {"os":"windows-latest","label":"store","script":"dist:store","arches":"x64 arm64"}]}'
          fi
          # only=macos: the macos row of the full matrix above and nothing
          # else - the very row a tag push builds, so what it adds to a
          # release is what that release would have had.
          if [ "$only" = macos ]; then
            desktop=$(echo "$desktop" | jq -c '{include: [.include[] | select(.label == "macos")]}')
          fi
          # only=snap-arm64: the linux-arm64 row of the full matrix, without
          # its `script`. That script (dist:linux) makes the AppImage, .deb and
          # .rpm, which the Release has and which are pinned by hash; desktop
          # builds the app and the CLI itself for this row and packs the snap
          # alone.
          if [ "$only" = snap-arm64 ]; then
            desktop=$(echo "$desktop" | jq -c '{include: [.include[] | select(.label == "linux-arm64") | .script = ""]}')
          fi
          # -f macos=false: a run of everything without the macos row, while
          # GitHub has no macOS runner (the macOS-less release; only=macos adds
          # the packages later). Never in a tag run: a tag run's rows are the
          # ones its dry run kept (verify).
          if [ "$only" = all ] && [ "$macos" = false ]; then
            desktop=$(echo "$desktop" | jq -c '{include: [.include[] | select(.label != "macos")]}')
          fi
          # The release candidate (#174): a dry run of everything on a version
          # no tag has yet. It stamps the version itself, so what it builds is
          # what the tag run of the same commit promotes. A version that is
          # tagged already makes a plain dry run (-dryrun) that keeps nothing.
          candidate=false
          if [ "$EVENT" != push ] && [ -z "$tag" ] && [ "$only" = all ] && [ "$publish" != true ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
              echo "v$version is tagged already: a plain dry run, which keeps nothing for a tag run"
            else
              candidate=true
              stamp="v$version"
            fi
          fi
          {
            echo "tag=$tag"
            echo "ref=${tag:-$GITHUB_SHA}"
            echo "version=$version"
            echo "stamp=$stamp"
            echo "publish=$publish"
            echo "full=$([ "$only" = all ] && echo true || echo false)"
            echo "only=$only"
            echo "desktop=$(echo "$desktop" | jq -c .)"
            echo "candidate=$candidate"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ${tag:-dry run of $GITHUB_REF_NAME} — $([ "$publish" = true ] && echo PUBLISHES || echo publishes nothing)"
            echo "version $version, only=$only$([ "$macos" = false ] && echo ', without the macOS packages')"
            if [ "$candidate" = true ]; then
              echo "release candidate of v$version: its images go to ghcr.io by digest (untagged) and its desktop files are kept for the tag run to promote"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── The gate ────────────────────────────────────────────────────────────
  #
  # ⚠⚠ Everything that publishes anything needs `verify`, and `verify` needs
  # the suite to have passed on the commit. It exists because
  # nothing connected a tag to the test suite: CI runs on the branch push and
  # this workflow on the tag pushed two seconds later, in parallel, neither
  # aware of the other, and the repository required no status check at all.
  #
  # Measured 2026-09-06: CI had been red since v0.31.0 and FOUR tags shipped
  # over it. The failure was real -- a user who had chosen Turkish saw an
  # English admin panel on any second device -- and it was the release
  # process's blind spot, not a flake: the documented steps check README,
  # screenshots, links, anchors and version manifests, and never once run a
  # test.
  #
  # ⚠⚠ And the tag came FIRST, so a red gate spent a version number: 0.43.0
  # shipped without images, 0.43.1 stopped at the gate, 0.44.0 and 0.44.1
  # died in goreleaser after npm and the images were out, 0.45.0 published
  # nothing - and each could only be fixed by the next number. Since #76 the
  # tag comes LAST: both mains are pushed untagged, ci.yml runs on that push,
  # the release tool starts a dry run of this workflow on the same commit and
  # waits for both, and only then is that commit tagged.
  #
  # So `verify` asks GitHub whether THIS commit has a successful ci.yml run
  # started by a push that ran the FULL matrix - its last job, "All tests
  # (full)", green (scripts/ci-parts.mjs) - AND a successful dry run of this
  # workflow (named "dry run all <commit>", see run-name). Either missing, or
  # GitHub not answering, and it fails: nothing is published. In a tag run it
  # also finds what that dry run kept for promotion: both images' digests and
  # every desktop row's files. A row with none fails, except macOS when the
  # dry run was started without it (-f macos=false): then the release goes out
  # without the macOS packages and says so.
  #
  # Until #174 a run by hand ran ci.yml itself first (`test`), and every
  # package waited for it; the push run of the same commit already ran that
  # very suite. A dry run now packages at once and publishes nothing, so
  # `verify` lets it through without asking.
  #
  # A run that adds the ARM packages to a release (only=arm64), its macOS
  # packages (only=macos) or its arm64 snap (only=snap-arm64), builds THAT
  # tag's code, and with publish=true `verify` asks of the tag's commit
  # exactly what it asks on a tag push. So every job that publishes anything
  # waits for `verify`, a partial run's included.
  #
  # #181: when GitHub Actions is down, the release tool gates a commit on
  # CircleCI's `ci` workflow instead (`--gate circleci`), and no dry run
  # runs. Once Actions is back, the tag run of that commit finds neither of
  # the runs above. `verify` then asks CircleCI (circleci-green.mjs, with the
  # CIRCLECI_TOKEN secret and the CIRCLECI_PROJECT_SLUG variable): a green
  # `ci` workflow on this very commit stands in for both, on a tag push and
  # in a run that adds to a release alike. GitHub's own runs come first: when
  # both are there, CircleCI is not asked, and a red, unfinished or missing
  # CircleCI workflow - or one CircleCI cannot be asked about - is no
  # evidence. With CircleCI's word there is no dry run to promote (`promote`
  # false), and the tag run builds the images and the desktop packages
  # itself - unless its tag has a GitHub Release already: a release packaged
  # off GitHub while Actions was down (package-local.mjs) is not published a
  # second time by its late tag run, which then publishes nothing.
  verify:
    name: Verify
    needs: [plan]
    # !cancelled(), not the implicit success(): it decides for itself,
    # closed, whatever kind of run this is.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      dry_run: ${{ steps.v.outputs.dry_run }}
      desktop: ${{ steps.v.outputs.desktop }}
      # #181: what tested the commit - `github` (ci.yml's full matrix and a
      # dry run) or `circleci` (its `ci` workflow, when GitHub lacks them) -
      # and, in a tag run, whether there is a dry run to promote: `true`, or
      # `false` and this run builds the images and the desktop packages.
      evidence: ${{ steps.v.outputs.evidence }}
      promote: ${{ steps.v.outputs.promote }}
    steps:
      # The CircleCI reader, this commit's copy (see the note on runs on a tag
      # above). Not in a dry run: verify asks nothing there.
      - uses: actions/checkout@v4
        if: needs.plan.outputs.publish == 'true'
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/workflows/scripts
      - uses: actions/setup-node@v4
        if: needs.plan.outputs.publish == 'true'
        with:
          node-version: "22"
      - name: The commit this run publishes passed the full matrix and a dry run of this workflow, or CircleCI
        id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          ONLY: ${{ needs.plan.outputs.only }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          TAG: ${{ needs.plan.outputs.tag }}
          DESKTOP: ${{ needs.plan.outputs.desktop }}
          GH_TOKEN: ${{ github.token }}
          # #181: a CircleCI personal API token, read by circleci-green.mjs
          # alone and never printed; and the project's slug, gh/<org>/<repo>
          # unless the CIRCLECI_PROJECT_SLUG variable says otherwise (a
          # project on the CircleCI GitHub App: circleci/<org id>/<project id>).
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PROJECT: ${{ vars.CIRCLECI_PROJECT_SLUG || format('gh/{0}', github.repository) }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != push ]; then
            if [ "$PUBLISH" != true ]; then
              echo "A dry run (only=$ONLY): nothing is published, and nothing waits for a test suite - the push of its commit runs ci.yml's full matrix." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Adds to $TAG's release, built from $TAG: its commit is asked.
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          fi
          export SHA
          export WANT="dry run all $SHA"
          # The last job of ci.yml's full matrix (scripts/ci-parts.mjs, completeName).
          export COMPLETE="All tests (full)"
          runs="https://github.com/$GITHUB_REPOSITORY/actions/runs"
          # The newest successful run of each on this very commit. A call
          # that fails ends the step here (set -e): unknown does not pass.
          ci=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SHA" -f event=push -f status=success -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_sha == env.SHA and .event == "push" and .conclusion == "success")][0].id // empty')
          dry=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
            -f head_sha="$SHA" -f event=workflow_dispatch -f status=success -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_sha == env.SHA and .event == "workflow_dispatch" and .conclusion == "success" and .display_title == env.WANT)][0].id // empty')
          # What GitHub lacks, said as an error only when CircleCI cannot
          # stand in for it either (below).
          lacks=()
          if [ -z "$ci" ]; then
            lacks+=("no successful ci.yml run started by a push of $SHA")
          else
            # It passed; was it the whole matrix? Only the full profile ends
            # in this job (a pull request's run ends in "All tests (pr)").
            full=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$ci/jobs" -f filter=latest -f per_page=100 --paginate \
              --jq '.jobs[] | select(.name == env.COMPLETE and .conclusion == "success") | .name')
            if [ -n "$full" ]; then
              echo "ci.yml ran the full matrix on $SHA and passed: $runs/$ci"
            else
              lacks+=("ci.yml passed on $SHA, but not as the full matrix: run $runs/$ci has no successful \"$COMPLETE\" job")
            fi
          fi
          if [ -n "$dry" ]; then
            echo "the dry run passed on $SHA: $runs/$dry"
          else
            lacks+=("no successful run of release.yml named '$WANT'")
          fi
          missing=${#lacks[@]}
          evidence=github
          cc=""
          if [ "$missing" -ne 0 ]; then
            # #181: GitHub has not tested this commit (Actions was down when
            # the release tool gated it on CircleCI). A green `ci` workflow
            # of CircleCI on this very commit stands in for both runs; red,
            # unfinished, none, or CircleCI not answering does not.
            if cc=$(node "$CI_SCRIPTS"/circleci-green.mjs --project "$CIRCLECI_PROJECT" --sha "$SHA" --branch main --workflow ci 2>&1); then
              evidence=circleci
            else
              for l in "${lacks[@]}"; do echo "::error::$l"; done
              echo "::error::CircleCI: $cc"
              echo "::error::$TAG publishes nothing: a commit is tagged only after GitHub's full matrix and a dry run, or CircleCI's ci workflow, passed on it (docs/CONTRIBUTING.md, Release process, step 7)"
              exit 1
            fi
          fi
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          if [ "$evidence" = circleci ]; then
            for l in "${lacks[@]}"; do echo "GitHub: $l"; done
            if [ "$EVENT" = push ]; then
              # A release packaged off GitHub while Actions was down
              # (package-local.mjs) has its GitHub Release already. Its tag
              # run, started once Actions is back, must not build and tag
              # images over the ones published, nor attach files over the
              # ones the feeds and winget pin by hash: it publishes nothing.
              if rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .html_url 2>&1); then
                echo "::error::$TAG has a GitHub Release already ($rel): it was packaged off GitHub, and this run publishes nothing. Add what it lacks with only=macos or only=snap-arm64 (docs/CONTRIBUTING.md, When GitHub Actions is down)."
                exit 1
              elif ! grep -q 'HTTP 404' <<< "$rel"; then
                echo "::error::could not ask whether $TAG has a GitHub Release ($rel): unknown does not pass"
                exit 1
              fi
            fi
            echo "::notice title=CircleCI::$SHA was tested on CircleCI, not on GitHub: $cc"
            {
              echo "### $TAG ($SHA) was tested on CircleCI before it was tagged"
              echo "- CircleCI, workflow ci: $cc"
              echo "- GitHub lacks its full matrix or its dry run (GitHub Actions was down when it was gated)"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$EVENT" = push ]; then
              # No dry run, so nothing to promote: this run builds both
              # images (docker) and every desktop row's packages itself, and
              # promote-check checks the images as it checks a dry run's.
              echo "promote=false" >> "$GITHUB_OUTPUT"
              echo "- no dry run to promote: this run builds the images and the desktop packages itself" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ]; then
            # What the tag run promotes (#174): both images, by digest, and
            # each desktop row's files. A plain dry run (its version was
            # tagged already, or it was no run of everything) kept none.
            have=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$dry/artifacts" -f per_page=100 --paginate \
              --jq '.artifacts[] | select(.expired == false) | .name')
            for a in digests-amd64 digests-arm64; do
              if ! grep -qx "$a" <<< "$have"; then
                echo "::error::the dry run $runs/$dry kept no $a: it is no release candidate. Start a dry run on $SHA again (docs/CONTRIBUTING.md, Release process, step 7), then re-run this run's failed jobs."
                exit 1
              fi
            done
            rows=$(jq -c --arg have "$have" '{include: [.include[] | select(("release-files-" + .label) as $n | ($have | split("\n") | any(.[]; . == $n)))]}' <<< "$DESKTOP")
            lost=$(jq -r --arg have "$have" '.include[] | .label | select(("release-files-" + .) as $n | ($have | split("\n") | any(.[]; . == $n)) | not)' <<< "$DESKTOP")
            for label in $lost; do
              if [ "$label" = macos ]; then
                echo "::warning title=macOS::the dry run built no macOS packages (it was started with -f macos=false): $TAG goes out without them. Add them with only=macos once GitHub has macOS runners again."
                echo "### $TAG goes out without the macOS packages: add them with only=macos" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::the dry run $runs/$dry kept no files for the $label desktop row: there is nothing to promote"
                exit 1
              fi
            done
            echo "desktop=$rows" >> "$GITHUB_OUTPUT"
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### $TAG ($SHA) was tested before it was tagged"
            echo "- CI, the full matrix: $runs/$ci"
            echo "- dry run: $runs/$dry"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Binaries (linux/macOS/windows × amd64/arm64) → GitHub Release ───────
  # Creates the Release. Everything that uploads to it depends on this job
  # and on nothing else. In a dry run: goreleaser --snapshot, nothing leaves
  # the runner but the bare binaries cli-smoke tests.
  binaries:
    needs: [plan, verify]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Frontend → backend/embed (the binaries need it prebuilt) ────────
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # ⚠⚠ Each of these ships the image somebody who installs filex actually
      # runs: the chart's values.yaml leaves the tag empty and the helper
      # resolves it to .Chart.appVersion, and the CasaOS/Umbrel/Runtipi
      # manifests pin the tag outright. Left behind, a release quietly hands
      # those users an old filex -- the chart sat at v0.4.0 for twenty-three
      # releases before anyone noticed, and the three store manifests for
      # twenty-nine. A release that forgot one fails HERE, before anything is
      # published, rather than shipping something nobody can see is wrong.
      - name: Every deployment target matches the release
        run: node scripts/sync-deploy-versions.mjs --check

      - run: pnpm install --frozen-lockfile
      - name: Build frontend + sync into backend/embed
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          pnpm -r --filter='./packages/*' build
          pnpm --filter='./web' build
          mkdir -p backend/embed/admin backend/embed/web
          cp -r web/dist/. backend/embed/admin/
          cp -r packages/webcomponent/dist/. backend/embed/web/

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # ⚠⚠ The release BODY. GoReleaser builds it from `git log`, and the
      # filters in .goreleaser.yml drop `docs:`, `test:`, `chore:` and `ci:` —
      # so a release whose work landed under those prefixes published a page
      # with nothing on it. Measured on v0.34.2, this was the ENTIRE body:
      #
      #     ## Changelog
      #     ### Others
      #     * 99eb9eb… chore(release): v0.34.2
      #
      # while CHANGELOG.md carried 1,445 characters of prose for that same
      # version. The Releases page is where a stranger decides whether the
      # project is alive; it now carries the prose that already exists.
      #
      # ⚠ Measured on goreleaser v2.17.1: `--release-notes` replaces the
      # GENERATED CHANGELOG ONLY — `release.header` and `release.footer` from
      # .goreleaser.yml are still prepended and appended — so the file must not
      # repeat the `## filex vX` title the header already prints.
      #
      # ⚠ The script exits non-zero when the tag has no CHANGELOG.md section.
      # That stops the release HERE, before a single binary, image or package
      # is published, rather than after.
      - name: Release notes from CHANGELOG.md
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs --github "${GITHUB_REF_NAME}" > /tmp/release-notes.md
          wc -c /tmp/release-notes.md
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # A dry run builds the same eight binaries and publishes nothing:
          # --snapshot needs no tag, --skip=publish keeps the Release, the
          # Homebrew tap and winget untouched.
          args: ${{ env.PUBLISH == 'true' && 'release --clean --release-notes=/tmp/release-notes.md' || 'release --snapshot --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .goreleaser.yml → homebrew_casks (`filex` into BRF-Tech/homebrew-filex,
          # over this deploy key) and winget (`BRFTech.filex`, a PR to
          # microsoft/winget-pkgs from brkfun's fork). Each block skips itself
          # when its secret is absent.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # ⚠ The release's own tag, named. The commit also carries the Go
          # module's tag (backend/vX), and a dry run of a branch found that
          # one first: "current tag is not semver … tag=backend/v0.48.1", and
          # --snapshot could not build its version (dry run 36372592649).
          GORELEASER_CURRENT_TAG: v${{ needs.plan.outputs.version }}
      # The bare binaries cli-smoke runs, when there is no Release to take
      # them from. ⚠ goreleaser does not write a `formats: [binary]` archive
      # under its asset name: dist/artifacts.json maps `filex-linux-arm64` to
      # dist/filex_linux_arm64_v8.0/filex, renamed only on upload (dry run
      # 36374963952 found nothing at dist/filex-linux-arm64).
      - name: The bare binaries under their release names (dry run)
        if: env.PUBLISH != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bare
          jq -r '.[] | select(.type == "Binary" and (.name | startswith("filex-"))) | "\(.path) \(.name)"' dist/artifacts.json |
            while read -r src name; do cp "$src" "bare/$name"; done
          ls -la bare
      - name: Keep the binaries for the smoke tests (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: |
            bare/filex-linux-arm64
            bare/filex-linux-amd64
            bare/filex-darwin-arm64
            bare/filex-windows-arm64.exe
          if-no-files-found: error
          retention-days: 3
      # ⚠ goreleaser logs a failed winget/Homebrew publish and carries on
      # ("will not fail the pipeline"), so a release could miss both stores and
      # still show green. This step makes that visible.
      - name: Did the CLI reach winget and Homebrew?
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -uo pipefail
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in *-*) echo "pre-release: the stores are skipped on purpose"; exit 0 ;; esac
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::warning title=Homebrew::HOMEBREW_TAP_DEPLOY_KEY is not set, the filex cask was not published."
          elif gh api repos/BRF-Tech/homebrew-filex/contents/Casks/filex.rb --jq .content | base64 -d | grep -qF "version \"${VER}\""; then
            echo "Homebrew: Casks/filex.rb is at ${VER}"
          else
            echo "::warning title=Homebrew::Casks/filex.rb is not at ${VER}, see the goreleaser log above."
          fi
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning title=winget::WINGET_TOKEN is not set, BRFTech.filex was not submitted."
          else
            # The CLA bot asks on every pull request (scripts/winget-cla.sh).
            # ⚠ No search of our own first: the index lags a pull request
            # goreleaser opened seconds ago. v0.47.0's search found nothing and
            # the CLA went unsigned. winget-cla.sh looks for the exact title
            # for five minutes and warns when there is none.
            GH_TOKEN="$WINGET_TOKEN" CLA_COMPANY="BRF TEKNOLOJİ LİMİTED ŞİRKETİ" \
              bash .github/workflows/scripts/winget-cla.sh "New version: BRFTech.filex ${VER}"
            # Only the newest version's pull request stays open (the
            # maintainer, 2026-09-28): once this one exists, our older ones for the same
            # package are closed as superseded. Nothing is closed if it does not.
            GH_TOKEN="$WINGET_TOKEN" bash .github/workflows/scripts/winget-supersede.sh BRFTech.filex "${VER}"
          fi

  # ── The CLI and the server, on the machines they are built for ─────────
  #
  # ⚠ Why: every release since the first shipped linux/macOS/windows arm64
  # binaries and arm64 images, and nothing had ever RUN one. This boots each
  # arm64 binary's own server on a runner of that architecture and drives it
  # with its own CLI (.github/workflows/scripts/smoke-cli.mjs: /healthz, login,
  # mkdir, upload, byte-for-byte download, mv, rm). linux-amd64 is the control
  # that proves the smoke test itself. In a run on an existing tag the
  # published images are read back the same way.
  #
  # Published binaries come from the Release (what users download), a dry
  # run's from the artifact `binaries` kept. Not in a run that adds only the
  # macOS desktop packages (only=macos) or only the arm64 snap
  # (only=snap-arm64): neither adds a CLI to the Release.
  cli-smoke:
    name: CLI + server (${{ matrix.label }})
    needs: [plan, binaries]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.only != 'macos' && needs.plan.outputs.only != 'snap-arm64' && (needs.plan.outputs.full != 'true' || needs.binaries.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, label: linux-arm64, asset: filex-linux-arm64, arch: arm64 }
          - { os: windows-11-arm, label: windows-arm64, asset: filex-windows-arm64.exe, arch: arm64 }
          - { os: macos-15, label: macos-arm64, asset: filex-darwin-arm64, arch: arm64 }
          - { os: ubuntu-latest, label: linux-amd64, asset: filex-linux-amd64, arch: amd64 }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VER: ${{ needs.plan.outputs.version }}
      FROM_RELEASE: ${{ needs.plan.outputs.publish == 'true' || needs.plan.outputs.full != 'true' }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/workflows/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The binary (from the artifact)
        if: env.FROM_RELEASE != 'true'
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: bin
      - name: The binary (from the Release)
        if: env.FROM_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL --retry 3 -o "bin/$ASSET" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
      - name: Boot it and drive it with its own CLI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "bin/$ASSET" || true
          # (the +… form: macOS runs bash 3.2, where an empty array is "unbound")
          expect=()
          [ -n "$TAG" ] && expect=(--expect-version "$VER")
          node "$CI_SCRIPTS"/smoke-cli.mjs --binary "bin/$ASSET" --expect-arch "${{ matrix.arch }}" ${expect[@]+"${expect[@]}"}
      - name: The published images, read back on this architecture
        if: env.TAG != '' && github.event_name != 'push' && startsWith(matrix.label, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          for img in "ghcr.io/brf-tech/filex:$TAG" "ghcr.io/brf-tech/filex:slim-$TAG"; do
            docker pull -q "$img"
            node "$CI_SCRIPTS"/smoke-cli.mjs --image "$img" --expect-arch "${{ matrix.arch }}" --expect-version "$VER"
          done

  # ── Docker images → ghcr.io ────────────────────────────────────────────
  #
  # Two images, built once per architecture on a runner of that architecture:
  #
  #   docker/Dockerfile       full toolchain (ffmpeg, ghostscript, poppler,
  #                           libreoffice + a JRE, fonts)  → latest, vX, full,
  #                           full-vX
  #   docker/Dockerfile.slim  the binary and nothing else  → slim, slim-vX
  #
  # ⚠ Two things here were wrong for a long time and are worth stating so they
  # are not reintroduced:
  #
  # 1. `slim` was built from the FULL recipe. docs/DOCKER.md promised ~40 MB
  #    and the registry served 511 MB compressed — measured on v0.30.0, all
  #    three of latest/slim/full were byte-for-byte the same image. The only
  #    difference between the two Dockerfiles was one package (imagemagick vs
  #    vips-tools), and neither is called by anything in backend/internal/thumb.
  #    docker/Dockerfile.slim now makes the name true.
  #
  # 2. arm64 was emulated. QEMU only ever hurt the runtime stage — the Node and
  #    Go stages are pinned to $BUILDPLATFORM and the binary cross-compiles for
  #    free (CGO_ENABLED=0) — but that stage is `apk add libreoffice + JRE`,
  #    which is exactly the expensive thing to emulate. GitHub's free
  #    `ubuntu-24.04-arm` runner (verified for this repo: aarch64, 4 cpus,
  #    15 GiB) removes the emulation entirely. Each runner builds and pushes
  #    ONE architecture by digest; `docker-manifest` then joins the digests
  #    into the multi-arch tags.
  #
  # Each leg then loads what it built and runs it (smoke-cli.mjs --image) on
  # its own architecture: an arm64 image that builds but does not start never
  # becomes a candidate, let alone `latest`.
  #
  # ⚠⚠ This job runs in a run started by hand and in no promoting tag run (#174).
  # The dry run of a release candidate (`plan`) pushes both images BY DIGEST,
  # with no tag: nothing anybody pulls by name changes, and the digests travel
  # to the tag run as this run's `digests-<arch>` artifacts (14 days). The tag
  # run of the same commit then promotes exactly those bytes - `promote-check`
  # reads each image's labels and runs its `filex --version` on its own
  # architecture, `docker-manifest` joins the digests into the tags - instead
  # of building for 10-20 minutes again. The labels say which commit and
  # version each image was built from, and the tag run refuses any other.
  #
  # The one tag run it runs in is one with nothing to promote (#181): a
  # commit CircleCI tested while GitHub Actions was down has no dry run, so
  # `verify` says `promote` false. Then this job builds both images here and
  # pushes them by digest exactly as a candidate does, `promote-check` checks
  # this run's digests, and `docker-manifest` tags them.
  docker:
    needs: [plan, verify]
    if: needs.plan.outputs.full == 'true' && (github.event_name != 'push' || needs.verify.outputs.promote == 'false')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      # true in a release candidate's dry run, and in a tag run with nothing
      # to promote (#181): a push by digest, untagged.
      PUSH: ${{ needs.plan.outputs.candidate == 'true' || needs.verify.outputs.promote == 'false' }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # No setup-qemu-action: each job is native for its platform. Adding it
      # back would silently re-enable emulation for whichever arch is missing
      # a runner, turning a broken matrix into a slow build instead of a
      # visible failure.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Full image
        id: full
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.plan.outputs.stamp }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          # What the tag run checks before it promotes this image.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.stamp }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=full-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=full-${{ matrix.arch }}
          # By digest only; docker-manifest attaches the human tags, in the
          # tag run. Only a release candidate pushes at all, and a tag run
          # with nothing to promote (#181).
          outputs: type=image,name=ghcr.io/brf-tech/filex,push-by-digest=true,name-canonical=true,push=${{ env.PUSH == 'true' }}

      - name: Slim image
        id: slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.slim
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.plan.outputs.stamp }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.stamp }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=slim-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=slim-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/brf-tech/filex,push-by-digest=true,name-canonical=true,push=${{ env.PUSH == 'true' }}

      # The same two builds again into the local daemon — every layer comes
      # from the builder's cache of the builds above, so this is an export,
      # not a rebuild — and each image run and driven on this architecture.
      - name: Load both images for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.plan.outputs.stamp }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=full-${{ matrix.arch }}
          load: true
          tags: filex-smoke:full
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.slim
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.plan.outputs.stamp }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=slim-${{ matrix.arch }}
          load: true
          tags: filex-smoke:slim
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/workflows/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run both images on ${{ matrix.arch }} and drive them with their own CLI
        shell: bash
        run: |
          set -euo pipefail
          for img in filex-smoke:full filex-smoke:slim; do
            node "$CI_SCRIPTS"/smoke-cli.mjs --image "$img" --expect-arch "${{ matrix.arch }}" --expect-version "${{ needs.plan.outputs.version }}"
          done

      # The digests travel to the tag run as files named after the digest, so
      # the two matrix legs never collide. Overwritten on a re-run of a leg:
      # the digest kept is the one this commit's latest build pushed.
      - name: Record digests
        if: env.PUSH == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/full /tmp/digests/slim
          touch "/tmp/digests/full/${FULL_DIGEST#sha256:}"
          touch "/tmp/digests/slim/${SLIM_DIGEST#sha256:}"
        env:
          FULL_DIGEST: ${{ steps.full.outputs.digest }}
          SLIM_DIGEST: ${{ steps.slim.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # ── A tag run promotes the dry run's images ───────────────────────────────
  #
  # One leg per architecture, on a runner of that architecture: each digest the
  # dry run of this commit pushed (verify found that run) is pulled and must
  # say, in its labels, that it was built from THIS commit as THIS version, be
  # of this architecture, and answer `filex --version` with the tag and the
  # commit. Anything else and nothing is tagged.
  #
  # With nothing to promote (#181: `verify` took CircleCI's word, and there
  # is no dry run) the digests are the ones `docker` pushed in this very run,
  # and they are checked the same way.
  promote-check:
    name: The ${{ matrix.arch }} images are this tag's
    needs: [plan, verify, docker]
    # !cancelled(): `docker` is skipped in a tag run that promotes, and a
    # skipped need would skip this job. It asks for verify itself.
    if: ${{ !cancelled() && needs.plan.outputs.full == 'true' && github.event_name == 'push' && needs.verify.result == 'success' && (needs.verify.outputs.promote == 'true' || needs.docker.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests
          # The dry run's, or this run's own when there was none (#181).
          run-id: ${{ needs.verify.outputs.dry_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Each image was built from this commit, as this version, and says so
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          img=ghcr.io/brf-tech/filex
          for variant in full slim; do
            set -- /tmp/digests/"$variant"/*
            if [ "$#" -ne 1 ] || [ ! -e "$1" ]; then
              echo "::error::expected one $variant digest for $ARCH from the dry run, found: $*"
              exit 1
            fi
            ref="$img@sha256:$(basename "$1")"
            docker pull -q "$ref"
            rev=$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            ver=$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            arch=$(docker image inspect "$ref" --format '{{ .Architecture }}')
            out=$(docker run --rm --entrypoint /usr/local/bin/filex "$ref" --version)
            echo "$variant $ARCH: $ref"
            echo "  revision $rev, version $ver, architecture $arch, filex --version: $out"
            [ "$rev" = "$GITHUB_SHA" ] || { echo "::error::$variant ($ARCH) was built from $rev, not from $TAG's commit $GITHUB_SHA"; exit 1; }
            [ "$ver" = "$TAG" ] || { echo "::error::$variant ($ARCH) was built as $ver, not as $TAG"; exit 1; }
            [ "$arch" = "$ARCH" ] || { echo "::error::$variant is a $arch image, not $ARCH"; exit 1; }
            case "$out" in
              *"$TAG"*"$GITHUB_SHA"*) ;;
              *) echo "::error::$variant ($ARCH): filex --version says '$out', not $TAG ($GITHUB_SHA)"; exit 1 ;;
            esac
            echo "- $variant $ARCH: \`$ref\` - $out" >> "$GITHUB_STEP_SUMMARY"
          done

  # Joins the per-architecture digests into the tags people actually pull.
  # Nothing is tagged until BOTH architectures were checked, so a half-built
  # release never appears as `:latest`. The digests are the dry run's - a tag
  # run that promotes builds no image - or, with nothing to promote (#181),
  # the ones `docker` pushed in this run.
  docker-manifest:
    needs: [plan, verify, promote-check]
    # !cancelled() for the same reason as promote-check (a skipped `docker`
    # above it); it still waits for promote-check to pass, in a full run.
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.full == 'true' && !cancelled() && needs.promote-check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
          run-id: ${{ needs.verify.outputs.dry_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        run: |
          set -euo pipefail
          img=ghcr.io/brf-tech/filex
          ver="${GITHUB_REF_NAME}"

          join() {                       # join <variant> <tag...>
            local variant="$1"; shift
            local srcs=()
            for f in /tmp/digests/"$variant"/*; do
              srcs+=("${img}@sha256:$(basename "$f")")
            done
            [ "${#srcs[@]}" -eq 2 ] || {
              echo "expected 2 digests for ${variant}, found ${#srcs[@]}" >&2
              exit 1
            }
            local args=()
            for t in "$@"; do args+=(-t "${img}:${t}"); done
            docker buildx imagetools create "${args[@]}" "${srcs[@]}"
          }

          join full "latest" "${ver}" "full" "full-${ver}"
          join slim "slim" "slim-${ver}"

          docker buildx imagetools inspect "${img}:${ver}"
          docker buildx imagetools inspect "${img}:slim-${ver}"

  # ── npm packages → npmjs (@brftech scope) ─────────────────────────────
  # Independent of `binaries` so it can be re-run on its own. Published through
  # npm's trusted publishing (OIDC), with no token: every package has a trusted
  # publisher on npmjs.com (the package's Settings page) that names GitHub
  # Actions, BRF-Tech / filex and the workflow file release.yml, with
  # `npm publish` allowed. A package without one is refused and this job fails
  # (ENEEDAUTH). A NEW package cannot have one before it exists, so its first
  # version is published by hand (docs/CONTRIBUTING.md → Release process).
  # Package versions are pinned to the tag, so a `v0.1.60` tag publishes
  # @brftech/*@0.1.60.
  #
  # ⚠ The token this job used to read (NPM_TOKEN, an npm granular token, 90
  # days at most) ran out unnoticed: 0.50.0 went out without its npm packages
  # (PUT 404). There is no secret here to run out.
  npm:
    needs: [plan, verify]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    # id-token: write lets the job ask GitHub for its identity, which npm
    # trades for a short-lived publish token per package. Nothing else is
    # granted: the release-wide contents/packages write is not needed here.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later on Node 22.14.0 or later
      # (docs.npmjs.com/trusted-publishers). Node 22 brings npm 10, so npm 11
      # goes over it, and both are checked before anything is published: a
      # runner image that changes either fails here, in words.
      - name: npm that can publish through trusted publishing
        run: |
          npm install -g npm@11
          at_least() { [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }
          npm_v=$(npm --version)
          node_v=$(node --version)
          node_v=${node_v#v}
          echo "npm $npm_v, Node $node_v"
          at_least 11.5.1 "$npm_v" || { echo "::error::npm $npm_v cannot publish through trusted publishing: it needs 11.5.1 or later"; exit 1; }
          at_least 22.14.0 "$node_v" || { echo "::error::Node $node_v cannot publish through trusted publishing: it needs 22.14.0 or later"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm -r --filter='./packages/*' build
      # pnpm publish packs each package (the workspace:* ranges become the real
      # version) and hands the tarball to `npm publish`, the npm installed
      # above, which does the trusted publishing. Its recursive form does not
      # pass --provenance on, so provenance is asked for in npm's own config
      # (NPM_CONFIG_PROVENANCE); npm adds it to a trusted publish of a public
      # package from a public repository anyway.
      #
      # ⚠ npm checks the provenance against each package's repository.url as
      # written, letter case included, and refuses a mismatch (E422). The
      # export writes github.com/brf-tech/filex; GitHub signs
      # github.com/BRF-Tech/filex. So the url is set here from the repository
      # the run is in.
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          VER="${GITHUB_REF_NAME#v}"
          pnpm -r --filter='./packages/*' exec npm version "$VER" --no-git-tag-version --allow-same-version
          pnpm -r --filter='./packages/*' exec npm pkg set "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git"
          pnpm publish --filter='./packages/*' --access public --no-git-checks

  # ── Desktop packages ────────────────────────────────────────────────────
  #
  # ⚠⚠ These used to be built BY HAND, which is why they drifted: at v0.20.0
  # the desktop app was still shipping 0.18.2, so the connections and tokens
  # screens the release was named after did not exist for anyone who had
  # installed it. A package that is produced only when somebody remembers is a
  # package that is two releases old.
  #
  # ⚠⚠ `needs: binaries`, and the reason is the UPLOAD rather than the build.
  # The installer embeds the CLI, but desktop/scripts/fetch-cli.mjs builds that
  # from source when FILEX_CLI_BIN is unset, so the build itself waits for
  # nothing — which is why this job first ran in parallel. The GitHub Release
  # is created by goreleaser inside `binaries`, and `gh release upload` against
  # a tag with no release yet fails: v0.20.1 duly produced a 125 MB AppImage
  # and an 87 MB .deb, then attached neither. It does NOT wait for `docker`:
  # the images are not an input to the installers, and waiting for them cost
  # every release ~25 minutes of idle (v0.20.2 measurement in the header).
  # (When packages are added to an existing release - only=arm64, macos or
  # snap-arm64 - `binaries` does not run and is not waited for: the Release
  # exists. `verify` is waited for in every run: it is what lets a publishing
  # run publish.)
  #
  # ⚠ macOS ships UNSIGNED but ad-hoc SEALED (desktop/scripts/adhoc-sign.cjs).
  # The distinction is what dialog the user gets: a linker-signed-only bundle
  # (what electron-builder emits with no certificate) is treated as TAMPERED —
  # macOS 26 says "malware blocked and moved to Trash", no override offered
  # (measured 2026-08-18). A deep ad-hoc re-seal turns that into the honest
  # "unverified developer" dialog with the System Settings → Open Anyway path.
  # Still second-best: a Developer ID certificate + notarization removes the
  # dialog entirely, and mac AUTO-update stays inert until then (Squirrel.Mac
  # refuses to swap an unsigned app). arm64 only — macOS 26 deprecates Rosetta,
  # and the fleet this ships to is Apple Silicon.
  #
  # ⚠ The artefacts are attached to the GitHub Release, which is NOT the
  # auto-update feed: this repository is private, and pointing electron-updater
  # at it would mean embedding a token in the app. The feed stays on
  # filex.sh/desktop/ and is published by scripts/filex-publish-desktop.sh from
  # these files.
  #
  # ── arm64 ──
  # Linux arm64 is its own row on ubuntu-24.04-arm (see `plan`). Windows arm64
  # is built by the windows and store rows right after their x64 build, with
  # GOARCH=arm64 for the embedded CLI. electron-updater reads ONE latest.yml on
  # Windows whatever the CPU, so the two feeds are joined
  # (merge-latest-yml.mjs: x64 first — the installs that exist today are x64
  # and read exactly the entry they read before). The Store row bundles both
  # .appx into one .msixbundle for Partner Center. Every row then checks the
  # binaries inside what it built are the architecture it claims
  # (arch-of.mjs): an arm64 installer with an x64 CLI inside would install,
  # open, and fail at the first sync.
  #
  # ── A tag run promotes (#174) ──
  # A tag run builds none of this. The dry run of its commit - a release
  # candidate, `plan` - kept each row's files with their sha256 sums
  # (release-files.mjs keep, artifact release-files-<row>), and the tag run
  # downloads them, checks them byte for byte and against the version
  # (release-files.mjs check), and runs only the steps that publish: the
  # Release, the stores, winget and the cask. Its rows are the ones the dry run
  # kept files for (`verify`): without macOS when the dry run was started with
  # -f macos=false.
  # A tag run with nothing to promote (#181: `verify` took CircleCI's word,
  # and no dry run ran) builds every row of the plan here, as a dry run does,
  # and publishes what it built: PROMOTE is verify's `promote`, not the event.
  desktop:
    name: Desktop packages (${{ matrix.label }})
    needs: [plan, verify, binaries]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.verify.result == 'success' && (needs.plan.outputs.full != 'true' || needs.binaries.result == 'success') }}
    strategy:
      fail-fast: false
      # A tag run: the rows its dry run kept files for (verify). Otherwise
      # the rows plan wrote.
      matrix: ${{ fromJSON(needs.verify.outputs.desktop || needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    # gh release upload needs contents: write; a tag run downloads the dry
    # run's artifacts (actions: read). Nothing here pushes an image.
    permissions:
      actions: read
      contents: write
    env:
      # A tag run with a dry run promotes the files it built (verify:
      # promote); a release candidate keeps them for that (see the note
      # above the job).
      PROMOTE: ${{ needs.verify.outputs.promote == 'true' }}
      CANDIDATE: ${{ needs.plan.outputs.candidate }}
      # Partner Center → an Entra ID app with the Manager role
      # (desktop/store/microsoft/listing.md). Mapped to env because a step's
      # `if:` cannot read `secrets` directly.
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      # A classic PAT with `public_repo`, from the account whose fork of
      # microsoft/winget-pkgs the pull requests come from (brkfun).
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      # The tap's deploy key (write access to BRF-Tech/homebrew-filex only).
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      TAG: ${{ needs.plan.outputs.tag }}
      VER: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      FULL: ${{ needs.plan.outputs.full }}
      ONLY: ${{ needs.plan.outputs.only }}
      LABEL: ${{ matrix.label }}
      ARCHES: ${{ matrix.arches }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/workflows/scripts
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-go@v5
        if: env.PROMOTE != 'true'
        with:
          go-version-file: backend/go.mod
      - name: Install the dependencies
        if: env.PROMOTE != 'true'
        run: pnpm install --frozen-lockfile
      # desktop/scripts/sync-web.mjs copies packages/webcomponent/dist into the
      # app, so the packages have to exist before the installer is built.
      - name: Build packages
        if: env.PROMOTE != 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm -r --filter='./packages/*' build
      # ⚠⚠ The tag is the version, not desktop/package.json. That file is
      # maintained by hand and was still on 0.20.0 while this workflow built
      # v0.20.1 — which would have stamped `latest.yml` with 0.20.0, so an app
      # already on 0.20.0 would read the feed, compare equal, and report itself
      # up to date forever. The package would have been built, published, and
      # invisible. (A dry run of a branch keeps package.json's version.)
      - name: Stamp the version from the tag
        if: env.PROMOTE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          npm version "$VER" --no-git-tag-version --allow-same-version
          node -e "console.log('desktop version =', require('./package.json').version)"
      # `dist:linux` builds an .rpm as well (desktop/electron-builder.yml), and
      # fpm hands that to rpmbuild, which ubuntu-latest does not ship. (A row
      # with no `script`, only=snap-arm64's, builds no .rpm or .deb.)
      - name: rpmbuild for the .rpm
        if: startsWith(matrix.label, 'linux') && matrix.script != '' && env.PROMOTE != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      # ⚠ electron-builder's own fpm (for the .deb and .rpm) is an x86-64
      # bundle with its own Ruby: on arm64 it cannot start. USE_SYSTEM_FPM
      # makes it call this one.
      - name: fpm for the arm64 .deb and .rpm
        if: matrix.label == 'linux-arm64' && matrix.script != '' && env.PROMOTE != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          fpm --version
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - name: Build installer
        if: matrix.script != '' && env.PROMOTE != 'true'
        env:
          # Never let the mac runner auction its keychain: a stray self-signed
          # certificate would produce a "signed" build that fails Gatekeeper
          # WORSE than the ad-hoc seal. Delete this line (and set CSC_LINK /
          # CSC_KEY_PASSWORD secrets) when a real Developer ID lands.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter ./desktop run ${{ matrix.script }}
      # only=snap-arm64: the row has no `script` (see plan), so nothing above
      # made the AppImage, .deb or .rpm, whose Release copies are pinned by
      # hash. The app and its CLI are built as dist:linux builds them (on this
      # arm64 runner the CLI is arm64, checked below), and "Build snap" packs
      # the snap alone from them.
      - name: Build the app and the CLI for the snap alone
        if: env.ONLY == 'snap-arm64'
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          pnpm run build
          node scripts/fetch-cli.mjs --platform linux
      # The x64 feed, set aside before the arm64 build writes its own
      # latest.yml over it (joined below).
      - name: Set the x64 Windows feed aside
        if: matrix.label == 'windows' && contains(matrix.arches, 'x64') && env.PROMOTE != 'true'
        shell: bash
        run: mv desktop/release/latest.yml "$RUNNER_TEMP/latest-x64.yml"
      # NSIS installer + portable .exe for Windows on Arm, cross-built: the
      # app has no native modules, electron-builder fetches the arm64
      # Electron, and fetch-cli.mjs compiles the embedded CLI for GOARCH.
      # ⚠ GOARCH, not `--arch`: a run on an older tag has a fetch-cli.mjs that
      # only knows the variable.
      - name: Build the Windows arm64 installers
        if: matrix.label == 'windows' && contains(matrix.arches, 'arm64') && env.PROMOTE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          pnpm run build
          GOARCH=arm64 node scripts/fetch-cli.mjs --platform win32
          pnpm exec electron-builder --win --arm64 --publish never
          mv release/latest.yml "$RUNNER_TEMP/latest-arm64.yml"
      # One latest.yml for both (see merge-latest-yml.mjs). Adding arm64 to a
      # release that has its x64 installer already: that release's own
      # latest.yml is the x64 half, byte for byte.
      - name: One Windows update feed for both architectures
        if: matrix.label == 'windows' && env.PROMOTE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          feeds=()
          if [ -f "$RUNNER_TEMP/latest-x64.yml" ]; then
            feeds+=("$RUNNER_TEMP/latest-x64.yml")
          else
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.yml -O "$RUNNER_TEMP/latest-release.yml"
            feeds+=("$RUNNER_TEMP/latest-release.yml")
          fi
          [ -f "$RUNNER_TEMP/latest-arm64.yml" ] && feeds+=("$RUNNER_TEMP/latest-arm64.yml")
          node "$CI_SCRIPTS"/merge-latest-yml.mjs --out desktop/release/latest.yml "${feeds[@]}"
          cat desktop/release/latest.yml
      # The snap is its own target (never part of `dist:linux`), packed from
      # the app the step above just built — no second web/main build, no second
      # CLI. On x64, electron-builder's prebuilt snap template needs no
      # snapcraft. On arm64 there is no template (electron-builder 24 has x64
      # and armv7l only): it writes a snapcraft.yaml for the same base (core20)
      # and runs snapcraft, which builds inside an LXD container.
      # ⚠ `--publish never`: on a tag electron-builder publishes by itself, and
      # a snap's default publisher is the Snap Store — the upload is the
      # explicit step further down, which says so when it cannot run.
      - name: snapcraft + LXD for the arm64 snap
        if: matrix.label == 'linux-arm64' && env.PROMOTE != 'true'
        run: |
          set -euo pipefail
          # ⚠ 8.x: snapcraft 9 refuses base core20 outright ("Base 'core20'
          # is not supported by this version of Snapcraft", dry run
          # 36373259912), and core20 is the base the x64 template snap has.
          sudo snap install snapcraft --classic --channel=8.x/stable
          sudo snap install lxd 2>/dev/null || sudo snap refresh lxd
          sudo lxd waitready
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          sudo chmod 666 /var/snap/lxd/common/lxd/unix.socket
          # Docker's rules drop forwarded traffic, and with them the LXD
          # container's network (the build fetches its stage packages).
          sudo iptables -P FORWARD ACCEPT
          snapcraft --version
          echo "SNAPCRAFT_BUILD_ENVIRONMENT=lxd" >> "$GITHUB_ENV"
      - name: Build snap
        if: startsWith(matrix.label, 'linux') && env.PROMOTE != 'true'
        run: pnpm --filter ./desktop exec electron-builder --linux snap --publish never
      # store-e2e registers the package from loose files, which needs no
      # certificate but does need Developer Mode. The runner is a throwaway
      # admin VM, so it is switched on here rather than signing a test cert.
      - name: Developer Mode (for the Store package check)
        if: matrix.label == 'store' && contains(matrix.arches, 'x64') && env.PROMOTE != 'true'
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      # ⚠ Before anything leaves the runner: installed, launched through its
      # protocol, and asked over DevTools whether it knows it is a Store copy.
      # A package Partner Center accepts is not a package that works.
      # The checks that need Windows to ACTIVATE the package (a protocol
      # launch, the app answering from inside it, its toast in Action Center)
      # only warn here: this runner has never activated one (v0.44.2 through
      # v0.46.1, see desktop/scripts/lib/store-activation.mjs). They are hard
      # gates in the local release run instead (scripts/release/plan.mjs,
      # "desktop: the Store package works as a Store copy"), on a desktop, for
      # the same commit, before the tag exists.
      # ⚠ Runs on the x64 package, BEFORE the arm64 one is built: it builds its
      # own variant from build/bin, which then still holds the x64 CLI.
      - name: Install the Store package and check it as a Store copy
        if: matrix.label == 'store' && contains(matrix.arches, 'x64') && env.PROMOTE != 'true'
        run: pnpm --filter ./desktop run e2e:store
      - name: Build the arm64 Store package
        if: matrix.label == 'store' && contains(matrix.arches, 'arm64') && env.PROMOTE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          pnpm run build
          GOARCH=arm64 node scripts/fetch-cli.mjs --platform win32
          pnpm exec electron-builder --win appx --arm64 --publish never
      # One upload for Partner Center: both packages in a .msixbundle (the
      # Store's own recommendation for more than one architecture). Packages
      # in a bundle must be identical but for ProcessorArchitecture, and the
      # bundle carries their version; makeappx refuses anything else.
      - name: Bundle the Store packages
        if: matrix.label == 'store' && contains(matrix.arches, 'x64') && contains(matrix.arches, 'arm64') && env.PROMOTE != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $appx = @(Get-ChildItem desktop/release/*.appx)
          if ($appx.Count -ne 2) { throw "expected the x64 and the arm64 .appx, found: $($appx.Name -join ', ')" }
          $versions = foreach ($a in $appx) {
            $zip = [IO.Compression.ZipFile]::OpenRead($a.FullName)
            try {
              $reader = New-Object IO.StreamReader($zip.GetEntry('AppxManifest.xml').Open())
              $id = ([xml]$reader.ReadToEnd()).Package.Identity
              $reader.Dispose()
              Write-Host "$($a.Name): $($id.Name) $($id.Version) $($id.ProcessorArchitecture)"
              $id.Version
            } finally { $zip.Dispose() }
          }
          $v = @($versions | Select-Object -Unique)
          if ($v.Count -ne 1) { throw "the packages carry different versions: $($versions -join ', ')" }
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'bundle'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $appx.FullName $dir
          & $makeappx.FullName bundle /d $dir /p desktop/release/filex-desktop.msixbundle /bv $v[0] /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed ($LASTEXITCODE)" }
          Get-Item desktop/release/filex-desktop.msixbundle
      # ── A tag run: the files the dry run of this commit built ──
      # Nothing above ran (`PROMOTE`). Every step below reads desktop/release,
      # so the dry run's files go there, and are checked before any of them is
      # published: exactly the files it kept, byte for byte, and feeds that
      # offer this version.
      - name: The files the dry run built
        if: env.PROMOTE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-files-${{ matrix.label }}
          path: desktop/release
          run-id: ${{ needs.verify.outputs.dry_run }}
          github-token: ${{ github.token }}
      - name: They are the files the dry run kept, for this version
        if: env.PROMOTE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node "$CI_SCRIPTS"/release-files.mjs check desktop/release --version "$VER"
          rm desktop/release/release-files.sha256
      # Listed before uploading so a build that produced nothing is visible in
      # the log as an empty directory rather than as a silently short release.
      # (After every build step: the Store row builds its arm64 package late.)
      - name: What was produced
        shell: bash
        run: ls -la desktop/release
      # Every executable in what was built is the architecture it is sold as —
      # the app itself and the CLI it syncs with (see arch-of.mjs).
      # (Not in a tag run: the unpacked apps it reads are not promoted, and the
      # dry run checked these very packages.)
      - name: The binaries inside are the architecture on the label
        if: env.PROMOTE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          r=desktop/release
          check() { node "$CI_SCRIPTS"/arch-of.mjs "$@"; }
          case "$LABEL" in
            windows|store)
              for a in $ARCHES; do
                d="$r/win-unpacked"; [ "$a" = arm64 ] && d="$r/win-arm64-unpacked"
                check "$d/filex.exe" "$d/resources/bin/filex.exe" --expect "$a"
              done ;;
            # Linux: `filex-app` is the launcher (desktop/build/linux/launcher.sh,
            # put there by desktop/scripts/linux-launcher.cjs); the Electron
            # binary is filex-app-bin beside it.
            linux)
              head -1 "$r/linux-unpacked/filex-app" | grep -qx '#!/bin/sh'
              check "$r/linux-unpacked/filex-app-bin" "$r/linux-unpacked/resources/bin/filex" --expect amd64 ;;
            linux-arm64)
              head -1 "$r/linux-arm64-unpacked/filex-app" | grep -qx '#!/bin/sh'
              check "$r/linux-arm64-unpacked/filex-app-bin" "$r/linux-arm64-unpacked/resources/bin/filex" --expect arm64 ;;
            macos) check "$r/mac-arm64/filex.app/Contents/MacOS/filex" "$r/mac-arm64/filex.app/Contents/Resources/bin/filex" --expect arm64 ;;
          esac
      # The arm64 packages, for desktop-arm64-check to install and open on a
      # real arm64 machine (and for a person to try from a dry run).
      - name: Keep the arm64 packages for the check on arm64 machines
        if: matrix.label == 'windows' || matrix.label == 'linux-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-arm64-${{ matrix.label }}
          path: |
            desktop/release/*arm64*.exe
            desktop/release/*arm64*.AppImage
            desktop/release/*arm64*.deb
            desktop/release/*aarch64*.rpm
            desktop/release/*arm64*.snap
          if-no-files-found: error
          retention-days: 7
      # The x64 Linux packages, for the same check on an x64 Ubuntu 24.04
      # machine (desktop-arm64-check, linux-x64 row). Since 0.50 every Linux
      # build starts through a launcher that refuses to run without Chromium's
      # sandbox (outside the snap, which relies on its confinement since 0.52),
      # so the x64 .deb, AppImage and snap are opened as carefully as the
      # arm64 ones.
      - name: Keep the x64 Linux packages for the check
        if: matrix.label == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-x64-linux
          path: |
            desktop/release/*x86_64.AppImage
            desktop/release/*amd64.deb
            desktop/release/*amd64.snap
          if-no-files-found: error
          retention-days: 7
      # A release candidate keeps what the tag run of its commit will publish,
      # with the sums that run checks (release-files.mjs). 14 days: a tag comes
      # hours after its dry run, and a re-run of a leg replaces its own files.
      - name: Sum the release files for the tag run
        if: env.CANDIDATE == 'true'
        shell: bash
        run: node "$CI_SCRIPTS"/release-files.mjs keep desktop/release
      - name: Keep the release files for the tag run
        if: env.CANDIDATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ matrix.label }}
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.snap
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.appx
            desktop/release/*.msixbundle
            desktop/release/latest*.yml
            desktop/release/release-files.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Keep the Store package for Partner Center
        if: matrix.label == 'store'
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ needs.plan.outputs.tag || format('run-{0}', github.run_id) }}
          path: |
            desktop/release/*.msixbundle
            desktop/release/*.appx
          if-no-files-found: error
          retention-days: 90
      - name: Microsoft Store CLI
        if: matrix.label == 'store' && env.PUBLISH == 'true' && env.MSSTORE_CLIENT_SECRET != '' && env.MSSTORE_PRODUCT_ID != ''
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Submit to the Microsoft Store
        if: matrix.label == 'store' && env.PUBLISH == 'true' && env.MSSTORE_CLIENT_SECRET != '' && env.MSSTORE_PRODUCT_ID != ''
        shell: pwsh
        run: |
          # The bundle (x64 + arm64) when this run built both; otherwise the
          # one .appx, which the CLI takes under an .msix name (same format).
          $msix = (Get-ChildItem desktop/release/*.msixbundle | Select-Object -First 1).FullName
          if (-not $msix) {
            $appx = Get-ChildItem desktop/release/*.appx | Select-Object -First 1
            $msix = Join-Path $appx.DirectoryName ($appx.BaseName + '.msix')
            Copy-Item $appx.FullName $msix
          }
          # Uploads, points "What's new" at the GitHub Release in every
          # listing language and sends the submission to certification; skips
          # with a warning while an earlier one is still in certification
          # (scripts/msstore-submit.ps1). Never fails the release.
          $ver = "$env:VER"
          ./.ci/.github/workflows/scripts/msstore-submit.ps1 -Msix $msix -Version $ver
          exit 0
      # Not a silent skip: a release that did not reach the Store says so.
      - name: Store submission skipped
        if: matrix.label == 'store' && env.PUBLISH == 'true' && (env.MSSTORE_CLIENT_SECRET == '' || env.MSSTORE_PRODUCT_ID == '')
        shell: bash
        run: |
          echo "::warning title=Microsoft Store::Not submitted — MSSTORE_* secrets or the MSSTORE_PRODUCT_ID variable are not set. Upload the msix-${TAG} artifact in Partner Center by hand."
      - name: Attach to the release
        if: matrix.label != 'store' && env.PUBLISH == 'true' && env.ONLY != 'snap-arm64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/release/*.exe desktop/release/*.blockmap desktop/release/*.AppImage \
                 desktop/release/*.deb desktop/release/*.rpm desktop/release/*.snap \
                 desktop/release/*.dmg desktop/release/*.zip \
                 desktop/release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no desktop artefacts to upload" >&2
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "${TAG}" "${files[@]}" --clobber
      # only=snap-arm64: the one file, by name - never the glob above, which
      # would take whatever else is in desktop/release (a latest*.yml, say)
      # over a Release whose AppImage, .deb, .rpm, installers and feeds are
      # pinned by hash in the winget pull request and the update feeds. The
      # snap is pinned nowhere (snaps update from the Store). --clobber: a
      # re-run after a failed Store upload replaces its own earlier file
      # instead of stopping here, before the Store.
      - name: Attach the arm64 snap to the release
        if: env.ONLY == 'snap-arm64' && env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          snap=desktop/release/filex-desktop-arm64.snap
          [ -f "$snap" ] || { echo "no $snap to attach" >&2; exit 1; }
          gh release upload "${TAG}" "$snap" --clobber
      # ── winget + Homebrew (the desktop app; the CLI goes through goreleaser) ──
      # desktop/scripts/pkg-manifests.mjs writes both, hashing the files this
      # job just built and pointing at the VERSIONED release URL. The winget
      # manifest names both Windows installers, x64 and arm64.
      # ⚠ From here on this tag's assets are pinned by hash in two public
      # stores: never re-upload them. A fix is a new patch release.
      # (Adding the ARM packages to an existing release leaves the manifests
      # of that release alone: its winget pull request is already open.
      # Adding the macOS packages (only=macos) writes the Homebrew cask from
      # the .dmg just built, as the tag push would have, and commits it below;
      # winget is left alone, Windows is not built.)
      - name: Package-manager manifests
        if: (matrix.label == 'windows' && env.FULL == 'true') || (matrix.label == 'macos' && (env.FULL == 'true' || env.ONLY == 'macos'))
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.label }}" = windows ]; then
            node desktop/scripts/pkg-manifests.mjs --version "$VER" --release-date "$(date -u +%F)" \
              --windows desktop/release/filex-desktop-x64.exe \
              --windows-arm64 desktop/release/filex-desktop-arm64.exe --out pkg-out
          else
            node desktop/scripts/pkg-manifests.mjs --version "$VER" \
              --mac desktop/release/filex-desktop-arm64.dmg --out pkg-out
          fi
      # ⚠ `winget validate` exits non-zero for WARNINGS too. v0.44.2: the
      # runner's winget did not know schema 1.12.0 yet and warned about the
      # `$schema` header lines ("succeeded with warnings") — the same header
      # goreleaser writes and microsoft/winget-pkgs accepts — and the step
      # failed, so BRFTech.filex-app was never submitted. Warnings are shown
      # as an annotation; only a failed validation stops the release.
      - name: Validate the winget manifests
        if: matrix.label == 'windows' && env.FULL == 'true'
        shell: pwsh
        run: |
          $dir = (Get-ChildItem pkg-out/winget/manifests -Recurse -Filter '*.installer.yaml' | Select-Object -First 1).Directory.FullName
          $out = (winget validate --manifest $dir 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          # -1978335192 (0x8A150028) = "validation succeeded with warnings";
          # -1978335191 is a failed validation. Measured with winget 1.29.
          if ($code -ne 0 -and $code -ne -1978335192) { exit 1 }
          if ($code -ne 0) { Write-Host "::warning title=winget::winget validate passed with warnings; see the log of this step." }
          "WINGET_DIR=$dir" >> $env:GITHUB_ENV
          # ⚠⚠ GitHub ends a pwsh step with `exit $LASTEXITCODE`: without this
          # line the tolerated warning code above still fails the step (v0.45.1,
          # run 36182595696 — the desktop winget PR was never opened).
          exit 0
      - name: Submit to winget
        if: matrix.label == 'windows' && env.PUBLISH == 'true' && env.FULL == 'true' && env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $ver = "$env:VER"
          ./wingetcreate.exe submit --no-open --prtitle "New version: BRFTech.filex-app $ver" --token $env:WINGET_TOKEN $env:WINGET_DIR
      # The CLA bot asks on every pull request, not once per account
      # (scripts/winget-cla.sh). Same script as the CLI's step.
      - name: Sign the CLA on the winget pull request
        if: matrix.label == 'windows' && env.PUBLISH == 'true' && env.FULL == 'true' && env.WINGET_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          CLA_COMPANY: BRF TEKNOLOJİ LİMİTED ŞİRKETİ
        run: |
          bash "$CI_SCRIPTS"/winget-cla.sh "New version: BRFTech.filex-app ${VER}"
      # Only the newest version's pull request stays open (the maintainer, 2026-09-28),
      # and only once it exists (scripts/winget-supersede.sh).
      - name: Close the superseded winget pull requests
        if: matrix.label == 'windows' && env.PUBLISH == 'true' && env.FULL == 'true' && env.WINGET_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          bash "$CI_SCRIPTS"/winget-supersede.sh BRFTech.filex-app "${VER}"
      - name: Commit the cask to the tap
        if: matrix.label == 'macos' && env.PUBLISH == 'true' && (env.FULL == 'true' || env.ONLY == 'macos') && env.HOMEBREW_TAP_DEPLOY_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:BRF-Tech/homebrew-filex.git tap
          mkdir -p tap/Casks
          cp pkg-out/homebrew/Casks/filex-app.rb tap/Casks/
          cd tap
          git add Casks/filex-app.rb
          if git diff --cached --quiet; then echo "cask already at ${VER}"; exit 0; fi
          git -c user.name="filex release" -c user.email="hello@brf.sh" commit -m "filex-app ${VER}"
          git push origin HEAD
      # Not a silent skip: a release that did not reach a store says so.
      - name: Package-manager submission skipped
        if: env.PUBLISH == 'true' && ((matrix.label == 'windows' && env.FULL == 'true' && env.WINGET_TOKEN == '') || (matrix.label == 'macos' && (env.FULL == 'true' || env.ONLY == 'macos') && env.HOMEBREW_TAP_DEPLOY_KEY == ''))
        shell: bash
        run: |
          echo "::warning title=${{ matrix.label == 'windows' && 'winget' || 'Homebrew' }}::Not submitted — the ${{ matrix.label == 'windows' && 'WINGET_TOKEN' || 'HOMEBREW_TAP_DEPLOY_KEY' }} secret is not set. The manifests are in the pkg-${{ matrix.label }} artifact."
      # always(): a failed validation or submission is exactly when the
      # manifests are needed, to submit them by hand.
      - name: Keep the manifests
        if: always() && ((matrix.label == 'windows' && env.FULL == 'true') || (matrix.label == 'macos' && (env.FULL == 'true' || env.ONLY == 'macos')))
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.label }}-${{ needs.plan.outputs.tag || format('run-{0}', github.run_id) }}
          path: pkg-out
          retention-days: 90
      # ⚠⚠ Never a silent skip. Without the secret the snap is still on the
      # Release (above) but NOT in the Snap Store, and the run says so as a
      # warning annotation and in the summary — a store that quietly stops
      # getting releases is found months later by a user, not by us.
      # The secret is `snapcraft export-login --snaps=filex-app --acls=…` output
      # (desktop/README.md, "Publishing"); the snap is `filex-app` — `filex` is
      # the CLI's name. Straight to `stable`: the snap
      # is the same build the .deb is, and the Store's own review runs first.
      # Each Linux row uploads its own architecture's revision to the same
      # channel: amd64 from `linux`, arm64 from `linux-arm64` (with
      # only=snap-arm64, that one alone).
      - name: Upload to the Snap Store
        if: startsWith(matrix.label, 'linux') && env.PUBLISH == 'true'
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          snap=desktop/release/filex-desktop-amd64.snap
          [ "$LABEL" = linux-arm64 ] && snap=desktop/release/filex-desktop-arm64.snap
          [ -f "$snap" ] || { echo "no $snap to upload" >&2; exit 1; }
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS:-}" ]; then
            msg="SNAPCRAFT_STORE_CREDENTIALS is not set: $snap was NOT uploaded to the Snap Store (credentials missing). It is attached to the GitHub Release only."
            echo "::warning title=Snap Store: not uploaded::$msg"
            echo "### Snap Store: not uploaded (no credentials)" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          command -v snapcraft >/dev/null || sudo snap install snapcraft --classic
          snapcraft whoami
          # ⚠ 0.50 and 0.51 asked for `browser-support` with
          # `allow-sandbox: true`, which the Store reviews by hand: their
          # revisions waited in manual review and never reached stable. Since
          # 0.52 the snap asks for nothing of the kind (it runs with
          # --no-sandbox under strict confinement), so the automatic review
          # should pass. Should the Store still hold a revision for a manual
          # review, the upload is done and the release is not failed: the run
          # says so and carries on. Any other failure fails.
          set +e
          out=$(snapcraft upload --release=stable "$snap" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            if printf '%s' "$out" | grep -qi 'manual review'; then
              msg="$(basename "$snap") is uploaded and waits for the Snap Store's manual review; it reaches stable once the review passes. Since 0.52 the snap asks for nothing the Store reviews by hand: read the reason the Store gives."
              echo "::warning title=Snap Store: manual review::$msg"
              echo "### Snap Store: waiting for manual review" >> "$GITHUB_STEP_SUMMARY"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$rc"
          fi
          echo "### Snap Store: $(basename "$snap") uploaded to stable" >> "$GITHUB_STEP_SUMMARY"

  # ── The arm64 packages, on arm64 machines (and Linux x64) ─────────────
  #
  # The Windows arm64 packages are cross-built, and nothing about a build
  # proves the result starts on the CPU it is for. So each is installed the way
  # a user installs it and OPENED on a real arm64 machine: the .deb (apt), the
  # AppImage and the snap on ubuntu-24.04-arm, the NSIS installer (silent,
  # per-user, then uninstalled) and the portable .exe on windows-11-arm.
  # desktop-look.mjs waits for the window to load a page and photographs it
  # over DevTools; the pictures are kept as `desktop-arm64-screenshots` and
  # are looked at before a release is called good.
  #
  # ⚠⚠ Linux, since 0.50: a window is not enough. The 0.49 AppImage and snap
  # opened windows with Chromium's sandbox OFF (--no-sandbox), so the .deb and
  # the AppImage are checked for the sandbox (--expect-sandbox: each renderer
  # in its own PID namespace, no --no-sandbox anywhere), and the AppImage
  # before its AppArmor profile is checked to REFUSE with the launcher's
  # message (--expect-refusal). The snap (since 0.52) runs with --no-sandbox
  # under strict confinement: the Store grants `allow-sandbox` to trusted
  # publishers only and reviewed the 0.50 and 0.51 revisions by hand, so the
  # snap no longer asks for it, and the check is that it does not and that
  # every process of the app runs under the snap's AppArmor profile in
  # enforce mode with a seccomp filter (--expect-snap-confinement). The same
  # on an x64 machine (linux-x64), since the launcher is in every Linux package.
  #
  # Not in a run that adds only the macOS packages (only=macos) or only the
  # arm64 snap (only=snap-arm64): neither builds the .deb, the AppImage or the
  # Windows installers checked here, and each row would fail for want of its
  # artifact.
  desktop-arm64-check:
    name: Desktop packages on a real ${{ matrix.label }} machine
    needs: [plan, desktop]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.only != 'macos' && needs.plan.outputs.only != 'snap-arm64' && needs.desktop.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, label: linux-arm64, artifact: desktop-arm64-linux-arm64 }
          - { os: ubuntu-24.04, label: linux-x64, artifact: desktop-x64-linux }
          - { os: windows-11-arm, label: windows, artifact: desktop-arm64-windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/workflows/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pkg
      - name: .deb, AppImage and snap on Linux, sandboxed or confined
        if: startsWith(matrix.label, 'linux')
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          case "$LABEL" in
            linux-arm64) ARCH=arm64; DEB=arm64; IMG=arm64; SNAP=arm64 ;;
            *) ARCH=amd64; DEB=amd64; IMG=x86_64; SNAP=amd64 ;;
          esac
          ls -la pkg
          mkdir -p shots
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          look() { xvfb-run -a -s "-screen 0 1280x800x24" node "$CI_SCRIPTS"/desktop-look.mjs "$@"; }
          # A refusal is checked with NO display: the launcher then only
          # writes to stderr, and no dialog waits for a click that never comes.
          refuses() { env -u DISPLAY -u WAYLAND_DISPLAY node "$CI_SCRIPTS"/desktop-look.mjs "$@" --expect-refusal; }

          # .deb: the setuid helper is installed, so the sandbox is on with
          # nothing set up. `filex-app` is the launcher, filex-app-bin the app.
          sudo apt-get install -y "./pkg/filex-desktop-$DEB.deb"
          head -1 /opt/filex/filex-app | grep -qx '#!/bin/sh'
          node "$CI_SCRIPTS"/arch-of.mjs /opt/filex/filex-app-bin /opt/filex/resources/bin/filex --expect "$ARCH"
          /opt/filex/resources/bin/filex --version
          look --exe /usr/bin/filex-app --out "shots/$LABEL-deb.png" --expect-sandbox

          # AppImage: Ubuntu 24.04 lets only programs with an AppArmor profile
          # create user namespaces, and an AppImage cannot carry the setuid
          # helper. Without the profile the launcher must refuse with its
          # message; with the one docs/DESKTOP.md gives ("AppImage on recent
          # Ubuntu") it must open sandboxed. Never with --no-sandbox.
          # The restriction is Ubuntu 24.04's default; set it in case a runner
          # image turned it off, so the refusal is always exercised.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          img="$HOME/Apps/filex-desktop-$IMG.AppImage"
          mkdir -p "$HOME/Apps"
          cp "pkg/filex-desktop-$IMG.AppImage" "$img"
          chmod +x "$img"
          # No FUSE on the runner: the AppImage runtime unpacks and runs.
          export APPIMAGE_EXTRACT_AND_RUN=1
          refuses --exe "$img" --port 9334 --timeout 90
          sudo tee /etc/apparmor.d/filex-appimage > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile filex-appimage @{HOME}/**/filex-desktop-*.AppImage flags=(unconfined) {
            userns,
            include if exists <local/filex-appimage>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/filex-appimage
          look --exe "$img" --out "shots/$LABEL-appimage.png" --port 9335 --expect-sandbox
          # The image's own menu entry, which AppImage integrators copy: the
          # sandbox stays on (up to 0.49 it said --no-sandbox).
          (cd "$RUNNER_TEMP" && "$img" --appimage-extract '*.desktop' > /dev/null)
          grep -qx 'Exec=AppRun --filex-desktop-entry %U' "$RUNNER_TEMP"/squashfs-root/*.desktop
          if grep -q -- '--no-sandbox' "$RUNNER_TEMP"/squashfs-root/*.desktop; then echo "the AppImage's menu entry turns the sandbox off" >&2; exit 1; fi
          look --exe "$img" --arg --filex-desktop-entry --out "shots/$LABEL-appimage-entry.png" --port 9336 --expect-sandbox
          unset APPIMAGE_EXTRACT_AND_RUN

          # snap: Chromium's sandbox is off in it on purpose (the launcher
          # starts it with --no-sandbox), and the wall is snapd's strict
          # confinement. A --dangerous install is confined like a Store one.
          # The snap must not ask for allow-sandbox (the Store reviews that by
          # hand), and every process of the app must run under its profile.
          if [ -f "pkg/filex-desktop-$SNAP.snap" ]; then
            sudo snap install --dangerous "pkg/filex-desktop-$SNAP.snap"
            snap list filex-app
            snap connections filex-app | grep browser
            if grep -q 'allow-sandbox' /snap/filex-app/current/meta/snap.yaml; then echo "the snap asks for allow-sandbox, which the Snap Store reviews by hand" >&2; exit 1; fi
            look --exe /snap/bin/filex-app --out "shots/$LABEL-snap.png" --port 9338 --timeout 150 --expect-snap-confinement
          else
            echo "::warning title=snap::no $SNAP snap was built"
          fi
      - name: NSIS installer and portable .exe on Windows arm64
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem pkg
          New-Item -ItemType Directory -Force shots | Out-Null
          $setup = (Resolve-Path pkg/filex-desktop-arm64.exe).Path
          $p = Start-Process $setup -ArgumentList '/S', '/currentuser' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }
          $home_ = Join-Path $env:LOCALAPPDATA 'Programs\filex'
          $app = Join-Path $home_ 'filex.exe'
          $cli = Join-Path $home_ 'resources\bin\filex.exe'
          node "$env:CI_SCRIPTS/arch-of.mjs" $app $cli --expect arm64
          if ($LASTEXITCODE -ne 0) { throw 'not arm64' }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw 'the bundled CLI does not run' }
          node "$env:CI_SCRIPTS/desktop-look.mjs" --exe $app --out shots/windows-arm64-nsis.png
          if ($LASTEXITCODE -ne 0) { throw 'the installed app did not open' }
          Get-Process filex -ErrorAction SilentlyContinue | Stop-Process -Force
          $un = Get-ChildItem $home_ -Filter 'Uninstall*.exe' | Select-Object -First 1
          $u = Start-Process $un.FullName -ArgumentList '/S', '/currentuser' -Wait -PassThru
          # The uninstaller hands over to a copy of itself in %TEMP% and returns.
          for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $app) { throw "uninstall (exit $($u.ExitCode)) left $app behind" }
          Write-Host 'installed, opened, uninstalled'
          $portable = (Resolve-Path pkg/filex-desktop-portable-arm64.exe).Path
          node "$env:CI_SCRIPTS/desktop-look.mjs" --exe $portable --out shots/windows-arm64-portable.png --port 9334 --timeout 150
          if ($LASTEXITCODE -ne 0) { throw 'the portable .exe did not open' }
          Get-Process filex -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-arm64-screenshots-${{ matrix.label }}
          path: shots
          if-no-files-found: warn
          retention-days: 30

  # ── AUR (filex-app-bin) ─────────────────────────────────────────────
  #
  # The PKGBUILD repackages the .deb just attached, so it runs after `desktop`
  # and hashes THAT file. packaging/aur/update-pkgbuild.sh sets pkgver and the
  # checksums and regenerates .SRCINFO; both are kept as a run artifact either
  # way. The push needs the SSH key registered with the AUR account — without
  # it the run says so (warning + summary) instead of pretending.
  aur:
    name: AUR package (filex-app-bin)
    needs: [plan, desktop]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PKGBUILD and .SRCINFO for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" -p filex-desktop-amd64.deb -D "$RUNNER_TEMP/rel"
          bash packaging/aur/update-pkgbuild.sh "${GITHUB_REF_NAME}" --deb "$RUNNER_TEMP/rel/filex-desktop-amd64.deb"
          cat packaging/aur/filex-app-bin/.SRCINFO
      - uses: actions/upload-artifact@v4
        with:
          name: aur-filex-app-bin
          path: |
            packaging/aur/filex-app-bin/PKGBUILD
            packaging/aur/filex-app-bin/.SRCINFO
          include-hidden-files: true
      - name: Push to the AUR
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            msg="AUR_SSH_PRIVATE_KEY is not set: filex-app-bin was NOT pushed to the AUR. PKGBUILD and .SRCINFO are in this run's artifacts."
            echo "::warning title=AUR: not pushed::$msg"
            echo "### AUR: not pushed (no SSH key)" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The committed PKGBUILD is a template (SKIP checksums) until the
          # step above has rewritten it for this tag; never push that.
          if grep -q "'SKIP'" packaging/aur/filex-app-bin/PKGBUILD; then
            echo "PKGBUILD still carries SKIP checksums — not pushing" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/filex-app-bin.git "$RUNNER_TEMP/aur"
          cp packaging/aur/filex-app-bin/PKGBUILD packaging/aur/filex-app-bin/.SRCINFO "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "AUR already at ${GITHUB_REF_NAME}"; exit 0; fi
          git -c user.name="BRF Teknoloji" -c user.email="security@brf.sh" commit -q -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master
          echo "### AUR: pushed ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
