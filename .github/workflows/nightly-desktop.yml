# The nightly builds (tasks #266, #361): what a green nightly commit makes.
# Every night the build host pushes ONE commit to the `nightly` branch - the
# tip of the private main, exported the way a release is, on top of main
# (scripts/chain/nightly.mjs) - and ci.yml runs its full matrix on it. When
# that run ends green, this workflow builds from that commit:
#   - the nightly image, ghcr.io/<owner>/filex:nightly and :nightly-YYYYMMDD
#     (docker/Dockerfile, amd64), whose version and labels say which commit
#     it is and that CI was green on it (scripts/chain/nightly-meta.mjs);
#   - every desktop package - Windows (x64, arm64), macOS, Linux (x64,
#     arm64) - and both snaps (amd64, arm64) for the Snap Store's edge channel.
#
# ⚠ Not a release. Nothing is signed; nothing goes to a GitHub Release, to a
# store's stable channel or to a package manager. The packages go to ghcr as
# ONE OCI artifact - filex-desktop-nightly:nightly-YYYYMMDD and :nightly, the
# last NIGHTLY_KEEP nights - the snaps to edge alone, and the build host
# puts the newest night on filex.sh/nightly in the morning
# (scripts/chain/nightly-site.sh).
#
# It runs when a CI run on the branch has ended (workflow_run: GitHub runs this
# file as main has it, with that run's commit), and by hand. Only a green run
# of a push in this repository builds anything; a commit that is no longer the
# branch's tip (a newer night was pushed) builds nothing; and a commit that
# failed here is not tried again on a re-run of CI (the `attempted` tag) -
# `force` builds the branch's commit again by hand.
name: Nightly builds

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [nightly]
  workflow_dispatch:
    inputs:
      force:
        description: "Build the nightly branch's commit again, even when it was built or tried"
        type: boolean
        default: false

concurrency:
  group: nightly-desktop
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

env:
  NIGHTLY_KEEP: "7"
  ORAS_VERSION: "1.2.2"
  BRANCH: nightly

jobs:
  source:
    name: A new nightly commit?
    # A green CI run of a PUSH in this repository: a pull request's run names
    # whatever head branch its fork likes, `nightly` included.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.s.outputs.build }}
      version: ${{ steps.s.outputs.desktop_version }}
      image_version: ${{ steps.s.outputs.version }}
      revision: ${{ steps.s.outputs.revision }}
      base: ${{ steps.s.outputs.base }}
      date: ${{ steps.s.outputs.date }}
      ymd: ${{ steps.s.outputs.ymd }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          ref: ${{ github.event.workflow_run.head_sha || env.BRANCH }}
          fetch-depth: 2
          persist-credentials: false
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: ${{ env.ORAS_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: The commit and the last packages
        id: s
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          out="ghcr.io/$owner/filex-desktop-nightly"
          rev=$(git -C src rev-parse HEAD)
          tip=$(git -C src ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$rev" != "$tip" ]; then
            echo "$rev is not the tip of $BRANCH (${tip:-no branch}): a newer nightly was pushed, and its own CI run builds it"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ann() { oras manifest fetch "$1" 2>/dev/null | jq -r --arg k "$2" '.annotations[$k] // empty' || true; }
          built=$(ann "$out:nightly" org.opencontainers.image.revision)
          tried=$(ann "$out:attempted" org.opencontainers.image.revision)
          echo "commit $rev; packages of ${built:-nothing yet}; last attempt ${tried:-none}"
          if [ "$FORCE" != true ] && { [ "$rev" = "$built" ] || [ "$rev" = "$tried" ]; }; then
            echo "nothing new: $rev was built or tried (to build it again: run this workflow by hand with force)"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : > jobs.jsonl
          if [ -n "$CI_RUN" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?filter=latest&per_page=100" --jq '.jobs[] | {name, conclusion}' > jobs.jsonl
          fi
          meta=(--tree src --labels labels.txt)
          if [ -s jobs.jsonl ]; then meta+=(--jobs jobs.jsonl --run "$CI_URL"); fi
          node src/scripts/chain/nightly-meta.mjs "${meta[@]}" > meta.txt
          cat meta.txt labels.txt
          base=$(git -C src rev-parse --verify -q HEAD^ || true)
          tar --exclude=./.git -C src -czf filex-nightly-src.tar.gz .
          # The attempt, before anything is built.
          echo '{}' > attempt.json
          oras push "$out:attempted" --annotation "org.opencontainers.image.revision=$rev" attempt.json:application/json
          {
            echo "build=true"
            echo "base=$base"
            cat meta.txt
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.s.outputs.build == 'true'
        with:
          name: nightly-src
          path: |
            filex-nightly-src.tar.gz
            labels.txt
          retention-days: 3

  image:
    name: The nightly image
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.source.outputs.image_version }}
      REVISION: ${{ needs.source.outputs.revision }}
      BASE: ${{ needs.source.outputs.base }}
      YMD: ${{ needs.source.outputs.ymd }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-src
      - name: The source
        shell: bash
        run: mkdir src && tar -xzf filex-nightly-src.tar.gz -C src
      # The recipe a release builds its full image with, from the nightly
      # commit's tree, for amd64: what the build host built until #361.
      - name: Build the image
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%FT%TZ)
          labels=(
            --label "org.opencontainers.image.title=filex nightly"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.revision=$REVISION"
            --label "org.opencontainers.image.created=$now"
            --label "sh.filex.nightly.public-base=$BASE"
          )
          while IFS= read -r line; do
            [ -n "$line" ] && labels+=(--label "$line")
          done < labels.txt
          docker build --pull -f src/docker/Dockerfile \
            --build-arg "VERSION=$VERSION" --build-arg "COMMIT=${REVISION:0:8}" --build-arg "DATE=$now" \
            "${labels[@]}" -t filex-nightly:local src
          reported=$(docker run --rm --entrypoint /usr/local/bin/filex filex-nightly:local --version 2>&1 || true)
          echo "$reported"
          case "$reported" in
            *"$VERSION"*) ;;
            *) echo "::error::the image's filex --version does not report $VERSION"; exit 1 ;;
          esac
      - name: To ghcr.io, as nightly-<date> and nightly
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/filex"
          for tag in "nightly-$YMD" nightly; do
            docker tag filex-nightly:local "$repo:$tag"
            docker push "$repo:$tag"
          done
          echo "### $repo:nightly-$YMD (and :nightly), $VERSION" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop packages (${{ matrix.label }})
    needs: source
    if: needs.source.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x64, targets: "linux-x64,snap", snap: amd64, snap_target: snap, cpu: x64, unpacked: linux-unpacked }
          - { os: ubuntu-24.04-arm, label: linux-arm64, targets: "linux-arm64,snap-arm64", snap: arm64, snap_target: snap-arm64, cpu: arm64, unpacked: linux-arm64-unpacked }
          - { os: windows-latest, label: windows, targets: "windows" }
          - { os: macos-15, label: macos, targets: "mac" }
    runs-on: ${{ matrix.os }}
    # The release environment: only main and v* tags may deploy to it, and
    # the publishing secrets this job reads belong there. A workflow_run runs
    # on main.
    environment: release
    env:
      ND_VERSION: ${{ needs.source.outputs.version }}
      ND_TARGETS: ${{ matrix.targets }}
      LABEL: ${{ matrix.label }}
      SNAP: ${{ matrix.snap }}
      SNAP_TARGET: ${{ matrix.snap_target }}
      CPU: ${{ matrix.cpu }}
      UNPACKED: ${{ matrix.unpacked }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-src
      - name: The source
        shell: bash
        run: mkdir src && tar -xzf filex-nightly-src.tar.gz -C src
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "9.12.0"
      # ⚠ 22: electron-builder 26 loads @electron/rebuild 4 (ESM only, Node 22.12+).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - name: rpmbuild for the .rpm
        if: startsWith(matrix.label, 'linux')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      # electron-builder's own fpm is an x86-64 bundle: on arm64 it cannot start.
      - name: fpm for the arm64 .deb and .rpm
        if: matrix.label == 'linux-arm64'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      # A target that fails is a row of the night's manifest, not the end of
      # this job: the others are kept, and the snap is packed when its app was.
      - name: The packages
        continue-on-error: true
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: ND_JOB_SRC="$PWD/src" ND_JOB_OUT="$PWD/out" bash src/scripts/chain/nightly-desktop-job.sh
      # Both snaps here (the amd64 one on the build host until #361): core24,
      # packed by snapcraft in LXD from the app the step above left unpacked.
      - name: snapcraft + LXD for the snap
        if: matrix.snap != ''
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic --channel=8.x/stable
          sudo snap install lxd 2>/dev/null || sudo snap refresh lxd
          sudo lxd waitready
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          sudo chmod 666 /var/snap/lxd/common/lxd/unix.socket
          sudo iptables -P FORWARD ACCEPT
          snapcraft --version
          echo "SNAPCRAFT_BUILD_ENVIRONMENT=lxd" >> "$GITHUB_ENV"
      - name: The snap
        id: snap
        if: matrix.snap != ''
        shell: bash
        run: |
          set -euo pipefail
          grep -qx "$SNAP_TARGET built" out/targets.txt || { echo "::error::the $SNAP app was not built, so there is no snap"; exit 1; }
          (cd src/desktop && pnpm exec electron-builder --linux snap "--$CPU" --publish never --prepackaged "release/$UNPACKED")
          cp "src/desktop/release/filex-desktop-$SNAP.snap" out/
      - name: The snap to edge
        if: matrix.snap != '' && steps.snap.outcome == 'success'
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: node src/scripts/chain/nightly-snap-edge.mjs "out/filex-desktop-$SNAP.snap" "out/snap-$SNAP.json"
      - name: Keep the packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-desktop-${{ matrix.label }}
          path: |
            out/files/
            out/targets.txt
            out/snap-*.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: The night's packages to ghcr
    needs: [source, desktop]
    if: ${{ !cancelled() && needs.source.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.source.outputs.version }}
      REVISION: ${{ needs.source.outputs.revision }}
      DATE: ${{ needs.source.outputs.date }}
      ROWS: ${{ needs.desktop.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-src
      - name: The source (the manifest script is in it)
        shell: bash
        run: mkdir src && tar -xzf filex-nightly-src.tar.gz -C src
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-desktop-*
          path: out
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: The night's manifest
        shell: bash
        run: |
          set -euo pipefail
          node src/scripts/chain/nightly-desktop-manifest.mjs --dir out --version "$VERSION" --revision "$REVISION" \
            --date "$DATE" --expect linux-x64,snap,linux-arm64,snap-arm64,windows,mac \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat out/nightly.json
      - name: To ghcr.io, as nightly-<date> and nightly
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/filex-desktop-nightly"
          day="${DATE//-/}"
          cd out
          files=(nightly.json:application/json SHA256SUMS:text/plain)
          for f in filex-desktop-*; do files+=("$f"); done
          oras push "$repo:nightly-$day" \
            --annotation "org.opencontainers.image.revision=$REVISION" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "sh.filex.nightly.date=$DATE" \
            "${files[@]}"
          oras tag "$repo:nightly-$day" nightly
          echo "### $repo:nightly-$day (and :nightly), ${#files[@]} files" >> "$GITHUB_STEP_SUMMARY"
      # The newest NIGHTLY_KEEP nights stay; older ones and the attempts
      # before the last go. A token that may not delete them leaves a warning,
      # never a red night.
      - name: The nights before the last ones
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          api="/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/filex-desktop-nightly/versions"
          gh api "$api?per_page=1" >/dev/null 2>&1 || api="/users/$GITHUB_REPOSITORY_OWNER/packages/container/filex-desktop-nightly/versions"
          gh api --paginate "$api?per_page=100" --jq '.[] | [.id, .created_at, ((.metadata.container.tags // []) | join(","))] | @tsv' |
            sort -t "$(printf '\t')" -k2,2r |
            awk -F '\t' -v keep="$NIGHTLY_KEEP" '{ if ($3 ~ /(^|,)(nightly|attempted)(,|$)/) next; if ($3 ~ /nightly-[0-9]{8}/) { n++; if (n <= keep) next } print $1 }' > old.txt
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "$api/$id" || echo "::warning::could not delete version $id"
          done < old.txt
          echo "removed $(wc -l < old.txt) old version(s)"
      - name: Red when a row failed
        shell: bash
        run: |
          set -euo pipefail
          failed=$(jq -r '.rows | to_entries[] | select(.value != "built") | .key' out/nightly.json | paste -sd, -)
          if [ -n "$failed" ] || [ "$ROWS" != success ]; then
            echo "::error::not built this night: ${failed:-none} (the desktop job: $ROWS) - the night's manifest and filex.sh/nightly say which"
            exit 1
          fi
