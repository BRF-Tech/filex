name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # ⚠⚠ Called by release.yml as a gate, so a tag cannot publish over a red
  # suite. It could before: the release workflow triggers on the tag and CI on
  # the branch push two seconds earlier, in parallel, with no relationship
  # between them -- and nothing in the repository required a check. Measured
  # 2026-09-06: CI had been red since v0.31.0 and FOUR tags shipped over it,
  # the last of them a locale regression that showed a Turkish user an English
  # admin panel. The suite is the same one either way; only the trigger differs.
  workflow_call:
    inputs:
      skip_docker:
        description: >-
          Skip the image build. The release workflow builds and PUSHES the same
          image in its own job, so repeating it here would only make the gate
          slower -- and a gate people resent is a gate someone eventually
          removes.
        type: boolean
        default: false

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      # backend/embed/{admin,web} are git-ignored — the real bytes come from
      # the frontend build. `//go:embed all:admin all:web` fails to resolve on
      # empty dirs, so drop a placeholder for vet/test/build.
      - name: Embed placeholders
        run: |
          mkdir -p backend/embed/admin backend/embed/web
          touch backend/embed/admin/.placeholder backend/embed/web/.placeholder
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Build
        working-directory: backend
        run: go build ./...

  engines:
    # The databases the docs say you can install on. `backend` above runs on
    # SQLite alone, which is how a column name PostgreSQL and MySQL both refuse
    # shipped in a migration, and how a whole migration existed in two dialects
    # out of three (issue #19). These suites skip themselves without the two
    # DSNs, so they measure nothing unless the services below are really up.
    name: Databases (PostgreSQL + MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: filex
          POSTGRES_PASSWORD: filex
          POSTGRES_DB: filex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filex"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: filex
          MYSQL_DATABASE: filex
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -pfilex"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: Embed placeholders
        run: |
          mkdir -p backend/embed/admin backend/embed/web
          touch backend/embed/admin/.placeholder backend/embed/web/.placeholder
      - name: Migrations, schema parity and the write paths, on every engine
        working-directory: backend
        env:
          FILEX_TEST_PG_DSN: postgres://filex:filex@127.0.0.1:5432/filex?sslmode=disable
          FILEX_TEST_MYSQL_DSN: root:filex@tcp(127.0.0.1:3306)/mysql
        run: go test ./internal/db/ ./internal/queue/ ./internal/ops/

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages + admin UI
        env:
          # vue-tsc needs headroom on the full component bundle.
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          pnpm -r --filter='./packages/*' build
          pnpm --filter='./web' build
      - name: Unit tests
        run: pnpm --filter='./web' --filter='./packages/*' test

  browser:
    name: Browser E2E (Cypress)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      # The Cypress binary is a ~250 MB download that is NOT in node_modules —
      # it lands in ~/.cache/Cypress, keyed by version. Cache it on that key,
      # not on the lockfile hash: a lockfile change that leaves cypress alone
      # would otherwise re-download it.
      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('web/package.json') }}

      - run: pnpm install --frozen-lockfile
      # Explicit, because a cached store can restore node_modules without ever
      # running the package's postinstall — and then `cypress run` fails with
      # "No version of Cypress is installed", which reads like a broken suite.
      - name: Ensure the Cypress binary is present
        run: pnpm --filter='./web' exec cypress install

      # One command: builds packages + admin UI + embed assets + the Go binary,
      # starts it on a free port against a throwaway data dir with a
      # deterministic admin, seeds one local storage, runs every spec, tears it
      # all down. No secrets, no network, and nothing pointed at a live host —
      # `cypress run` here answers "is THIS build good?".
      - name: Run the Cypress suite against a throwaway instance
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: node e2e/run.mjs cypress --build

      # Uploaded on failure only: a red assertion in a browser is far cheaper
      # to read as a screenshot and twenty seconds of video than as a stack
      # trace. `video` is on when CI=true (web/cypress.config.ts).
      #
      # ⚠ The server's own log is in there too, and it is the half that says
      # WHY. On 2026-09-12 a run went red with 61 failures, all of them
      # downstream of the admin login suddenly answering `401 invalid
      # credentials` — a single answer the local driver deliberately gives for
      # four different causes, each of which it names in ITS log. That log
      # lived in a mkdtemp the runner deleted on the way out, so the run
      # destroyed its own evidence and the same tree passed on the next
      # trigger. `e2e/run.mjs` now keeps a copy.
      - name: Upload failure screenshots + video
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failures
          path: |
            web/cypress/screenshots
            web/cypress/videos
            e2e/.artifacts/server.log
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ !inputs.skip_docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build the full image end-to-end (frontend + backend + embed) to catch
      # multi-stage regressions. No push — release publishing is separate.
      - name: Build image
        run: docker build -f docker/Dockerfile -t filex:ci .
