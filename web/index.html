<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/admin/favicon.svg" />
    <!-- The Home Screen icon on iPhone and iPad (task #190). iOS reads this
         link before the manifest's icons and has no SVG for it, so without a
         PNG here "Add to Home Screen" could get a screenshot of the page
         instead of the mark. The 192 px PNG the manifest and the
         notifications already use: full-bleed, opaque, iOS rounds it. -->
    <link rel="apple-touch-icon" href="/admin/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser chrome and the installed app's title bar: the product
         blue, same value as favicon.svg / icons/icon.svg / LogoMark.vue and
         the manifest theme_color in pwa.config.ts. -->
    <meta name="theme-color" content="#2f6ceb" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- Neutral by default: this same document is served to every user of the
         instance — the login form and the explorer, not only the panel
         (GitHub #14). src/lib/documentTitle.ts adds "Admin" on panel routes
         and swaps in the operator's branding name when one is set. -->
    <title>filex</title>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
