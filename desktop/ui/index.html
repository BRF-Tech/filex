<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>filex</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 28px 30px;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0b0b0f; color: #e7e7ea;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.sub { margin: 0 0 22px; color: #9a9aa4; font-size: 13px; }
      label { display: block; font-size: 12px; color: #b8b8c0; margin: 14px 0 6px; }
      input[type=text] {
        width: 100%; padding: 10px 12px; border-radius: 8px;
        border: 1px solid #2a2a33; background: #14141a; color: #e7e7ea; font-size: 14px;
      }
      input[type=text]:focus { outline: 2px solid #6366f1; outline-offset: 1px; border-color: transparent; }
      button {
        border: 0; border-radius: 8px; padding: 10px 14px; font-size: 14px;
        background: #6366f1; color: #fff; cursor: pointer;
      }
      button.ghost { background: #1c1c24; color: #d7d7de; border: 1px solid #2a2a33; }
      button.danger { background: #2a1416; color: #fca5a5; border: 1px solid #4a1f24; }
      button:hover { filter: brightness(1.1); }
      .row { display: flex; align-items: center; gap: 10px; }
      .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .card { border: 1px solid #23232c; background: #121218; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
      .muted { color: #8b8b95; font-size: 12px; }
      .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #1c1c24; color: #b8b8c0; border: 1px solid #2a2a33; }
      .pill.on { background: #10231a; color: #86efac; border-color: #1f4030; }
      .empty { color: #8b8b95; font-size: 13px; padding: 18px 0; }
      .err { color: #fca5a5; font-size: 13px; margin-top: 12px; min-height: 18px; }
      nav { display: flex; gap: 6px; margin-bottom: 20px; }
      nav button { background: #14141a; color: #b8b8c0; border: 1px solid #23232c; }
      nav button.active { background: #6366f1; color: #fff; border-color: transparent; }
      code { background: #14141a; padding: 1px 5px; border-radius: 4px; font-size: 12px; color: #c7c7d1; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
      const root = document.getElementById('root');
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
      let state = null;
      let waiting = null; // { authUrl, serverUrl } once a sign-in is in flight


      // ⚠ No navigation here any more. Settings and Sync folders live in the
      // app window itself (ui/app.html); this surface exists only to get an
      // account signed in, and a second place to manage them would be a second
      // place to disagree.

      // ── Connect: the ONLY thing asked for is where the server is. Credentials
      //    are typed into the server's own login page, in the real browser.
      function connectView() {
        if (waiting) return waitingView();
        return `
          <h1>Connect to filex</h1>
          <p class="sub">Enter your server address. Sign-in opens in your browser, so single sign-on, passkeys and MFA all work exactly as they do on the web.</p>
          <label for="server">Server address</label>
          <input id="server" type="text" placeholder="https://app.filex.com" autofocus />
          <div class="row" style="margin-top:16px">
            <button id="go">Continue in browser</button>
          </div>
          <div class="err" id="err"></div>
          <p class="muted" style="margin-top:18px">After signing in, your browser hands the app back a one-time code. Your password is never typed into this window.</p>`;
      }

      // Everything on this screen exists because the happy path can fail in
      // ordinary ways: no browser installed, a portable browser the OS has no
      // handler for, a locked-down machine, or finishing sign-in on a phone.
      // The link is copyable and the code can be typed in by hand.
      function waitingView() {
        return `
          <h1>Waiting for your browser</h1>
          <p class="sub">Finish signing in to <strong>${esc(waiting.serverUrl)}</strong>. This window continues by itself once your browser hands the code back.</p>

          <label>Didn't a browser open? Open this address yourself</label>
          <div class="row">
            <input id="authurl" type="text" readonly value="${esc(waiting.authUrl)}" />
            <button class="ghost" id="copyurl" style="white-space:nowrap">Copy</button>
          </div>

          <label style="margin-top:22px">Browser couldn't return to the app? Paste the code it showed you</label>
          <div class="row">
            <input id="code" type="text" placeholder="Paste the code here" />
            <button id="usecode" style="white-space:nowrap">Sign in</button>
          </div>

          <div class="err" id="err"></div>
          <div class="row" style="margin-top:18px">
            <button class="ghost" id="cancel">Cancel</button>
          </div>`;
      }

      async function render() {
        state = await window.filexShell.getState();
        root.innerHTML = '';
        root.appendChild($(`<div>${connectView()}</div>`));
        wire();
      }

      function wire() {
        root.querySelectorAll('[data-go]').forEach((b) =>
          b.addEventListener('click', () => { location.hash = '#' + b.dataset.go; }));

        const go = root.querySelector('#go');
        if (go) {
          const submit = async () => {
            const err = root.querySelector('#err');
            err.textContent = '';
            try {
              const r = await window.filexShell.beginAuth(root.querySelector('#server').value);
              waiting = { serverUrl: r.serverUrl, authUrl: r.authUrl || r.serverUrl + '/admin/login' };
              render();
            } catch (e) {
              err.textContent = String(e && e.message ? e.message : e);
            }
          };
          go.addEventListener('click', submit);
          root.querySelector('#server').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        }

        const copyurl = root.querySelector('#copyurl');
        if (copyurl) copyurl.addEventListener('click', async () => {
          const f = root.querySelector('#authurl');
          f.select();
          try { await navigator.clipboard.writeText(f.value); copyurl.textContent = 'Copied'; }
          catch { document.execCommand('copy'); copyurl.textContent = 'Copied'; }
          setTimeout(() => { copyurl.textContent = 'Copy'; }, 1500);
        });

        const usecode = root.querySelector('#usecode');
        if (usecode) {
          const submitCode = async () => {
            const err = root.querySelector('#err');
            err.textContent = '';
            usecode.disabled = true;
            try {
              await window.filexShell.completeManual(root.querySelector('#code').value);
              // On success the main process closes this window.
            } catch (e) {
              err.textContent = String(e && e.message ? e.message : e);
            } finally {
              usecode.disabled = false;
            }
          };
          usecode.addEventListener('click', submitCode);
          root.querySelector('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCode(); });
        }

        const cancel = root.querySelector('#cancel');
        if (cancel) cancel.addEventListener('click', () => { waiting = null; render(); });

      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
