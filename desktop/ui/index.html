<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline' app://filex; script-src 'unsafe-inline'"
    />
    <title>filex</title>
    <!-- gorunum:v2-desktop — the product's own tokens, on the product's FIRST
         screen.

         ⚠⚠ This window used to be a forced dark page (#0b0b0f) with an indigo
         accent (the old logo indigo) — a palette that exists nowhere else in
         filex; the product's primary is --fe-primary (#2f6ceb). It is
         also the first surface anybody sees, so "the app I signed in to looks
         like a different application from the one that opened" was the first
         impression the product made.

         It comes from `app://filex` rather than from a copy in this file: the
         shell page is served from a different host of the same scheme
         (app://shell → desktop/ui, app://filex → desktop/app), and a second
         hand-written palette is exactly the thing that drifted. Hence the
         `app://filex` source in the CSP above — `'self'` is app://shell and
         would not reach it.

         ⚠ If the stylesheet ever fails to load, every var() resolves to
         nothing and the page is unreadable rather than merely unstyled. The
         guard below detects that and falls back to the platform's own colours,
         which is ugly and legible instead of pretty and invisible. -->
    <link rel="stylesheet" href="app://filex/style.css" />
    <script>
      // The OS decides, and it is allowed to change while this window is open.
      //
      // ⚠ NOT the product's theme preference. This page is served from
      // `app://shell`, a different origin from the app window, so it cannot
      // read `filex.thememode` — and it should not: there is no account yet,
      // so there is nobody whose preference it could be. The app window adopts
      // the preference the moment there is one.
      (function () {
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        function apply() {
          var dark = !!(mq && mq.matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        }
        apply();
        if (mq && mq.addEventListener) mq.addEventListener('change', apply);
      })();
    </script>
    <style>
      /* gorunum:v2-desktop — the connect window, in the product's vocabulary:
         --fe-* for every colour, 34px controls, the 12/12.5/13px scale. There
         is no palette in this file. */

      /* ⚠ The fallback the comment above promises. `@supports not (color: var(--fe-bg))`
         does not answer "did the sheet load" — the syntax is valid either way —
         so the guard is on the one thing that differs: with no stylesheet the
         page has no --fe-bg at all, and `var(--fe-bg, Canvas)` resolves to the
         platform's own window colour. Every rule below uses the two-argument
         form for exactly that reason, and the second argument is a CSS SYSTEM
         COLOUR, not a hex — it follows the OS light/dark setting by itself. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 28px 30px;
        font: var(--fe-text-md, 13px) / 1.5 var(--fe-font, system-ui), sans-serif;
        background: var(--fe-bg, Canvas);
        color: var(--fe-text, CanvasText);
      }
      /* The app's own mark above the title: this is filex asking, and until an
         account exists it is the only thing on screen that says so. Its fill is
         the palette's own --fe-primary — see MARK below. */
      .mark { width: 36px; height: 36px; display: block; margin-bottom: 14px; }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
      p.sub { margin: 0 0 22px; color: var(--fe-text-muted, GrayText); font-size: var(--fe-text-sm, 12.5px); }
      label {
        display: block;
        font-size: var(--fe-text-sm, 12.5px);
        font-weight: 500;
        color: var(--fe-text, CanvasText);
        margin: 14px 0 6px;
      }
      input[type=text] {
        width: 100%;
        height: var(--fe-h-md, 34px);
        padding: 0 10px;
        border-radius: var(--fe-radius, 8px);
        border: 1px solid var(--fe-border, GrayText);
        background: var(--fe-bg, Canvas);
        color: var(--fe-text, CanvasText);
        font: inherit;
        font-size: var(--fe-text-sm, 12.5px);
      }
      input[type=text]:focus { outline: none; border-color: var(--fe-primary, Highlight); }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: var(--fe-h-md, 34px);
        padding: 0 var(--fe-gap, 12px);
        border: 1px solid var(--fe-primary, Highlight);
        border-radius: var(--fe-radius, 8px);
        font: inherit;
        font-size: var(--fe-text-sm, 12.5px);
        font-weight: 500;
        background: var(--fe-primary, Highlight);
        color: var(--fe-text-on-primary, HighlightText);
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover:not(:disabled) { background: var(--fe-primary-hover, Highlight); border-color: var(--fe-primary-hover, Highlight); }
      button:disabled { opacity: .55; cursor: not-allowed; }
      button.ghost {
        background: var(--fe-bg, Canvas);
        color: var(--fe-text, CanvasText);
        border-color: var(--fe-border-strong, GrayText);
      }
      button.ghost:hover:not(:disabled) { background: var(--fe-bg-hover, Canvas); border-color: var(--fe-border-strong, GrayText); }
      .row { display: flex; align-items: center; gap: var(--fe-gap-sm, 8px); }
      .muted { color: var(--fe-text-muted, GrayText); font-size: var(--fe-text-xs, 12px); }
      .err { color: var(--fe-danger, LinkText); font-size: var(--fe-text-sm, 12.5px); margin-top: 12px; min-height: 18px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
      const root = document.getElementById('root');
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

      // Same rule as the app window: follow the OS language, fall back to
      // English. A sign-in screen in a language the user does not read is the
      // worst possible place to start.
      const LANG = (navigator.language || 'en').toLowerCase().startsWith('tr') ? 'tr' : 'en';
      const STRINGS = {
        'connect.title':   ['Connect to filex', "filex'e bağlan"],
        'connect.sub':     ['Enter your server address. Sign-in opens in your browser, so single sign-on, passkeys and MFA all work exactly as they do on the web.',
                            'Sunucu adresini yaz. Giriş tarayıcında açılır; tek oturum açma, passkey ve çok adımlı doğrulama web’deki gibi çalışır.'],
        'connect.label':   ['Server address', 'Sunucu adresi'],
        'connect.go':      ['Continue in browser', 'Tarayıcıda devam et'],
        'connect.note':    ['After signing in, your browser hands the app back a one-time code. Your password is never typed into this window.',
                            'Giriş yaptıktan sonra tarayıcın uygulamaya tek kullanımlık bir kod verir. Parolan bu pencereye hiç yazılmaz.'],
        'wait.title':      ['Waiting for your browser', 'Tarayıcın bekleniyor'],
        'wait.sub':        ['Finish signing in to {server}. This window continues by itself once your browser hands the code back.',
                            '{server} adresinde girişi tamamla. Tarayıcı kodu geri verdiğinde bu pencere kendiliğinden devam eder.'],
        'wait.url_label':  ["Didn't a browser open? Open this address yourself",
                            'Tarayıcı açılmadı mı? Bu adresi kendin aç'],
        'wait.copy':       ['Copy', 'Kopyala'],
        'wait.copied':     ['Copied', 'Kopyalandı'],
        'wait.code_label': ["Browser couldn't return to the app? Paste the code it showed you",
                            'Tarayıcı uygulamaya dönemedi mi? Sana gösterdiği kodu yapıştır'],
        'wait.code_ph':    ['Paste the code here', 'Kodu buraya yapıştır'],
        'wait.signin':     ['Sign in', 'Giriş yap'],
        'wait.cancel':     ['Cancel', 'Vazgeç'],
      };
      function T(key, vars) {
        const entry = STRINGS[key];
        let s = entry ? (LANG === 'tr' ? entry[1] : entry[0]) : key;
        if (vars) for (const [k, v] of Object.entries(vars)) s = s.split(`{${k}}`).join(v);
        return s;
      }
      let state = null;
      let waiting = null; // { authUrl, serverUrl } once a sign-in is in flight
      // Reconnect (from the app window) starts the sign-in in the MAIN process
      // for a server it already knows, and opens this window on #/reconnect.
      // The attempt is adopted once — after Cancel the connect form stays.
      let adopted = null;


      // ⚠ No navigation here any more. Settings and Sync folders live in the
      // app window itself (ui/app.html); this surface exists only to get an
      // account signed in, and a second place to manage them would be a second
      // place to disagree.

      // ── Connect: the ONLY thing asked for is where the server is. Credentials
      //    are typed into the server's own login page, in the real browser.
      function connectView() {
        if (waiting) return waitingView();
        return `
          <h1>${esc(T('connect.title'))}</h1>
          <p class="sub">${esc(T('connect.sub'))}</p>
          <label for="server">${esc(T('connect.label'))}</label>
          <input id="server" type="text" placeholder="https://app.filex.com" autofocus />
          <div class="row" style="margin-top:16px">
            <button id="go">${esc(T('connect.go'))}</button>
          </div>
          <div class="err" id="err"></div>
          <p class="muted" style="margin-top:18px">${esc(T('connect.note'))}</p>`;
      }

      // Everything on this screen exists because the happy path can fail in
      // ordinary ways: no browser installed, a portable browser the OS has no
      // handler for, a locked-down machine, or finishing sign-in on a phone.
      // The link is copyable and the code can be typed in by hand.
      function waitingView() {
        return `
          <h1>${esc(T('wait.title'))}</h1>
          <p class="sub">${esc(T('wait.sub', { server: waiting.serverUrl }))}</p>

          <label>${esc(T('wait.url_label'))}</label>
          <div class="row">
            <input id="authurl" type="text" readonly value="${esc(waiting.authUrl)}" />
            <button class="ghost" id="copyurl" style="white-space:nowrap">${esc(T('wait.copy'))}</button>
          </div>

          <label style="margin-top:22px">${esc(T('wait.code_label'))}</label>
          <div class="row">
            <input id="code" type="text" placeholder="${esc(T('wait.code_ph'))}" />
            <button id="usecode" style="white-space:nowrap">${esc(T('wait.signin'))}</button>
          </div>

          <div class="err" id="err"></div>
          <div class="row" style="margin-top:18px">
            <button class="ghost" id="cancel">${esc(T('wait.cancel'))}</button>
          </div>`;
      }

      // The product's logo (web/src/components/LogoMark.vue), verbatim —
      // including its fill. gorunum:v1 made the mark flat product blue rather
      // than the old indigo→violet gradient, and it is painted with the
      // palette's own `--fe-primary`: #2f6ceb light, #5b8cff dark.
      //
      // ⚠ The literal after the comma is a floor, not the value in use. `fill`
      // has no inherited value to fall back to, so if the stylesheet this page
      // pulls from app://filex ever failed to load the mark would paint BLACK
      // rather than blue. Measured 2026-09-12: the sheet loads (1410 rules) and
      // the computed fill is rgb(47, 108, 235).
      const MARK =
        '<svg class="mark" viewBox="0 0 32 32" aria-hidden="true">' +
        '<rect width="32" height="32" rx="7" fill="var(--fe-primary, #2f6ceb)"/>' +
        '<path d="M7 11a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V11z" ' +
        'fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>' +
        '<path d="M11.5 17.5l3 2.5 5.5-6" fill="none" stroke="#fff" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>';

      async function render() {
        state = await window.filexShell.getState();
        const pending = state && state.pendingAuth;
        if (!waiting && pending && location.hash.startsWith('#/reconnect') && adopted !== pending.authUrl) {
          adopted = pending.authUrl;
          waiting = { serverUrl: pending.serverUrl, authUrl: pending.authUrl };
        }
        root.innerHTML = '';
        root.appendChild($(`<div>${MARK}${connectView()}</div>`));
        wire();
      }

      function wire() {
        root.querySelectorAll('[data-go]').forEach((b) =>
          b.addEventListener('click', () => { location.hash = '#' + b.dataset.go; }));

        const go = root.querySelector('#go');
        if (go) {
          const submit = async () => {
            const err = root.querySelector('#err');
            err.textContent = '';
            try {
              const r = await window.filexShell.beginAuth(root.querySelector('#server').value);
              waiting = { serverUrl: r.serverUrl, authUrl: r.authUrl || r.serverUrl + '/admin/login' };
              render();
            } catch (e) {
              err.textContent = String(e && e.message ? e.message : e);
            }
          };
          go.addEventListener('click', submit);
          root.querySelector('#server').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        }

        const copyurl = root.querySelector('#copyurl');
        if (copyurl) copyurl.addEventListener('click', async () => {
          const f = root.querySelector('#authurl');
          f.select();
          try { await navigator.clipboard.writeText(f.value); copyurl.textContent = T('wait.copied'); }
          catch { document.execCommand('copy'); copyurl.textContent = T('wait.copied'); }
          setTimeout(() => { copyurl.textContent = T('wait.copy'); }, 1500);
        });

        const usecode = root.querySelector('#usecode');
        if (usecode) {
          const submitCode = async () => {
            const err = root.querySelector('#err');
            err.textContent = '';
            usecode.disabled = true;
            try {
              await window.filexShell.completeManual(root.querySelector('#code').value);
              // On success the main process closes this window.
            } catch (e) {
              err.textContent = String(e && e.message ? e.message : e);
            } finally {
              usecode.disabled = false;
            }
          };
          usecode.addEventListener('click', submitCode);
          root.querySelector('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCode(); });
        }

        const cancel = root.querySelector('#cancel');
        if (cancel) cancel.addEventListener('click', () => { waiting = null; render(); });

      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
