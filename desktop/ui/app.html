<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>filex</title>
    <!--
      The desktop app's own chrome. Deliberately small and deliberately vanilla:
      the only heavy thing in this window is <filex-explorer>, which is the same
      component this project ships to embedders. Nothing here re-implements file
      handling — it mounts the explorer and gets out of the way.

      Layout:
        • a narrow rail down the left with the signed-in accounts (click to
          switch), an "add account" button and a gear for the app's settings
        • everything else is the explorer for the active account
    -->
    <style>
      :root {
        color-scheme: light dark;
        --rail: 64px;
        --bg: #ffffff;
        --bg-2: #f6f7f9;
        --line: #e3e6ea;
        --fg: #14181d;
        --muted: #6b7482;
        --accent: #2f6df6;
        --danger: #c0392b;
        --scroll-thumb: rgba(20, 24, 29, .26);
        --scroll-thumb-hover: rgba(20, 24, 29, .42);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14181d;
          --bg-2: #1b2027;
          --line: #2a313a;
          --fg: #e8ecf1;
          --muted: #97a1ae;
          --scroll-thumb: rgba(232, 236, 241, .22);
          --scroll-thumb-hover: rgba(232, 236, 241, .38);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }

      /* ── scrollbars ───────────────────────────────────────────────
         The platform default is a wide light-grey bar that ignores the theme
         entirely: on the dark rail-side chrome it reads as a bright stripe
         glued to the edge of a dark panel. Chromium honours BOTH the standard
         properties and the -webkit pseudo-elements; the standard ones are
         declared first so the rules survive a future engine that drops the
         prefixed set, and the pseudo-elements do the fine work (rounded thumb,
         transparent track, no arrow buttons) that `scrollbar-width` cannot
         express. Tokenised, so the dark palette above repaints them for free. */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--scroll-thumb) transparent;
      }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
        /* Inset by a transparent border rather than by width: a narrower thumb
           would sit in a wider gutter and drift away from the content edge. */
        border: 2px solid transparent;
        background-clip: padding-box;
        border-radius: 8px;
      }
      *::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: padding-box; }
      /* Where a vertical and a horizontal bar meet — unstyled, it paints as a
         white square in the corner of a dark panel. */
      *::-webkit-scrollbar-corner { background: transparent; }
      body {
        display: flex;
        font: 14px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }

      /* ── account rail ──────────────────────────────────────────
         Dark in both themes, on purpose. A rail that matches the content area
         reads as an empty margin with a square floating in it — which is what
         the first attempt looked like. The contrast is what makes it a rail. */
      #rail {
        width: var(--rail);
        flex: 0 0 var(--rail);
        background: #171c26;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 0 10px;
        gap: 10px;
        -webkit-app-region: drag;      /* the rail doubles as the title bar */
      }
      #rail * { -webkit-app-region: no-drag; }

      .slot { position: relative; display: flex; justify-content: center; width: 100%; }
      /* Slack's active marker: a bar on the rail's own edge, not a ring around
         the avatar. It survives any avatar colour. */
      .slot.active::before {
        content: '';
        position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        width: 4px; height: 26px; border-radius: 0 3px 3px 0; background: #fff;
      }
      .avatar {
        width: 40px; height: 40px;
        border: 0;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: .02em;
        cursor: pointer;
        color: #fff;
        position: relative;
        border-radius: 50%;
        opacity: .62;
        transition: border-radius .14s ease, opacity .14s ease;
      }
      .avatar:hover { border-radius: 14px; opacity: 1; }
      .slot.active .avatar { border-radius: 14px; opacity: 1; }
      /* Whether the background work is actually working, visible without
         opening anything. */
      .avatar .dot {
        position: absolute; right: -1px; bottom: -1px;
        width: 12px; height: 12px; border-radius: 50%;
        border: 2.5px solid #171c26;
      }
      .dot.ok { background: #2eb872; }
      .dot.err { background: #ef4444; }

      .rail-btn {
        width: 40px; height: 40px; border-radius: 50%; border: 0;
        background: rgba(255, 255, 255, .08);
        color: rgba(255, 255, 255, .72);
        cursor: pointer;
        display: grid; place-items: center;
        padding: 0;
        transition: background .14s ease, color .14s ease, border-radius .14s ease;
      }
      /* ⚠ SVG, not a text glyph. `⚙` and `+` are drawn against the font's own
         baseline, so `place-items: center` centres the LINE BOX and the shape
         still sits low and slightly left — visibly off in a 40px circle. An
         icon with its own viewBox has no baseline to fight. */
      .rail-btn svg { width: 18px; height: 18px; display: block; }
      .rail-btn:hover { background: rgba(255, 255, 255, .16); color: #fff; border-radius: 14px; }
      .rail-sep { width: 28px; height: 1px; background: rgba(255, 255, 255, .12); margin: 2px 0; }
      .spacer { flex: 1; }

      /* ── the application's own mark ───────────────────────────────
         Fixed, at the top, above the servers. filex is what the window IS; the
         rows below are WHERE you are signed in. A badge here that changed with
         the selected account would leave nothing on screen naming the app. */
      .appmark {
        width: 32px; height: 32px; flex: 0 0 auto;
        display: grid; place-items: center;
        margin-bottom: 2px;
      }
      .appmark svg { width: 32px; height: 32px; display: block; }

      /* ── a server's own logo, ON its row ──────────────────────────
         Each row is a server (a tenant), so the logo its admin set under
         Branding is the truest label it can carry — better than initials
         derived from an e-mail address, which is what somebody's ACCOUNT is
         called, not what the install is called.
         `contain` on a light plate: logos are authored for white pages, and a
         dark-on-dark mark against the rail would render as an empty square. */
      .avatar--brand {
        background: rgba(255, 255, 255, .94);
        padding: 4px;
        overflow: hidden;
        /* ⚠ Always the rounded square, never the circle the initials use.
           Logo artwork is authored square: a 50% radius eats its corners, and
           a mark that only looks right while its row is selected is not a mark.
           Which row is active is already said by the bar on the rail's edge. */
        border-radius: 12px;
      }
      .avatar--brand img {
        max-width: 100%; max-height: 100%;
        object-fit: contain;
        display: block;
        /* The plate rounds with the avatar; without this the artwork's own
           corners poke through the animated radius. */
        border-radius: inherit;
      }

      /* ── main ────────────────────────────────────────────────── */
      #main { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
      filex-explorer { display: block; flex: 1; min-height: 0; }

      /* ── boot surface ────────────────────────────────────────────
         What fills the window between "the app opened" and "the files are
         listed". It used to be a dashed grey box pinned to the top-left
         corner of an otherwise blank white window, which reads as a broken
         layout rather than as work in progress. It is a whole surface now,
         centred, on the app's own background, and it says WHICH server it is
         waiting for — the one fact that makes waiting tolerable. */
      #boot {
        position: absolute; inset: 0;
        display: none;
        place-items: center;
        background: var(--bg);
        padding: 24px;
        text-align: center;
      }
      #boot.on { display: grid; }
      .boot__inner { max-width: 380px; display: grid; justify-items: center; gap: 6px; }
      .boot__mark {
        width: 56px; height: 56px; margin-bottom: 12px;
        display: grid; place-items: center;
        border-radius: 16px;
        background: linear-gradient(160deg, var(--accent), #1e4fd0);
        box-shadow: 0 6px 18px rgba(47, 109, 246, .28);
      }
      .boot__mark svg { width: 30px; height: 30px; color: #fff; }
      /* The server's own logo replaces the generic mark. No gradient behind it:
         a brand mark on top of somebody else's brand colour is two logos. */
      .boot__mark--brand {
        background: rgba(255, 255, 255, .94);
        box-shadow: 0 4px 14px rgba(0, 0, 0, .16);
        padding: 8px;
      }
      .boot__mark--brand img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
      .boot__title { font-size: 15px; font-weight: 600; }
      .boot__sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
      /* An indeterminate bar, not a spinner: it fills the same width as the
         text above it, so the surface stays a single centred column. */
      .boot__bar {
        margin-top: 16px; width: 190px; height: 3px; border-radius: 2px;
        background: var(--line); overflow: hidden; position: relative;
      }
      .boot__bar::after {
        content: ''; position: absolute; inset: 0 auto 0 0; width: 40%;
        border-radius: 2px; background: var(--accent);
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar::after { animation: none; width: 100%; opacity: .5; }
      }
      .boot__err {
        margin-top: 14px; padding: 10px 12px; border-radius: 8px;
        background: rgba(192, 57, 43, .09); border: 1px solid rgba(192, 57, 43, .28);
        color: var(--danger); font-size: 13px; overflow-wrap: anywhere; text-align: left;
      }
      .boot__actions { margin-top: 16px; display: flex; gap: 8px; }

      /* ── storage connections ─────────────────────────────────────
         A full surface, not a card inside Settings: the shared panel
         carries its own tabs, a driver-driven form and a page of client
         instructions, and folding that into a scrolling settings column
         makes both unreadable.

         ⚠ Above #settings (200) — it is opened FROM settings, and the
         folder picker below already made exactly this mistake once: the
         dialog was there, just underneath the surface that launched it. */
      #conn {
        position: absolute; inset: 0; background: var(--bg);
        overflow: auto; padding: 26px 30px 40px; display: none;
        z-index: 210;
      }
      #conn.open { display: block; }
      /* The component draws its own chrome; it only needs the reading
         width the rest of this window uses. */
      #conn-host { max-width: 940px; }

      #settings {
        position: absolute; inset: 0; background: var(--bg);
        overflow: auto; padding: 26px 30px 40px; display: none;
        /* ⚠ Above anything the explorer puts on the page. Its onboarding tour is
           appended to document.body at z-index 96 and its menus are fixed too,
           so a panel in the normal stacking order gets covered by them. */
        z-index: 200;
      }
      #settings.open { display: block; }
      /* ⚠ Hiding #explorer-host is NOT enough: .fe-tour is a child of <body>,
         not of the explorer, so it survives its host being hidden and lands in
         the middle of Settings — measured, twice. */
      body.settings-open .fe-tour { display: none !important; }

      h1 { font-size: 19px; margin: 0 0 4px; }
      h2 { font-size: 14px; margin: 26px 0 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      .sub { color: var(--muted); margin: 0 0 18px; }
      .card {
        border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
        margin-bottom: 10px; background: var(--bg-2);
      }
      .between { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .muted { color: var(--muted); font-size: 13px; }
      .err { color: var(--danger); }
      .ok { color: #2eb872; }
      code { background: rgba(127,127,127,.16); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
      button {
        font: inherit; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--bg); color: var(--fg); cursor: pointer;
      }
      button:hover { border-color: var(--muted); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.danger { color: var(--danger); }
      button.link { border: 0; background: none; color: var(--accent); padding: 4px 2px; text-decoration: underline; }
      input[type="text"] {
        font: inherit; padding: 7px 10px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 260px;
      }
      .empty { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 10px; }
      .close { position: absolute; top: 18px; right: 22px; }

      /* remote folder browser */
      /* ⚠ Above #settings (200). This picker is opened FROM settings, so a
         lower stacking order put it behind the panel that launched it —
         the dialog was there, just invisible under a full-screen surface. */
      #picker { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; place-items: center; z-index: 300; }
      #picker.open { display: grid; }
      #picker .panel {
        width: min(520px, 92vw); max-height: 76vh; background: var(--bg);
        border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column;
      }
      #picker ul { list-style: none; margin: 10px 0; padding: 0; overflow: auto; flex: 1; }
      #picker li { padding: 7px 9px; border-radius: 7px; cursor: pointer; }
      #picker li:hover { background: var(--bg-2); }
    </style>
  </head>
  <body>
    <nav id="rail"></nav>
    <div id="main">
      <div id="explorer-host" style="flex:1;min-height:0;display:flex"></div>
      <div id="boot"></div>
      <section id="settings"></section>
      <section id="conn">
        <div id="conn-host"></div>
      </section>
    </div>

    <div id="picker"><div class="panel">
      <div class="between"><strong id="pk-title">Choose a folder on the server</strong><button id="pk-close">✕</button></div>
      <div class="muted" id="pk-path" style="margin-top:6px"></div>
      <ul id="pk-list"></ul>
      <div class="row" style="justify-content:flex-end">
        <button id="pk-up">Up</button>
        <button class="primary" id="pk-use">Sync this folder</button>
      </div>
    </div></div>

    <script type="module">
      import './filex.js';

      // ── Web Share, which Electron does not ship ───────────────
      // The explorer already has a share button; it is gated on
      // `typeof navigator.share === 'function'`, and Electron has no Web Share
      // API — measured, navigator.share is undefined here. So the button that
      // exists in the product simply never rendered in the desktop app.
      //
      // Polyfilling the standard API is the right seam: no second share UI, no
      // fork of the component, and the day Electron ships Web Share this whole
      // block can go without touching the explorer.
      if (typeof navigator.share !== 'function') {
        navigator.canShare = (d) => !!(d && (d.url || d.text || d.title));
        navigator.share = (d) => window.filexApp.share(d);
      }

      // Both drawn on a 24-unit grid so they optically match at 18px.
      const ICON_PLUS =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
        'stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      const ICON_GEAR =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="3.2"/>' +
        '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

      // ── language ──────────────────────────────────────────────
      // The explorer inside this window already speaks the user's language. A
      // shell in English wrapped around a Turkish file list is one app
      // pretending to be two — which is most of why this window looked wrong.
      // The OS locale decides, and everything we do not ship falls back to
      // English rather than to an empty string.
      // ⚠ A `let`, and read through lang(): the language is a SETTING now
      // (Settings → Language: System / English / Türkçe). The main process
      // resolves 'system' against the OS and hands the answer down as
      // `effectiveLocale`, so the tray menu and this window can never disagree
      // about what "system" means. Until the first state arrives — the boot
      // screens draw before any IPC — the browser locale is the best guess.
      let LANG = (navigator.language || 'en').toLowerCase().startsWith('tr') ? 'tr' : 'en';
      function applyLang(next) {
        const lang = next === 'tr' || next === 'en' ? next : LANG;
        if (lang === LANG) return false;
        LANG = lang;
        document.documentElement.lang = lang;
        // The explorer is a web component that WATCHES its config, so the file
        // list switches language in place — no reload, and the folder you were
        // looking at stays open.
        //
        // ⚠⚠ Through `config`, NOT the `locale` attribute: the component merges
        // `{...attributes, ...config}` and the config property wins. Setting
        // `el.locale = 'tr'` therefore changed the property and nothing else —
        // the shell went Turkish while the file list stayed English, and the
        // element reported `locale === 'tr'` the whole time. A new object is
        // what the watcher notices.
        //
        // ⚠ EVERY web component in this window, not just the file list. The
        // connections panel is a second one with its own catalogue, and a
        // switch that leaves half the window in the old language is not a
        // switch. Same rule, same trap: reassign `config`.
        for (const el of document.querySelectorAll('filex-explorer, filex-connections')) {
          if (el.config) el.config = { ...el.config, locale: lang };
        }
        return true;
      }
      const STRINGS = {
        'boot.no_account':      ['No account is signed in', 'Giriş yapılmış hesap yok'],
        'boot.no_account_sub':  ['Add a server to start browsing your files.', 'Dosyalarını görmek için bir sunucu ekle.'],
        'boot.add':             ['Add an account', 'Hesap ekle'],
        'boot.connecting':      ['Connecting to {host}', '{host} sunucusuna bağlanılıyor'],
        'boot.unreachable':     ["Can't reach {host}", '{host} sunucusuna ulaşılamıyor'],
        'boot.unreachable_sub': ['The server did not answer. It may be offline, or this computer may be off the network.',
                                 'Sunucu yanıt vermedi. Kapalı olabilir ya da bu bilgisayar ağ dışında olabilir.'],
        'boot.retry':           ['Try again', 'Yeniden dene'],

        'rail.add':             ['Add another account', 'Başka bir hesap ekle'],
        'rail.settings':        ['Settings', 'Ayarlar'],

        'set.title':            ['Settings', 'Ayarlar'],
        'set.sub':              ["This app's settings, plus the storage connections of the server you are signed in to.",
                                 'Bu uygulamanın ayarları ve bağlı olduğunuz sunucunun depo bağlantıları.'],
        'set.connections':      ['Storage connections', 'Depo bağlantıları'],
        'set.connections_sub':  ['Connect this server to a bucket, a share or another server — and see how to mount it from this computer.',
                                 'Bu sunucuyu bir bucket, bir paylaşım ya da başka bir sunucuya bağlayın — ve bu bilgisayardan nasıl bağlanacağınızı görün.'],
        'set.connections_open': ['Manage storages', 'Depoları yönet'],
        'set.connections_guide':['How to connect', 'Nasıl bağlanılır'],
        'set.accounts':         ['Accounts', 'Hesaplar'],
        'set.admin':            ['Admin panel ↗', 'Yönetim paneli ↗'],
        'set.signout':          ['Sign out', 'Çıkış yap'],
        'set.no_accounts':      ['No accounts.', 'Hesap yok.'],
        'set.folders':          ['Synced folders', 'Eşitlenen klasörler'],
        'set.no_engine':        ['The sync engine is missing from this build, so nothing will transfer.',
                                 'Bu sürümde eşitleme motoru yok, hiçbir dosya aktarılmayacak.'],
        'set.no_folders':       ['No folders are syncing yet.', 'Henüz eşitlenen klasör yok.'],
        'set.open_folder':      ['Open folder', 'Klasörü aç'],
        'set.stop_sync':        ['Stop syncing', 'Eşitlemeyi durdur'],
        'set.add_sync':         ['Sync a folder…', 'Klasör eşitle…'],
        'set.sync_root':        ['filex folder on this computer', 'Bu bilgisayardaki filex klasörü'],
        'set.sync_root_sub':    ['Kept folders mirror under it as storage/path.',
                                 '"Bilgisayarda tut" dediklerin bunun altına depo/yol düzeninde iner.'],
        'set.sync_root_none':   ['Not chosen yet — you will be asked at the first "Keep on this computer".',
                                 'Henüz seçilmedi — ilk "Bilgisayarda tut" dediğinde sorulur.'],
        'set.sync_root_change': ['Change…', 'Değiştir…'],
        'set.trash':            ['Recently deleted', 'Son silinenler'],
        'set.sync_note':        ['The first sync of a folder merges both sides and deletes nothing. After that deletes carry across; anything removed from this computer is kept for 30 days.',
                                 'Bir klasörün ilk eşitlemesi iki tarafı birleştirir, hiçbir şeyi silmez. Sonrasında silmeler karşı tarafa geçer; bu bilgisayardan silinen her şey 30 gün saklanır.'],
        'set.this_app':         ['This app', 'Bu uygulama'],
        'set.background':       ['Keep running in the background', 'Arka planda çalışmaya devam et'],
        'set.background_sub':   ['Closing the window leaves filex in the tray so folders keep syncing.',
                                 'Pencereyi kapatınca filex sistem tepsisinde kalır, klasörler eşitlenmeye devam eder.'],
        'set.autostart':        ['Start when I sign in', 'Oturum açtığımda başlat'],
        'set.autostart_refused':['Requested, but the system did not accept it.', 'İstendi ama sistem kabul etmedi.'],
        'set.autostart_sub':    ['Launches minimised to the tray.', 'Sistem tepsisine küçültülmüş olarak açılır.'],
        'set.autostart_dev':    ['Only the installed app can start at sign-in.',
                                 'Oturum açılışında yalnızca kurulu uygulama başlatılabilir.'],
        'set.language':         ['Language', 'Dil'],
        'set.language_sub':     ['Applies to this window, the tray menu and the file list.',
                                 'Bu pencere, tepsi menüsü ve dosya listesi için geçerlidir.'],
        'set.language_system':  ['System', 'Sistem'],
        'upd.title':            ['Updates', 'Güncellemeler'],
        'upd.idea':             ['filex updates itself in the background — while you are away, or when you quit. No installer, nothing to click.',
                                 'filex kendini arka planda günceller — bilgisayar başında değilken ya da çıkışta. Kurulum ekranı yok, tıklayacağın bir şey yok.'],
        'upd.check':            ['Check now', 'Şimdi denetle'],
        'upd.checking':         ['Checking…', 'Denetleniyor…'],
        'upd.current':          ['Up to date', 'Güncel'],
        'upd.available':        ['Version {v} found', '{v} sürümü bulundu'],
        'upd.downloading':      ['Downloading… %{p}', 'İndiriliyor… %{p}'],
        'upd.ready':            ['Version {v} installs itself shortly', '{v} sürümü birazdan kendiliğinden kurulacak'],
        'upd.restart':          ['Install it now', 'Şimdi kur'],
        'upd.error':            ['Could not check for updates', 'Güncelleme denetlenemedi'],
        'upd.manual':           ['Version {v} is out — install it by downloading',
                                 '{v} sürümü çıktı — indirerek kurun'],
        'upd.manual_idea':      ['This macOS build is not signed for self-update; new versions install as a fresh download.',
                                 'Bu macOS paketi kendini güncellemek için imzalı değil; yeni sürümler indirilerek kurulur.'],
        'upd.download':         ['Download', 'İndir'],
        'upd.dev':              ['Only the installed app updates itself.',
                                 'Yalnızca kurulu uygulama kendini günceller.'],
        'set.on':               ['On', 'Açık'],
        'set.off':              ['Off', 'Kapalı'],
        'set.unknown_account':  ['unknown account', 'bilinmeyen hesap'],

        'sync.waiting':         ['waiting to start', 'başlaması bekleniyor'],
        'sync.watching':        ['watching for changes', 'değişiklikler izleniyor'],
        'sync.stopped':         ['stopped', 'durdu'],
        'sync.trash_kept':      ['Kept for 30 days:', '30 gün saklanıyor:'],
        'sync.trash_empty':     ['Nothing has been removed by sync.', 'Eşitleme hiçbir şey silmedi.'],

        'pick.title':           ['Choose a folder on the server', 'Sunucuda bir klasör seç'],
        'pick.storages':        ['Storages on this server', 'Bu sunucudaki depolar'],
        'pick.loading':         ['Loading…', 'Yükleniyor…'],
        'pick.empty':           ['No folders here.', 'Burada klasör yok.'],
        'pick.up':              ['Up', 'Üst klasör'],
        'pick.use':             ['Sync this folder', 'Bu klasörü eşitle'],
        'pick.pick_storage':    ['Open a storage first, then choose a folder inside it.',
                                 'Önce bir depo aç, sonra içindeki klasörü seç.'],
      };
      function T(key, vars) {
        const entry = STRINGS[key];
        let s = entry ? (LANG === 'tr' ? entry[1] : entry[0]) : key;
        if (vars) for (const [k, v] of Object.entries(vars)) s = s.split(`{${k}}`).join(v);
        return s;
      }

      const $ = (sel, root = document) => root.querySelector(sel);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const host = (u) => { try { return new URL(u).host; } catch { return u; } };
      const initials = (email) => (email || '?').replace(/@.*/, '').slice(0, 2).toUpperCase();

      let state = { accounts: [], activeId: null, syncFolders: [], syncStatuses: [] };
      let explorer = null;
      let explorerSyncCb = null;
      // Dışarı sürükleme hazırlığının ilerlemesi — tek abone, mount'ta yenilenir.
      let explorerDragCb = null;
      let mountedFor = null;

      // ── the explorer ──────────────────────────────────────────
      // Mounted once per account. `auth.token` is a FUNCTION, which the component
      // supports: the credential is fetched from the main process at call time
      // rather than being handed to this page up front and kept lying around.
      // The application's own mark — the same folder-and-check the web app uses
      // (web/src/components/LogoMark.vue), so the desktop and the browser are
      // recognisably one product. Fixed: it says filex, never which server.
      const ICON_APP =
        '<svg viewBox="0 0 32 32" aria-hidden="true">' +
        '<defs><linearGradient id="filex-rail-grad" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4338ca"/>' +
        '</linearGradient></defs>' +
        '<rect width="32" height="32" rx="8" fill="url(#filex-rail-grad)"/>' +
        '<path d="M7 11a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V11z" ' +
        'fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>' +
        '<path d="M11.5 17.5l3 2.5 5.5-6" fill="none" stroke="#fff" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const ICON_MARK =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.4h9A1.5 1.5 0 0 1 21 9.9v7.6a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';

      // ── the server's identity ─────────────────────────────────
      // Branding (logo + name) is a property of the SERVER, so it is fetched per
      // account and cached for the life of the window. One request per account,
      // never per repaint: renderRail() runs on every sync tick.
      const brands = new Map();

      /** Cached branding for an account, or null while unknown. */
      function brandOf(accountId) {
        const b = brands.get(accountId);
        return b && b.logoUrl ? b : null;
      }

      async function loadBrand(account) {
        if (!account || brands.has(account.id)) return;
        brands.set(account.id, { name: '', logoUrl: '' });   // claim the slot
        try {
          const b = await window.filexApp.branding(account.id);
          brands.set(account.id, b || { name: '', logoUrl: '' });
          if (b && b.logoUrl) { renderRail(); repaintBoot(); }
        } catch {
          // A server with no branding set, or an older build without the
          // endpoint, is not a failure — it just has no mark to show.
        }
      }

      /** The surface shown while there is nothing else to show. */
      let bootHtml = null;
      function showBoot(html) {
        bootHtml = html;
        const brand = brandOf(state.activeId);
        // The server's own mark on the waiting screen too: this surface is
        // showing WHICH server is being waited for, and the logo is the fastest
        // way to say it.
        const mark = brand
          ? `<div class="boot__mark boot__mark--brand"><img src="${esc(brand.logoUrl)}" alt=""></div>`
          : `<div class="boot__mark">${ICON_MARK}</div>`;
        const b = $('#boot');
        b.innerHTML = `<div class="boot__inner">${mark}${html}</div>`;
        b.classList.add('on');
      }
      /** Re-paints the boot surface in place — used when branding lands after
       *  the surface is already up, which is the normal ordering. */
      function repaintBoot() {
        if (bootHtml !== null && $('#boot').classList.contains('on')) showBoot(bootHtml);
      }
      function hideBoot() {
        bootHtml = null;
        $('#boot').classList.remove('on');
        $('#boot').innerHTML = '';
      }

      async function mountExplorer(account) {
        const slot = $('#explorer-host');
        if (!account) {
          slot.innerHTML = '';
          explorer = null; mountedFor = null;
          showBoot(
            `<div class="boot__title">${esc(T('boot.no_account'))}</div>` +
            `<div class="boot__sub">${esc(T('boot.no_account_sub'))}</div>` +
            `<div class="boot__actions"><button class="primary" id="boot-add">${esc(T('boot.add'))}</button></div>`,
          );
          $('#boot-add').addEventListener('click', () => window.filexApp.addAccount());
          return;
        }
        if (mountedFor === account.id) return;
        mountedFor = account.id;
        slot.innerHTML = '';
        showBoot(
          `<div class="boot__title">${esc(T('boot.connecting', { host: host(account.serverUrl) }))}</div>` +
          `<div class="boot__sub">${esc(account.email)}</div>` +
          '<div class="boot__bar"></div>',
        );

        // ⚠ The drives root mirrors the list we hand over — it does NOT go and
        // find the storages itself. Mounting without this produced an empty "/"
        // that never even asked the server for a listing, which reads as a dead
        // connection rather than a missing option.
        let storages = [];
        try {
          storages = await window.filexApp.storages(account.id);
        } catch (e) {
          if (mountedFor !== account.id) return;
          showBoot(
            `<div class="boot__title">${esc(T('boot.unreachable', { host: host(account.serverUrl) }))}</div>` +
            `<div class="boot__sub">${esc(T('boot.unreachable_sub'))}</div>` +
            `<div class="boot__err">${esc(e.message || e)}</div>` +
            `<div class="boot__actions"><button class="primary" id="boot-retry">${esc(T('boot.retry'))}</button>` +
            `<button id="boot-settings">${esc(T('rail.settings'))}</button></div>`,
          );
          $('#boot-retry').addEventListener('click', () => { mountedFor = null; void mountExplorer(account); });
          $('#boot-settings').addEventListener('click', () => toggleSettings(true));
          return;
        }
        if (mountedFor !== account.id) return;   // switched away while loading

        hideBoot();
        slot.innerHTML = '';
        explorer = document.createElement('filex-explorer');
        explorer.style.cssText = 'display:block;flex:1;min-height:0';
        explorer.config = {
          apiBase: account.serverUrl,
          auth: { kind: 'bearer', token: () => window.filexApp.token(account.id) },
          storages,
          multiStorageRoot: storages.length > 1,
          // One storage does not deserve a drive-picker in front of it: open the
          // files. More than one, and the root listing is the useful landing.
          initialPath: storages.length === 1 ? `${storages[0].name}://` : undefined,
          // ⚠ Deliberately not persisted. The stored path is a single global
          // key, so remembering it would try to open account A's folder after a
          // switch to account B.
          pathPersist: 'none',
          trashVisible: true,
          theme: 'auto',
          // One language for the whole window. The component defaults to
          // Turkish, so without this an English desktop showed English chrome
          // around a Turkish file list.
          locale: LANG,
          // Selective sync — folder menus grow "Keep on this computer".
          // The account id is captured HERE, at mount: a rail switch swaps
          // the whole explorer, so these hooks can never cross accounts.
          desktopSync: {
            kept: () => window.filexApp.syncKept(account.id),
            keep: (remote, kind) => window.filexApp.syncKeep(account.id, remote, kind === 'file'),
            unkeep: (remote) => window.filexApp.syncUnkeep(account.id, remote),
            reveal: (remote) => window.filexApp.syncReveal(account.id, remote),
            status: () => window.filexApp.syncStatus(account.id),
            // One subscriber — the mounted explorer. A rail switch remounts
            // and overwrites it, so a stale component never gets poked.
            onChange: (cb) => { explorerSyncCb = cb; },
          },
          // Dışarı sürükleme — masaüstüne / başka uygulamaya. Tarayıcı tek
          // dosyayı kendi indirme yoluyla bırakabiliyor; klasör ve çoklu seçim
          // GERÇEK yerel yollar ister, onları bu kabuk hazırlar (src/dragout.ts).
          // Hesap kimliği burada, mount anında yakalanır: raydan hesap
          // değişince explorer komple yeniden kurulur.
          dragOut: {
            prepare: (items) => window.filexApp.dragPrepare(account.id, items),
            start: (items) => window.filexApp.dragStart(account.id, items),
            cancel: () => window.filexApp.dragCancel(),
            onProgress: (cb) => { explorerDragCb = cb; },
          },
        };
        explorer.addEventListener('error', (e) => console.error('[explorer]', e.detail));
        slot.appendChild(explorer);
      }

      // ── rail ──────────────────────────────────────────────────
      /** A stable colour per account, so the same server always looks the same
       *  and two accounts are told apart at a glance rather than by reading.
       *
       *  ⚠ FNV-1a with a final avalanche, not `h * 31`. Measured: `h*31` mod a
       *  10-colour palette used only 5 of the 10 colours across 200 accounts —
       *  the low bits resonate with the modulus. The palette is also ordered so
       *  that neighbouring entries are far apart in hue, because a hash
       *  collision between two similar colours is the failure that matters. */
      function avatarColor(seed) {
        let h = 0x811c9dc5;
        for (let i = 0; i < seed.length; i++) {
          h ^= seed.charCodeAt(i);
          h = Math.imul(h, 0x01000193) >>> 0;
        }
        h ^= h >>> 16; h = Math.imul(h, 0x7feb352d) >>> 0;
        h ^= h >>> 15; h = Math.imul(h, 0x846ca68b) >>> 0;
        // ⚠ `>>> 0` again: XOR yields a SIGNED int, so without it `h % length`
        // goes negative for half of all inputs and the lookup returns
        // undefined — a transparent avatar. Measured: 44% of 1100 accounts.
        h = (h ^ (h >>> 16)) >>> 0;
        const palette = [
          '#4f7ce8', '#c2643a', '#2f9e6e', '#8a5cd6',
          '#a5772a', '#2f8fa8', '#c0466e', '#5b6ad0',
          '#6f8f2a', '#b0503f', '#7a5cc0',
        ];
        return palette[h % palette.length];
      }

      function renderRail() {
        const rail = $('#rail');
        const statusOf = Object.fromEntries((state.syncStatuses || []).map((s) => [s.accountId, s]));
        rail.innerHTML = '';

        // ── the app's own mark, fixed ─────────────────────────
        // filex is what this WINDOW is; the rows underneath are servers. The
        // two identities must not trade places: a rail whose top badge changed
        // with the selected account left nothing on screen that said which
        // application you were looking at.
        const appMark = document.createElement('div');
        appMark.className = 'appmark';
        appMark.title = 'filex';
        appMark.innerHTML = ICON_APP;
        rail.appendChild(appMark);
        rail.appendChild(Object.assign(document.createElement('div'), { className: 'rail-sep' }));

        for (const a of state.accounts) {
          const st = statusOf[a.id];
          const slot = document.createElement('div');
          slot.className = 'slot' + (a.id === state.activeId ? ' active' : '');
          const b = document.createElement('button');
          b.className = 'avatar';
          const brand = brandOf(a.id);
          // ⭐ Each row IS a server, so the server's own logo is the truest
          // thing to draw on it — an admin who set one under Branding has
          // already answered "which install is this?". Initials are the
          // fallback for servers that never set a logo, not the default.
          if (brand) {
            b.classList.add('avatar--brand');
            b.title = `${brand.name || host(a.serverUrl)}\n${a.email}\n${host(a.serverUrl)}`;
            const img = document.createElement('img');
            img.src = brand.logoUrl;
            img.alt = brand.name || '';
            // ⚠ A logo URL that does not resolve would leave an empty white
            // plate where an identifiable account used to be — worse than no
            // logo at all. Drop back to the initials.
            img.addEventListener('error', () => {
              brands.set(a.id, { name: brand.name, logoUrl: '' });
              renderRail();
              repaintBoot();
            });
            b.appendChild(img);
          } else {
            b.style.background = avatarColor(a.email + a.serverUrl);
            b.title = `${a.email}\n${host(a.serverUrl)}`;
            b.appendChild(document.createTextNode(initials(a.email)));
          }
          if (st) {
            const dot = document.createElement('span');
            dot.className = `dot ${st.lastError ? 'err' : st.running ? 'ok' : ''}`;
            b.appendChild(dot);
          }
          b.addEventListener('click', async () => {
            state = await window.filexApp.switchAccount(a.id);
            render();
          });
          slot.appendChild(b);
          rail.appendChild(slot);
        }

        const add = document.createElement('button');
        add.className = 'rail-btn';
        add.innerHTML = ICON_PLUS;
        add.title = T('rail.add');
        add.addEventListener('click', () => window.filexApp.addAccount());
        rail.appendChild(add);

        const sp = document.createElement('div'); sp.className = 'spacer'; rail.appendChild(sp);

        const sep = document.createElement('div'); sep.className = 'rail-sep'; rail.appendChild(sep);

        const gear = document.createElement('button');
        gear.className = 'rail-btn';
        gear.innerHTML = ICON_GEAR;
        gear.title = T('rail.settings');
        gear.addEventListener('click', () => toggleSettings());
        rail.appendChild(gear);
      }

      // ── settings (the APP's settings, not the server's) ───────
      function settingsHtml() {
        const active = state.accounts.find((a) => a.id === state.activeId);
        const statusOf = Object.fromEntries((state.syncStatuses || []).map((s) => [s.accountId, s]));

        const accounts = state.accounts.length ? state.accounts.map((a) => `
          <div class="card"><div class="between">
            <div>
              <div><strong>${esc(a.email)}</strong></div>
              <div class="muted">${esc(a.serverUrl)}</div>
            </div>
            <div class="row">
              <button class="link" data-admin="${a.id}">${esc(T('set.admin'))}</button>
              <button class="danger" data-signout="${a.id}">${esc(T('set.signout'))}</button>
            </div>
          </div></div>`).join('') : `<div class="empty">${esc(T('set.no_accounts'))}</div>`;

        const pairs = state.syncFolders.length ? state.syncFolders.map((f) => {
          const acc = state.accounts.find((a) => a.id === f.accountId);
          const st = statusOf[f.accountId];
          let line = T('sync.waiting'), cls = 'muted';
          if (st && st.lastError) { line = st.lastError; cls = 'err'; }
          else if (st && st.running) { line = st.lastLine || T('sync.watching'); cls = 'ok'; }
          else if (st) { line = T('sync.stopped'); cls = 'err'; }
          return `
          <div class="card"><div class="between">
            <div style="min-width:0">
              <div><code>${esc(f.remotePath)}</code></div>
              <div class="muted" style="overflow-wrap:anywhere">↔ ${esc(f.localPath)}</div>
              <div class="muted">${esc(acc ? acc.email : T('set.unknown_account'))}</div>
              <div class="${cls}" style="font-size:13px">${esc(line)}</div>
            </div>
            <div class="row">
              <button data-openlocal="${esc(f.localPath)}">${esc(T('set.open_folder'))}</button>
              <button class="danger" data-rmsync="${f.id}">${esc(T('set.stop_sync'))}</button>
            </div>
          </div></div>`;
        }).join('') : `<div class="empty">${esc(T('set.no_folders'))}</div>`;

        const engineWarning = state.syncEngine === 'missing'
          ? `<div class="card err">${esc(T('set.no_engine'))}</div>` : '';

        return `
          <button class="close" id="close-settings">✕</button>
          <h1>${esc(T('set.title'))}</h1>
          <p class="sub">${esc(T('set.sub'))}</p>

          <h2>${esc(T('set.accounts'))}</h2>
          ${accounts}
          <div class="row"><button id="add-account">${esc(T('boot.add'))}</button></div>

          <h2>${esc(T('set.connections'))}</h2>
          <div class="card"><div class="between">
            <div><strong>${esc(T('set.connections'))}</strong>
              <div class="muted">${esc(T('set.connections_sub'))}</div></div>
            <div class="row">
              <button id="conn-open" ${active ? '' : 'disabled'}>${esc(T('set.connections_open'))}</button>
              <button id="conn-guide" ${active ? '' : 'disabled'}>${esc(T('set.connections_guide'))}</button>
            </div>
          </div></div>

          <h2>${esc(T('set.folders'))}</h2>
          ${engineWarning}
          ${active ? `<div class="card"><div class="between">
            <div style="min-width:0">
              <div><strong>${esc(T('set.sync_root'))}</strong></div>
              <div class="muted" style="overflow-wrap:anywhere">${
                active.syncRoot ? esc(active.syncRoot) : esc(T('set.sync_root_none'))}</div>
              <div class="muted">${esc(T('set.sync_root_sub'))}</div>
            </div>
            <div class="row">
              <button data-openlocal="${esc(active.syncRoot || '')}" ${active.syncRoot ? '' : 'disabled'}>${esc(T('set.open_folder'))}</button>
              <button id="sync-root-change">${esc(T('set.sync_root_change'))}</button>
            </div>
          </div></div>` : ''}
          ${pairs}
          <div class="row" style="margin-top:6px">
            <button class="primary" id="add-sync" ${active ? '' : 'disabled'}>${esc(T('set.add_sync'))}</button>
            <button id="sync-trash">${esc(T('set.trash'))}</button>
          </div>
          <p class="muted" style="margin-top:10px">${esc(T('set.sync_note'))}</p>

          <h2>${esc(T('set.this_app'))}</h2>
          <div class="card"><div class="between">
            <div><strong>${esc(T('set.language'))}</strong>
              <div class="muted">${esc(T('set.language_sub'))}</div></div>
            <div class="row">${
              // The names stay in their own language — a Turkish speaker looking
              // for Turkish scans for "Türkçe", not for "Turkish".
              [['system', T('set.language_system')], ['en', 'English'], ['tr', 'Türkçe']]
                .map(([code, label]) => `<button data-locale="${code}"${
                  (state.locale || 'system') === code ? ' class="primary"' : ''
                }>${esc(label)}</button>`).join('')
            }</div>
          </div></div>
          <div class="card"><div class="between">
            <div><strong>${esc(T('set.background'))}</strong>
              <div class="muted">${esc(T('set.background_sub'))}</div></div>
            <button id="bg">${esc(T(state.runInBackground ? 'set.on' : 'set.off'))}</button>
          </div></div>
          <div class="card"><div class="between">
            <div><strong>${esc(T('set.autostart'))}</strong>
              <div class="muted">${esc(T(
                // A dev run refuses to write a login item at all (it could only
                // register the bare electron binary), so the row says that
                // rather than offering a switch that silently does nothing.
                state.launchAtLoginSupported === false ? 'set.autostart_dev'
                : state.launchAtLoginEffective === false && state.launchAtLogin
                  ? 'set.autostart_refused' : 'set.autostart_sub'))}</div></div>
            <button id="login-item" ${state.launchAtLoginSupported === false ? 'disabled' : ''}>${
              esc(T(state.launchAtLogin ? 'set.on' : 'set.off'))}</button>
          </div></div>
          <h2>${esc(T('upd.title'))}</h2>
          ${updateCard()}
          <p class="muted">filex ${esc(state.appVersion || '')}</p>`;
      }

      /** The update row: what the app knows, plus the one button that matters. */
      function updateCard() {
        const u = state.update || { status: 'idle' };
        const supported = state.launchAtLoginSupported !== false; // packaged run
        // An ad-hoc sealed mac build cannot swap itself; its story is a
        // download, and pretending otherwise is what this card used to do.
        const manual = state.updateManualOnly === true;
        let line = T('upd.current');
        if (!supported) line = T('upd.dev');
        else if (u.status === 'checking') line = T('upd.checking');
        else if (u.status === 'manual') line = T('upd.manual', { v: u.version || '' });
        else if (u.status === 'available') line = T('upd.available', { v: u.version || '' });
        else if (u.status === 'downloading') line = T('upd.downloading', { p: u.percent ?? 0 });
        else if (u.status === 'ready') line = T('upd.ready', { v: u.version || '' });
        else if (u.status === 'error') line = T('upd.error');
        const btn = u.status === 'ready'
          ? `<button class="primary" id="upd-install">${esc(T('upd.restart'))}</button>`
          : u.status === 'manual'
            ? `<button class="primary" id="upd-download">${esc(T('upd.download'))}</button>`
            : `<button id="upd-check" ${supported ? '' : 'disabled'}>${esc(T('upd.check'))}</button>`;
        return `<div class="card"><div class="between">
            <div><strong>${esc(line)}</strong>
              <div class="muted">${esc(T(manual && supported ? 'upd.manual_idea' : 'upd.idea'))}</div></div>
            ${btn}
          </div></div>`;
      }

      function toggleSettings(force) {
        const el = $('#settings');
        const open = force ?? !el.classList.contains('open');
        el.classList.toggle('open', open);
        // Hide the explorer, don't just cover it. The body class additionally
        // hides overlays the explorer parents to <body> — hiding the host alone
        // left the tour card sitting in the middle of Settings.
        syncOverlays();
        if (open) renderSettings();
      }

      function renderSettings() {
        const el = $('#settings');
        el.innerHTML = settingsHtml();
        $('#close-settings', el).addEventListener('click', () => toggleSettings(false));
        el.querySelectorAll('[data-signout]').forEach((b) => b.addEventListener('click', async () => {
          state = await window.filexApp.signOut(b.dataset.signout); render(); renderSettings();
        }));
        el.querySelectorAll('[data-admin]').forEach((b) => b.addEventListener('click', () =>
          window.filexApp.openAdmin(b.dataset.admin)));
        el.querySelectorAll('[data-openlocal]').forEach((b) => b.addEventListener('click', () =>
          window.filexApp.openLocal(b.dataset.openlocal)));
        el.querySelectorAll('[data-rmsync]').forEach((b) => b.addEventListener('click', async () => {
          try { state = await window.filexApp.removeSync(b.dataset.rmsync); }
          catch (e) { alert(String(e.message || e)); }
          render(); renderSettings();
        }));
        $('#add-account', el).addEventListener('click', () => window.filexApp.addAccount());
        const connOpen = $('#conn-open', el);
        if (connOpen) connOpen.addEventListener('click', () => openConnections('storages'));
        const connGuide = $('#conn-guide', el);
        if (connGuide) connGuide.addEventListener('click', () => openConnections('connect'));
        const addSync = $('#add-sync', el);
        if (addSync) addSync.addEventListener('click', () => openPicker());
        const rootChange = $('#sync-root-change', el);
        if (rootChange) rootChange.addEventListener('click', async () => {
          state = await window.filexApp.setSyncRoot(state.activeId);
          renderSettings();
        });
        $('#sync-trash', el).addEventListener('click', async () => {
          const items = await window.filexApp.syncTrash();
          alert(items.length
            ? `${T('sync.trash_kept')}\n\n${items.slice(0, 25).map((i) => `${i.rel}  (${new Date(i.deleted).toLocaleDateString()})`).join('\n')}`
            : T('sync.trash_empty'));
        });
        $('#bg', el).addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ runInBackground: !state.runInBackground });
          renderSettings();
        });
        el.querySelectorAll('[data-locale]').forEach((b) => b.addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ locale: b.dataset.locale });
          // The main process resolves 'system'; taking its answer keeps this
          // window and the tray menu in the same language.
          applyLang(state.effectiveLocale);
          relabelStatic();
          render();
          renderSettings();
        }));
        const updCheck = $('#upd-check', el);
        if (updCheck) updCheck.addEventListener('click', async () => {
          state = await window.filexApp.checkUpdate();
          renderSettings();
        });
        const updInstall = $('#upd-install', el);
        if (updInstall) updInstall.addEventListener('click', () => window.filexApp.installUpdate());
        const updDownload = $('#upd-download', el);
        if (updDownload) updDownload.addEventListener('click', () => window.filexApp.downloadUpdate());
        $('#login-item', el).addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ launchAtLogin: !state.launchAtLogin });
          renderSettings();
        });
      }

      // ── storage connections ───────────────────────────────────
      // ⚠⚠ NOT a form written here. `<filex-connections>` is the same
      // component the web admin panel mounts, from the same npm package as
      // the explorer above — the driver fields come from the server's own
      // descriptors and the instructions from the live deployment. A
      // hand-written copy in this file would be the exact split the shared
      // package exists to prevent (v0.16.0 shipped one; Ada was right to
      // be angry about it).
      //
      // The only genuinely desktop-specific parts stay here: which server
      // is active, and where the bearer token comes from.
      let connFor = null;
      let connTab = null;

      function openConnections(tab) {
        const active = state.accounts.find((a) => a.id === state.activeId);
        if (!active) return;
        const slot = $('#conn-host');
        // Recreated when the account OR the requested half changes: the
        // panel picks its opening tab once, at setup.
        if (connFor !== active.id || connTab !== tab) {
          slot.innerHTML = '';
          const el = document.createElement('filex-connections');
          el.setAttribute('closable', '');
          el.initialTab = tab;
          el.config = {
            apiBase: active.serverUrl,
            // The same function-token the explorer gets: the credential is
            // fetched from the main process per call rather than handed to
            // this page up front.
            auth: { kind: 'bearer', token: () => window.filexApp.token(active.id) },
            locale: LANG,
            theme: 'auto',
          };
          el.addEventListener('close', () => toggleConnections(false));
          // A storage that was just added has to show up in the file list,
          // otherwise the user adds it and nothing happens.
          el.addEventListener('changed', () => {
            mountedFor = null;
            void mountExplorer(active);
          });
          el.addEventListener('error', (e) => console.error('[connections]', e.detail));
          slot.appendChild(el);
          connFor = active.id;
          connTab = tab;
        }
        toggleConnections(true);
      }

      function toggleConnections(open) {
        $('#conn').classList.toggle('open', open);
        syncOverlays();
      }

      /** Explorer visibility is a function of BOTH overlays.
       *
       *  ⚠ Not of the one being toggled: closing connections while Settings
       *  is still open would otherwise un-hide the explorer underneath it,
       *  and the tour card it parents to <body> would land in the middle of
       *  the settings page — the failure that is already commented twice
       *  above. */
      function syncOverlays() {
        const any =
          $('#conn').classList.contains('open') || $('#settings').classList.contains('open');
        $('#explorer-host').style.display = any ? 'none' : 'flex';
        document.body.classList.toggle('settings-open', any);
      }

      // ── remote folder picker ──────────────────────────────────
      // Typing `storage://some/path` by hand is a guess about someone else's
      // server. This walks the real listing instead.
      let pkPath = '';
      async function openPicker(path = '') {
        pkPath = path;
        $('#picker').classList.add('open');
        const list = $('#pk-list');
        list.innerHTML = `<li class="muted">${esc(T('pick.loading'))}</li>`;
        $('#pk-path').textContent = path || T('pick.storages');
        try {
          const entries = await window.filexApp.browse(state.activeId, path);
          list.innerHTML = '';
          if (!entries.length) list.innerHTML = `<li class="muted">${esc(T('pick.empty'))}</li>`;
          for (const e of entries) {
            const li = document.createElement('li');
            li.textContent = `📁 ${e.name}`;
            li.addEventListener('click', () => openPicker(e.path));
            list.appendChild(li);
          }
        } catch (e) {
          list.innerHTML = `<li class="err">${esc(e.message || e)}</li>`;
        }
      }
      $('#pk-close').addEventListener('click', () => $('#picker').classList.remove('open'));
      $('#pk-up').addEventListener('click', () => {
        if (!pkPath) return;
        const i = pkPath.lastIndexOf('/');
        openPicker(i > pkPath.indexOf('://') + 2 ? pkPath.slice(0, i) : '');
      });
      $('#pk-use').addEventListener('click', async () => {
        if (!pkPath) { alert(T('pick.pick_storage')); return; }
        try {
          state = await window.filexApp.addSync(pkPath);
          $('#picker').classList.remove('open');
          render(); renderSettings();
        } catch (e) { alert(String(e.message || e)); }
      });

      // ── boot ──────────────────────────────────────────────────
      function render() {
        const active = state.accounts.find((a) => a.id === state.activeId);
        // ⚠ EVERY account, not just the active one: the rail draws all of them
        // at once, so fetching only the active server's branding left the other
        // rows on initials until you clicked them.
        for (const a of state.accounts) void loadBrand(a);
        renderRail();
        void mountExplorer(active);
        // The rail stays clickable while the connections surface is open, so
        // a switch there must re-point it — otherwise it would keep showing
        // the previous server's storages under the new server's name.
        if ($('#conn').classList.contains('open')) openConnections(connTab || 'storages');
      }

      async function refresh() {
        state = await window.filexApp.getState();
        // The language the main process resolved (the choice, or the OS behind
        // 'system'). Everything already on screen is relabelled when it moves.
        if (applyLang(state.effectiveLocale)) relabelStatic();
        render();
        if ($('#settings').classList.contains('open')) renderSettings();
      }

      // The picker's chrome is static markup — labelled here rather than on
      // every open, and again whenever the language changes (a switch that
      // leaves half the window in the old language is worse than no switch).
      function relabelStatic() {
        $('#pk-title').textContent = T('pick.title');
        $('#pk-up').textContent = T('pick.up');
        $('#pk-use').textContent = T('pick.use');
      }
      relabelStatic();

      window.filexApp.onChanged(() => {
        refresh();
        if (explorerSyncCb) explorerSyncCb();
      });
      window.filexApp.onDragProgress((p) => {
        if (explorerDragCb) explorerDragCb(p);
      });
      window.filexApp.onOpenSettings(() => toggleSettings(true));
      refresh();
    </script>
  </body>
</html>
