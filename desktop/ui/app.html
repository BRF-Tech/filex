<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>filex</title>
    <!--
      The desktop app's own chrome. Deliberately small and deliberately vanilla:
      the only heavy thing in this window is <filex-explorer>, which is the same
      component this project ships to embedders. Nothing here re-implements file
      handling — it mounts the explorer and gets out of the way.

      Layout:
        • a narrow rail down the left with the signed-in accounts (click to
          switch), an "add account" button and a gear for the app's settings
        • everything else is the explorer for the active account
    -->
    <!-- gorunum:v2-desktop — the product's stylesheet, loaded BEFORE this
         window paints anything.

         ⚠⚠ It is not here for the `.fe-*` rules (the explorer injects those
         itself on first registration). It is here for the `:root` custom
         properties. Without it the shell's first frame — the boot surface,
         which is drawn before `filex.js` has even been parsed — resolves every
         `var(--fe-*)` to nothing, and the window opens as a black-on-black
         rectangle for as long as the bundle takes to load.

         Same origin, same file the bundle carries (`sync-web.mjs` copies it
         into app/), so this cannot drift from the tokens the explorer uses. -->
    <link rel="stylesheet" href="style.css" />
    <script>
      // ── which variant paints, decided BEFORE the first frame ──────────
      //
      // The mode is the PRODUCT's preference, not the OS's: the explorer's
      // theme gallery writes `filex.thememode` (packages/core/src/lib/themes.ts)
      // and this window has to agree with the file list it wraps — measured on
      // 2026-09-12, the explorer went dark and the app's settings surface
      // stayed white.
      //
      // ⚠ Inline and synchronous on purpose. Doing this from the module below
      // would paint one frame of the light palette first, which is the flash
      // this file already fights in two other places.
      //
      // ⚠ `'host'` (the default) means "whatever the embedder passed" — this
      // window passes `theme: 'auto'`, so host and auto resolve the same way
      // here. Once the explorer is mounted, a MutationObserver copies whatever
      // it actually resolved (see adoptExplorerTheme) rather than re-deriving
      // it, so the two can never disagree.
      (function () {
        var mode = 'host';
        try { mode = localStorage.getItem('filex.thememode') || 'host'; } catch (e) { /* blocked */ }
        var dark = mode === 'dark'
          || (mode !== 'light' && window.matchMedia
              && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>
      /* gorunum:v2-desktop — the shell's own chrome, drawn with the PRODUCT's
         tokens (packages/core/src/styles/variables.css) and nothing else.
         There is no second palette in this file: `--fe-*` is the whole
         vocabulary, so a theme or a palette picked in the file list repaints
         the rail, the settings surface and the boot screen for free.

         ⚠ The one thing that is NOT a token is `--rail`: the width of this
         app's account rail is a layout constant of a surface the shared
         package does not have, and inventing `--fe-rail-width` in a file the
         package cannot see would be a token in name only. */
      :root {
        --rail: 64px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }

      /* ── scrollbars ───────────────────────────────────────────────
         The platform default is a wide light-grey bar that ignores the theme
         entirely: on the chrome it reads as a bright stripe glued to the edge
         of a themed panel. Chromium honours BOTH the standard properties and
         the -webkit pseudo-elements; the standard ones are declared first so
         the rules survive a future engine that drops the prefixed set, and the
         pseudo-elements do the fine work (rounded thumb, transparent track, no
         arrow buttons) that `scrollbar-width` cannot express.

         ⚠ Mixed from `--fe-text` rather than written as a grey: the thumb has
         to stay legible on every palette, and a fixed rgba() that reads
         correctly on the stock white is invisible on Terminal Green. */
      * {
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--fe-text) 26%, transparent) transparent;
      }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--fe-text) 26%, transparent);
        /* Inset by a transparent border rather than by width: a narrower thumb
           would sit in a wider gutter and drift away from the content edge. */
        border: 2px solid transparent;
        background-clip: padding-box;
        border-radius: var(--fe-radius);
      }
      *::-webkit-scrollbar-thumb:hover {
        background: color-mix(in srgb, var(--fe-text) 42%, transparent);
        background-clip: padding-box;
      }
      /* Where a vertical and a horizontal bar meet — unstyled, it paints as a
         white square in the corner of a dark panel. */
      *::-webkit-scrollbar-corner { background: transparent; }
      body {
        display: flex;
        flex-direction: column;   /* yeni-pencere:v1 — title bar on top, workspace below */
        /* The explorer's scale, not the platform's: 13px on the product's own
           stack. A 14px system-ui shell around a 13px Inter file list is the
           two-applications look this pass exists to remove. */
        font: var(--fe-text-md) / 1.5 var(--fe-font);
        background: var(--fe-bg);
        color: var(--fe-text);
        overflow: hidden;
      }

      /* ── our own title bar (frameless: the native OS caption is gone) ──────
         A slim, draggable strip; on Windows/Linux it carries our minimize /
         maximize / close in the top-right, on macOS it leaves room on the LEFT
         for the native traffic lights (body.is-mac) and draws no buttons. */
      #titlebar {
        flex: 0 0 34px;
        display: flex;
        align-items: stretch;
        background: var(--fe-bg-elev);
        border-bottom: 1px solid var(--fe-border);
        -webkit-app-region: drag;
        z-index: 220;   /* above #settings / #conn overlays, so it always drags */
      }
      body.is-mac #titlebar { padding-left: 76px; }   /* room for traffic lights */
      #titlebar__brand {
        display: flex; align-items: center; gap: 8px;
        padding: 0 12px; font-size: 12.5px; color: var(--fe-text-muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #titlebar__brand img { height: 16px; width: auto; border-radius: 3px; }
      #winctl {
        margin-left: auto;
        display: flex;
        -webkit-app-region: no-drag;
      }
      body.is-mac #winctl { display: none; }
      #winctl button {
        width: 46px; border: 0; background: transparent;
        color: var(--fe-text-muted); cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background .12s, color .12s;
      }
      #winctl button:hover { background: var(--fe-bg-hover, rgba(128,128,128,.16)); color: var(--fe-text); }
      #winctl button.winctl--close:hover { background: #e53935; color: #fff; }

      /* The workspace = the old body: the account rail beside the main pane. */
      #workspace { flex: 1; min-height: 0; display: flex; }

      /* ── account rail ──────────────────────────────────────────
         The outermost band of the window's chrome, on the SAME elevated ground
         as the explorer's own sidebar beside it, with one hairline against it.

         ⚠ It used to be a fixed near-black (#171c26) in both variants, on the
         argument that contrast is what makes a rail a rail. Measured on
         2026-09-12 that argument had stopped being true in the dark palette:
         #171c26 sits BETWEEN --fe-bg (#15171c) and --fe-bg-elev (#1a1d23), so
         the rail and the sidebar beside it were the same colour and the band
         had no edge at all. In the light palette the same value was a black
         stripe against a white product. A permanently-dark chrome band would
         need a token the shared package does not declare, and inventing a hex
         here is what produced the problem — so the rail follows the ground the
         rest of the chrome uses, and the ACTIVE MARKER carries the contrast. */
      #rail {
        width: var(--rail);
        flex: 0 0 var(--rail);
        background: var(--fe-bg-elev);
        border-right: 1px solid var(--fe-border);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: var(--fe-gap) 0 10px;
        gap: 10px;
        -webkit-app-region: drag;      /* the rail doubles as the title bar */
      }
      #rail * { -webkit-app-region: no-drag; }

      .slot { position: relative; display: flex; justify-content: center; width: 100%; }
      /* Slack's active marker: a bar on the rail's own edge, not a ring around
         the avatar. It survives any avatar colour — and on a light rail it is
         the one thing that has to be the accent, because the ground no longer
         supplies the contrast. */
      .slot.active::before {
        content: '';
        position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        width: 3px; height: 26px; border-radius: 0 3px 3px 0;
        background: var(--fe-primary);
      }
      .avatar {
        width: 40px; height: 40px;
        border: 0;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: var(--fe-text-md);
        letter-spacing: .02em;
        cursor: pointer;
        color: var(--fe-text-on-primary);
        position: relative;
        border-radius: 50%;
        opacity: .68;
        transition: border-radius .14s ease, opacity .14s ease;
      }
      .avatar:hover { border-radius: var(--fe-radius-lg); opacity: 1; }
      .slot.active .avatar { border-radius: var(--fe-radius-lg); opacity: 1; }
      /* Whether the background work is actually working, visible without
         opening anything. The ring is the rail's own ground, so the dot reads
         as cut out of it rather than stuck on top. */
      .avatar .dot {
        position: absolute; right: -1px; bottom: -1px;
        width: 12px; height: 12px; border-radius: 50%;
        border: 2.5px solid var(--fe-bg-elev);
      }
      .dot.ok { background: var(--fe-ok); }
      .dot.err { background: var(--fe-danger); }

      .rail-btn {
        width: 40px; height: 40px; border-radius: 50%; border: 0;
        background: var(--fe-bg-hover);
        color: var(--fe-text-muted);
        cursor: pointer;
        display: grid; place-items: center;
        padding: 0;
        transition: background .14s ease, color .14s ease, border-radius .14s ease;
      }
      /* ⚠ SVG, not a text glyph. `⚙` and `+` are drawn against the font's own
         baseline, so `place-items: center` centres the LINE BOX and the shape
         still sits low and slightly left — visibly off in a 40px circle. An
         icon with its own viewBox has no baseline to fight. */
      .rail-btn svg { width: 18px; height: 18px; display: block; }
      .rail-btn:hover {
        background: var(--fe-primary-soft);
        color: var(--fe-primary);
        border-radius: var(--fe-radius-lg);
      }
      .rail-sep { width: 28px; height: 1px; background: var(--fe-border); margin: 2px 0; }
      .spacer { flex: 1; }

      /* ── the application's own mark — NOT HERE ANY MORE ───────────
         It used to lead the rail, on the rule that something must always name
         the app and it must not be the selected account's badge. That rule is
         intact; the mark moved to where the product puts it.

         gorunum:v3-shell gave the explorer's top bar a brand corner, and this
         window fills it (`config.brand`, see brandMarkUrl). Photographed
         2026-09-13 with BOTH drawn: the rail's 32px mark and the top bar's
         22px mark + "filex" wordmark sat about 60px apart on the same row —
         the same logo twice, which is the duplicate this wave removes, and the
         most visible kind because it is the product's identity.

         The top bar's keeps the job: it carries the WORDMARK as well, it is
         the shared component's own corner rather than this app's copy of it,
         and it cannot fold away here — it hides only below 560px of explorer
         width, and this window's 720px minimum leaves 656px after the rail.
         The boot surfaces still draw the mark full size, so the states that
         replace the explorer name the app too. */

      /* ── a server's own logo, ON its row ──────────────────────────
         Each row is a server (a tenant), so the logo its admin set under
         Branding is the truest label it can carry — better than initials
         derived from an e-mail address, which is what somebody's ACCOUNT is
         called, not what the install is called.
         `contain` on a light plate: logos are authored for white pages, and a
         dark-on-dark mark against the rail would render as an empty square. */
      .avatar--brand {
        background: #ffffff;
        padding: 4px;
        overflow: hidden;
        border: 1px solid var(--fe-border);
        /* ⚠ Always the rounded square, never the circle the initials use.
           Logo artwork is authored square: a 50% radius eats its corners, and
           a mark that only looks right while its row is selected is not a mark.
           Which row is active is already said by the bar on the rail's edge. */
        border-radius: var(--fe-radius-lg);
      }
      .avatar--brand img {
        max-width: 100%; max-height: 100%;
        object-fit: contain;
        display: block;
        /* The plate rounds with the avatar; without this the artwork's own
           corners poke through the animated radius. */
        border-radius: inherit;
      }

      /* ── main ────────────────────────────────────────────────── */
      #main { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
      filex-explorer { display: block; flex: 1; min-height: 0; }

      /* ── boot surface ────────────────────────────────────────────
         What fills the window between "the app opened" and "the files are
         listed". It used to be a dashed grey box pinned to the top-left
         corner of an otherwise blank white window, which reads as a broken
         layout rather than as work in progress. It is a whole surface now,
         centred, on the app's own background, and it says WHICH server it is
         waiting for — the one fact that makes waiting tolerable. */
      #boot {
        position: absolute; inset: 0;
        display: none;
        place-items: center;
        background: var(--fe-bg);
        padding: 24px;
        text-align: center;
      }
      #boot.on { display: grid; }
      .boot__inner { max-width: 380px; display: grid; justify-items: center; gap: 6px; }
      /* ⚠ The mark is the app's own logo, drawn at its own size — not a glyph
         on a coloured plate. The plate was a second blue behind a white
         outline, which is two marks for one application. */
      .boot__mark {
        width: 56px; height: 56px; margin-bottom: var(--fe-gap);
        display: grid; place-items: center;
      }
      .boot__mark svg { width: 56px; height: 56px; display: block; }
      /* The server's own logo replaces the generic mark. A white plate with a
         hairline, like the rail's: a brand mark on top of somebody else's
         brand colour is two logos. */
      .boot__mark--brand {
        background: #ffffff;
        border: 1px solid var(--fe-border);
        border-radius: var(--fe-radius-lg);
        box-shadow: var(--fe-shadow-sm);
        padding: 8px;
      }
      .boot__mark--brand img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
      .boot__title { font-size: 15px; font-weight: 600; }
      .boot__sub { color: var(--fe-text-muted); font-size: var(--fe-text-md); overflow-wrap: anywhere; }
      /* An indeterminate bar, not a spinner: it fills the same width as the
         text above it, so the surface stays a single centred column. */
      .boot__bar {
        margin-top: var(--fe-gap-lg); width: 190px; height: 3px; border-radius: 2px;
        background: var(--fe-border); overflow: hidden; position: relative;
      }
      .boot__bar::after {
        content: ''; position: absolute; inset: 0 auto 0 0; width: 40%;
        border-radius: 2px; background: var(--fe-primary);
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar::after { animation: none; width: 100%; opacity: .5; }
      }
      .boot__err {
        margin-top: 14px; padding: var(--fe-gap-sm) var(--fe-gap); border-radius: var(--fe-radius);
        background: var(--fe-bg-elev); border: 1px solid var(--fe-danger);
        color: var(--fe-danger); font-size: var(--fe-text-sm); overflow-wrap: anywhere; text-align: left;
      }
      .boot__actions { margin-top: var(--fe-gap-lg); display: flex; gap: var(--fe-gap-sm); }

      /* ── storage connections ─────────────────────────────────────
         A full surface, not a card inside Settings: the shared panel
         carries its own tabs, a driver-driven form and a page of client
         instructions, and folding that into a scrolling settings column
         makes both unreadable.

         ⚠ Above #settings (200) — it is opened FROM settings, and the
         folder picker below already made exactly this mistake once: the
         dialog was there, just underneath the surface that launched it. */
      #conn {
        position: absolute; inset: 0; background: var(--fe-bg);
        overflow: auto; padding: 26px 30px 40px; display: none;
        z-index: 210;
      }
      #conn.open { display: block; }
      /* The component draws its own chrome; it only needs the reading
         width the rest of this window uses. */
      #conn-host { max-width: 940px; }

      #settings {
        position: absolute; inset: 0; background: var(--fe-bg);
        overflow: auto; display: none;
        /* ⚠ Above anything the explorer puts on the page. Its onboarding tour is
           appended to document.body at z-index 96 and its menus are fixed too,
           so a panel in the normal stacking order gets covered by them. */
        z-index: 200;
      }
      #settings.open { display: block; }
      /* ⚠ Hiding #explorer-host is NOT enough: .fe-tour is a child of <body>,
         not of the explorer, so it survives its host being hidden and lands in
         the middle of Settings — measured, twice. */
      body.settings-open .fe-tour { display: none !important; }

      /* ── the app's settings ──────────────────────────────────────
         Same control vocabulary as the product's user-settings dialog
         (web/src/components/UserSettingsModal.vue): grouped cards on the
         elevated ground, 34px controls, 12/12.5/13px text, a segmented strip
         for a choice and a real switch for a yes/no. The two surfaces answer
         different questions — that one owns the PERSON's preferences, this one
         owns what this COMPUTER does — but a person moving between them should
         not be able to tell they were built by different hands.

         ⚠ One scrolling column, not the dialog's rail-and-panes. Two measured
         reasons: this surface has fourteen rows where the dialog has forty, so
         four panes in a 1280px window would each be mostly empty; and four
         end-to-end suites (openwith, portable, connections, lang) assert
         against `#settings` innerText, which excludes text in a hidden pane —
         splitting it would have made them report missing cards that are one
         click away. The reading width is capped instead, which is what the
         panes were for. */
      .set {
        max-width: 760px;
        padding: 26px 30px 48px;
      }
      .set__head {
        display: flex;
        align-items: flex-start;
        gap: var(--fe-gap);
        padding-bottom: var(--fe-gap);
        margin-bottom: var(--fe-gap-lg);
        border-bottom: 1px solid var(--fe-border-soft);
      }
      .set__head-text { flex: 1 1 auto; min-width: 0; }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--fe-text);
      }
      .sub {
        margin: 2px 0 0;
        font-size: var(--fe-text-xs);
        color: var(--fe-text-muted);
      }
      h2 {
        margin: 26px 0 var(--fe-gap-sm);
        font-size: var(--fe-text-xs);
        font-weight: 700;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: var(--fe-text-muted);
      }
      .card {
        border: 1px solid var(--fe-border);
        border-radius: var(--fe-radius);
        padding: var(--fe-gap) 14px;
        margin-bottom: var(--fe-gap-sm);
        background: var(--fe-bg-elev);
      }
      .between { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .row { display: flex; gap: var(--fe-gap-sm); align-items: center; }
      .label { font-size: var(--fe-text-sm); font-weight: 500; color: var(--fe-text); }
      .muted { color: var(--fe-text-muted); font-size: var(--fe-text-xs); }
      .err { color: var(--fe-danger); }
      .ok { color: var(--fe-ok); }
      code {
        background: var(--fe-bg-hover);
        padding: 1px 5px;
        border-radius: var(--fe-radius-sm);
        font-family: var(--fe-font-mono);
        font-size: var(--fe-text-xs);
      }

      /* ── controls, in the dialog's exact metrics ─────────────────── */
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--fe-gap-xs);
        height: var(--fe-h-md);
        padding: 0 var(--fe-gap);
        border: 1px solid var(--fe-border-strong);
        border-radius: var(--fe-radius);
        background: var(--fe-bg);
        color: var(--fe-text);
        font: inherit;
        font-size: var(--fe-text-sm);
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover:not(:disabled) { background: var(--fe-bg-hover); }
      button:disabled { opacity: .55; cursor: not-allowed; }
      button.primary {
        border-color: var(--fe-primary);
        background: var(--fe-primary);
        color: var(--fe-text-on-primary);
      }
      button.primary:hover:not(:disabled) { background: var(--fe-primary-hover); }
      button.danger { border-color: var(--fe-border-strong); color: var(--fe-danger); }
      button.danger:hover:not(:disabled) { background: var(--fe-bg-hover); }
      button.link {
        height: auto;
        border: 0;
        background: none;
        color: var(--fe-primary);
        padding: 4px 2px;
        text-decoration: underline;
      }
      button.link:hover:not(:disabled) { background: none; color: var(--fe-primary-hover); }
      .icon-btn {
        flex: 0 0 auto;
        width: var(--fe-h-sm);
        height: var(--fe-h-sm);
        padding: 0;
        border: 0;
        border-radius: var(--fe-radius-md);
        background: transparent;
        color: var(--fe-text-muted);
      }
      .icon-btn:hover:not(:disabled) { background: var(--fe-bg-hover); color: var(--fe-text); }
      input[type="text"] {
        height: var(--fe-h-md);
        padding: 0 10px;
        border-radius: var(--fe-radius);
        border: 1px solid var(--fe-border);
        background: var(--fe-bg);
        color: var(--fe-text);
        font: inherit;
        font-size: var(--fe-text-sm);
        min-width: 260px;
      }
      input[type="text"]:focus { outline: none; border-color: var(--fe-primary); }
      .empty {
        color: var(--fe-text-muted);
        font-size: var(--fe-text-sm);
        padding: 14px;
        border: 1px dashed var(--fe-border-strong);
        border-radius: var(--fe-radius);
        margin-bottom: var(--fe-gap-sm);
      }

      /* A choice between three named answers — the dialog's segmented strip,
         not three loose buttons where the selected one happens to be blue. */
      .segmented {
        display: inline-flex;
        align-self: flex-start;
        border: 1px solid var(--fe-border);
        border-radius: var(--fe-radius);
        overflow: hidden;
      }
      .segmented button {
        height: var(--fe-h-md);
        border: 0;
        border-right: 1px solid var(--fe-border);
        border-radius: 0;
        background: var(--fe-bg);
        color: var(--fe-text-muted);
      }
      .segmented button:last-child { border-right: 0; }
      .segmented button.is-active {
        background: var(--fe-primary-soft);
        color: var(--fe-primary);
      }

      /* A yes/no is a switch. It used to be a button reading "On" — which is a
         control that states the current value where every other one states the
         verb, so nobody could tell whether "On" was the state or the action. */
      .switch {
        flex: 0 0 auto;
        position: relative;
        width: 34px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: var(--fe-border-strong);
        cursor: pointer;
        transition: background 120ms ease;
      }
      .switch:hover:not(:disabled) { background: var(--fe-border-strong); }
      .switch.is-on { background: var(--fe-primary); }
      .switch.is-on:hover:not(:disabled) { background: var(--fe-primary); }
      .switch:disabled { opacity: .55; cursor: not-allowed; }
      .switch__knob {
        position: absolute;
        top: 2px; left: 2px;
        width: 16px; height: 16px;
        border-radius: 999px;
        background: var(--fe-bg);
        transition: transform 120ms ease;
      }

      // `typeof navigator.share === 'function'`, and Electron has no Web Share
      // API — measured, navigator.share is undefined here. So the button that
      // exists in the product simply never rendered in the desktop app.

      // fork of the component, and the day Electron ships Web Share this whole
      // block can go without touching the explorer.
      if (typeof navigator.share !== 'function') {
        navigator.canShare = (d) => !!(d && (d.url || d.text || d.title));

      //
      // ⚠⚠ The rule here is "copy the answer", not "work out the answer
      // again". The explorer resolves the light/dark mode from the preference
      // the theme gallery writes (`filex.thememode`), the host's `theme` prop
      // and the OS, in that order (packages/core/src/lib/themes.ts), and it
      // publishes the result as `fe--theme-dark` / `fe--theme-light` on its own
      // root. Re-deriving it here would be a second implementation of a
      // three-way precedence rule, and the two would disagree on exactly the
      // cases that are hard to see.
      //
      // Measured on 2026-09-12, before this existed: with the preference set to
      // Dark the file list went dark and the app's own settings surface stayed
      // white — a full-window white page inside a dark application.
      //
      // The palette needs no code at all: core injects `:root,.fe{…}` into
      // <head> (syncThemeStyle), so a palette picked in the gallery is already
      // on this document's root by the time anything repaints.
      let reportedGround = null;
      /** The --fe-primary the top bar's mark was last baked with. */
      let brandedWith = null;
      function setDark(dark) {
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        // ⚠ Tell the main process what we ended up painting. It cannot work it
        // out: the mode and the palette live in THIS window's localStorage, and
        // `BrowserWindow.backgroundColor` is fixed at construction — before any
        // page exists to ask. Remembering the last ground is what stops the
        // next launch opening as a white rectangle on a dark palette.
        //
        // Read AFTER the class flip and on the next frame, so the value is the
        // variant that is actually live rather than the one being replaced.
        requestAnimationFrame(() => {
          // ⚠ The top bar's mark is an <img>, so its blue is BAKED IN and does
          // not follow the palette on its own — unlike the rail's, which is
          // inline SVG. Re-bake it here or the window goes dark around a mark
          // that stays on the light blue. Guarded on the colour actually
          // changing: reassigning `config` re-renders the explorer.
          const primary = getComputedStyle(document.documentElement)
            .getPropertyValue('--fe-primary').trim();
          if (explorer && primary && primary !== brandedWith) {
            brandedWith = primary;
            explorer.config = {
              ...explorer.config,
              brand: { ...(explorer.config?.brand ?? {}), markUrl: brandMarkUrl() },
            };
          }
          const bg = getComputedStyle(document.documentElement).getPropertyValue('--fe-bg').trim();
          if (!bg || bg === reportedGround) return;
          reportedGround = bg;
          void window.filexApp.setSettings({ themeBg: bg });
        });

      /** What the stored preference resolves to with no explorer on screen —
       *  the boot surfaces draw before one is mounted, and the sign-in window
       *  never has one. Same precedence as core's, for the two values that can
       *  be answered without it. */
      function darkFromPreference() {
        let mode = 'host';
        try { mode = localStorage.getItem('filex.thememode') || 'host'; } catch { /* blocked */ }
        if (mode === 'dark') return true;
        if (mode === 'light') return false;
        return !!window.matchMedia?.('(prefers-color-scheme: dark)').matches;
      }
      let themeWatch = null;
      let themeWatchTimer = null;
      /** Mirror the mounted explorer's resolved mode onto <html>, and keep
       *  mirroring it — the gallery repaints in place, with no reload. */
      function adoptExplorerTheme(el) {
        themeWatch?.disconnect();
        themeWatch = null;
        clearTimeout(themeWatchTimer);
        themeWatchTimer = null;
        if (!el) { setDark(darkFromPreference()); return; }

        // ⚠⚠ ONE node, its `class` attribute, and nothing else.
        //
        // The first version of this observed the host element with
        // `{ subtree: true, childList: true }`, because the `.fe` root does not
        // exist until Vue has mounted. That is a watcher on every row the file
        // list renders: the callback ran on each listing repaint, each menu
        // open, each keystroke in the search field, and its read forced a style
        // recalculation every time. Measured 2026-09-12 — keep-e2e, which
        // drives long listings and waits on a real sync, went from green to 16
        // failures on timeouts alone.
        //
        // So: find `.fe` once, by polling for it, then watch that node and only
        // that node. `class` on `.fe` is exactly where the explorer publishes
        // its resolved mode, and it changes only when somebody changes the
        // theme.
        const apply = (fe) => {

          // it leaves both off and lets its own media query decide, so the OS
          // is the answer in that case.

          else if (fe.classList.contains('fe--theme-light')) setDark(false);

        // the same one core will reach for every value except 'host'.
        setDark(darkFromPreference());

        const attach = () => {
          const fe = el.querySelector('.fe');

            // problems than its chrome's palette, and the fallback above is
            // already on screen.
            if (++tries > 100) return;
            themeWatchTimer = setTimeout(attach, 100);
            return;
          }

          themeWatch = new MutationObserver(() => apply(fe));
          themeWatch.observe(fe, { attributes: true, attributeFilter: ['class'] });

        'sync.eta_m':           ['{m} min', '{m} dk'],
