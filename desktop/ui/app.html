        'sync.trash_kept':      ['Kept for 30 days:', '30 gün saklanıyor:'],
        'sync.trash_empty':     ['Nothing has been removed by sync.', 'Eşitleme hiçbir şey silmedi.'],

        'pick.title':           ['Choose a folder on the server', 'Sunucuda bir klasör seç'],
        'pick.storages':        ['Storages on this server', 'Bu sunucudaki depolar'],
        'pick.loading':         ['Loading…', 'Yükleniyor…'],
        'pick.empty':           ['No folders here.', 'Burada klasör yok.'],
        'pick.up':              ['Up', 'Üst klasör'],
        'pick.use':             ['Sync this folder', 'Bu klasörü eşitle'],
        'pick.close':           ['Close', 'Kapat'],
        'pick.pick_storage':    ['Open a storage first, then choose a folder inside it.',
                                 'Önce bir depo aç, sonra içindeki klasörü seç.'],
      };
      function T(key, vars) {
        const entry = STRINGS[key];
        let s = entry ? (LANG === 'tr' ? entry[1] : entry[0]) : key;
        if (vars) for (const [k, v] of Object.entries(vars)) s = s.split(`{${k}}`).join(v);
        return s;
      }

      /**
       * yeni-pencere:v1 — the frameless window's own chrome. On macOS the native
       * traffic lights stay (top-left); we only mark the body so the title bar
       * leaves room and draws no buttons. On Windows/Linux we draw our own
       * minimize / maximize / close in the top-right (#winctl). The strip itself
       * is the drag handle (CSS -webkit-app-region: drag).
       */
      function setupTitlebar() {
        const isMac = !!(window.filexApp && window.filexApp.isMac);
        if (isMac) { document.body.classList.add('is-mac'); return; }
        const ctl = document.getElementById('winctl');
        if (!ctl || ctl.childElementCount) return;
        const S = 'width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.1"';
        const mk = (labelKey, svg, fn, cls) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.dataset.lk = labelKey;   // so relabelStatic() can retranslate it
          b.title = T(labelKey);
          b.setAttribute('aria-label', T(labelKey));
          if (cls) b.className = cls;
          b.innerHTML = svg;
          b.addEventListener('click', fn);
          return b;
        };
        ctl.appendChild(mk('win.minimize', `<svg ${S}><line x1="1" y1="6" x2="10" y2="6"/></svg>`, () => window.filexApp.winMinimize()));
        ctl.appendChild(mk('win.maximize', `<svg ${S}><rect x="1.2" y="1.2" width="8.6" height="8.6" rx="1"/></svg>`, () => window.filexApp.winToggleMaximize()));
        ctl.appendChild(mk('win.close', `<svg ${S}><line x1="1.5" y1="1.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="1.5" x2="1.5" y2="9.5"/></svg>`, () => window.filexApp.winClose(), 'winctl--close'));
      }

      const $ = (sel, root = document) => root.querySelector(sel);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const host = (u) => { try { return new URL(u).host; } catch { return u; } };
      const initials = (email) => (email || '?').replace(/@.*/, '').slice(0, 2).toUpperCase();

      let state = { accounts: [], activeId: null, syncFolders: [], syncStatuses: [] };
      let explorer = null;
      let explorerSyncCb = null;
      // Drag-out preparation progress — one subscriber, refreshed on mount.
      let explorerDragCb = null;
      let mountedFor = null;

      // ── the explorer ──────────────────────────────────────────
      // Mounted once per account. `auth.token` is a FUNCTION, which the component
      // supports: the credential is fetched from the main process at call time
      // rather than being handed to this page up front and kept lying around.
      // The application's own mark — the same folder-and-check the web app uses
      // (web/src/components/LogoMark.vue), so the desktop and the browser are
      // recognisably one product. Fixed: it says filex, never which server.
      // gorunum:v1 — flat product blue, not the old indigo→violet gradient.
      // The fill is the palette's own `--fe-primary`, exactly as
      // web/src/components/LogoMark.vue does it, so the mark is #2f6ceb on the
      // light variant and #5b8cff on the dark one and it follows any theme the
      // product ever ships.
      //
      // ⚠ The literal after the comma is a floor, not the value in use: `fill`
      // has no inherited value to fall back to, so a context where the
      // stylesheet has not loaded would paint the mark BLACK rather than blue.
      // This window loads it in <head> (see the <link> above), so the token
      // always wins — measured 2026-09-12, computed fill rgb(47,108,235).
      const ICON_APP =
        '<svg viewBox="0 0 32 32" aria-hidden="true">' +
        '<rect width="32" height="32" rx="8" fill="var(--fe-primary, #2f6ceb)"/>' +
        '<path d="M7 11a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V11z" ' +
        'fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>' +
        '<path d="M11.5 17.5l3 2.5 5.5-6" fill="none" stroke="#fff" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>';

      /**
       * The SAME mark, as something an `<img src>` can load — for the
       * explorer's own top bar (`config.brand`, gorunum:v3-shell).
       *
       * ⚠⚠ Why config and not a slot: a host that mounts `<filex-explorer>`
       * cannot fill ANY slot in it. Vue projects light DOM into a custom
       * element only through a native `<slot>` inside a shadow root, and this
       * element is deliberately `shadowRoot: false` because the whole product
       * look is one global stylesheet. Measured from this window before the
       * config field existed: the trailing cluster's `header-actions` slot
       * counted 0 children no matter what was put in the element.
       *
       * Derived from ICON_APP rather than pasted as a second blob, so the boot
       * surface and the top bar cannot drift into two different logos.
       *
       * ⚠ Three things an inline SVG gets for free and a data: URI does not:
       *   · `xmlns` — the HTML parser supplies it for inline SVG; a standalone
       *     SVG document without it does not render at all.
       *   · custom properties — an SVG loaded as an IMAGE is its own document
       *     and cannot see this page's `--fe-primary`, so the fill has to be
       *     the RESOLVED colour, baked in, and re-baked when the mode changes
       *     (see setDark). Left as `var()` it would silently paint the light
       *     blue on a dark window.
       *   · a literal `#` — it opens a fragment inside a data: URI, and the
       *     colour is `#2f6ceb`. base64 sidesteps that entirely.
       */
      function brandMarkUrl() {
        const primary = getComputedStyle(document.documentElement)
          .getPropertyValue('--fe-primary').trim() || '#2f6ceb';
        const svg = ICON_APP
          .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')
          .replace('var(--fe-primary, #2f6ceb)', primary);
        return 'data:image/svg+xml;base64,' + btoa(svg);
      }

      // ── the server's identity ─────────────────────────────────
      // Branding (logo + name) is a property of the SERVER, so it is fetched per
      // account and cached for the life of the window. One request per account,
      // never per repaint: renderRail() runs on every sync tick.
      const brands = new Map();

      /** Cached branding for an account, or null while unknown. */
      function brandOf(accountId) {
        const b = brands.get(accountId);
        return b && b.logoUrl ? b : null;
      }

      /**
       * The MAIN window's title = the active server's whitelabel NAME, or the
       * product name "filex" when that server sets no branding. A DOCUMENT opens
       * in its own window (openDoc → main process), whose page titles itself with
       * the file name — so this only ever names the explorer window.
       */
      function applyWindowTitle() {
        const b = brands.get(state.activeId);
        document.title = (b && b.name) ? b.name : 'filex';
      }

      /** Per-machine open gesture: 'single' or 'double' (default). Touch is
       *  never governed by this — a tap always opens. Settings toggles it and
       *  remounts the explorer. */
      function openTriggerPref() {
        try {
          return localStorage.getItem('filex.openTrigger') === 'single' ? 'single' : 'double';
        } catch { return 'double'; }
      }

      async function loadBrand(account) {
        if (!account || brands.has(account.id)) return;
        brands.set(account.id, { name: '', logoUrl: '' });   // claim the slot
        try {
          const b = await window.filexApp.branding(account.id);
          brands.set(account.id, b || { name: '', logoUrl: '' });
          if (account.id === state.activeId) applyWindowTitle();
          if (b && b.logoUrl) { renderRail(); repaintBoot(); }
        } catch {
          // A server with no branding set, or an older build without the
          // endpoint, is not a failure — it just has no mark to show.
        }
      }

      /** The surface shown while there is nothing else to show. */
      let bootHtml = null;
      function showBoot(html) {
        bootHtml = html;
        const brand = brandOf(state.activeId);
        // The server's own mark on the waiting screen too: this surface is
        // showing WHICH server is being waited for, and the logo is the fastest
        // way to say it.
        const mark = brand
          ? `<div class="boot__mark boot__mark--brand"><img src="${esc(brand.logoUrl)}" alt=""></div>`
          // ⚠ The application's real logo, not a white glyph on a blue plate.
          // The plate was drawn from the shell's own accent, which made it a
          // SECOND blue mark for an application that already has one — and one
          // that changed colour with the palette, which a logo must not.
          : `<div class="boot__mark">${ICON_APP}</div>`;
        const b = $('#boot');
        b.innerHTML = `<div class="boot__inner">${mark}${html}</div>`;
        b.classList.add('on');
      }
      /** Re-paints the boot surface in place — used when branding lands after
       *  the surface is already up, which is the normal ordering. */
      function repaintBoot() {
        if (bootHtml !== null && $('#boot').classList.contains('on')) showBoot(bootHtml);
      }
      function hideBoot() {
        bootHtml = null;
        $('#boot').classList.remove('on');
        $('#boot').innerHTML = '';
      }

      /**
       * Where a clicked notification asked us to land: `{ storage, folder,
       * select }` from the shared resolver (web/src/lib/notificationTarget.ts,
       * imported by the main process — this page never works it out itself).
       * Consumed by the next mountExplorer() and then cleared.
       */
      let pendingReveal = null;

      /**
       * Select one row inside the listing that is already on screen.
       *
       * ⚠ Compared attribute-by-attribute rather than through a
       * `[data-fe-path="…"]` selector: a real file name may contain a quote or
       * a backslash, and a selector built by concatenation breaks on exactly
       * those names. The click goes through the component's own row handler,
       * so the selection behaves afterwards as if a hand had made it.
       */
      async function revealRow(qualified) {
        if (!qualified) return false;
        const deadline = Date.now() + 8000;
        // ⚠⚠ The selection has to STICK. The listing clears it when its load
        // finishes, which is after the first rows are on screen — so a reveal
        // that returns on the first success is a coin toss (measured in the
        // browser; same fix as web/src/views/Explore.vue). Re-click whenever
        // it is found unselected, stop once it has survived three checks.
        let stable = 0;
        while (Date.now() < deadline) {
          const row = Array.from(document.querySelectorAll('[data-fe-path]'))
            .find((el) => el.getAttribute('data-fe-path') === qualified);
          if (row && row.getAttribute('aria-selected') === 'true') {
            if (++stable >= 3) return true;
          } else {
            stable = 0;
            if (row) {
              row.scrollIntoView({ block: 'center' });
              row.dispatchEvent(new MouseEvent('click', { bubbles: true }));
            }
          }
          await new Promise((r) => setTimeout(r, 200));
        }
        return false;
      }

      /**
       * The server refused this account's token (revoked or expired). The
       * main process has already stopped its sync and its bell; this surface
       * says so and offers the two things that can help. Reconnect is the
       * browser sign-in again for the same server — it keeps the account's
       * synced folders, which signing out and back in would not.
       */
      function showSignedOut(account) {
        const slot = $('#explorer-host');
        slot.innerHTML = '';
        explorer = null;
        mountedFor = 'signedout:' + account.id;
        adoptExplorerTheme(null);
        showBoot(
          `<div class="boot__title">${esc(T('boot.signed_out', { host: host(account.serverUrl) }))}</div>` +
          `<div class="boot__sub">${esc(account.email)}</div>` +
          `<div class="boot__sub">${esc(T('boot.signed_out_sub'))}</div>` +
          `<div class="boot__actions">` +
          `<button class="primary" id="boot-reconnect">${esc(T('boot.reconnect'))}</button>` +
          `<button id="boot-signout">${esc(T('set.signout'))}</button>` +
          `</div>`,
        );
        $('#boot-reconnect').addEventListener('click', () => { void window.filexApp.reconnect(account.id); });
        $('#boot-signout').addEventListener('click', async () => {
          state = await window.filexApp.signOut(account.id);
          mountedFor = null;
          render();
        });
      }

      async function mountExplorer(account) {
        const slot = $('#explorer-host');
        if (!account) {
          slot.innerHTML = '';
          explorer = null; mountedFor = null;
          // No explorer to copy from — fall back to the stored preference so
          // the boot surface is still the right variant.
          adoptExplorerTheme(null);
          showBoot(
            `<div class="boot__title">${esc(T('boot.no_account'))}</div>` +
            `<div class="boot__sub">${esc(T('boot.no_account_sub'))}</div>` +
            `<div class="boot__actions"><button class="primary" id="boot-add">${esc(T('boot.add'))}</button></div>`,
          );
          $('#boot-add').addEventListener('click', () => window.filexApp.addAccount());
          return;
        }
        // ⚠ Before the "already mounted" check: an explorer that is on screen
        // when the server refuses its token has to be taken down, not left
        // answering every click with an error.
        if (account.signedOut) {
          if (mountedFor !== 'signedout:' + account.id) showSignedOut(account);
          return;
        }
        if (mountedFor === account.id) return;
        mountedFor = account.id;
        slot.innerHTML = '';
        showBoot(
          `<div class="boot__title">${esc(T('boot.connecting', { host: host(account.serverUrl) }))}</div>` +
          `<div class="boot__sub">${esc(account.email)}</div>` +
          '<div class="boot__bar"></div>',
        );

        // ⚠ The drives root mirrors the list we hand over — it does NOT go and
        // find the storages itself. Mounting without this produced an empty "/"
        // that never even asked the server for a listing, which reads as a dead
        // connection rather than a missing option.
        let storages = [];
        try {
          storages = await window.filexApp.storages(account.id);
        } catch (e) {
          if (mountedFor !== account.id) return;
          // A 401 is not "unreachable": the main process has marked the
          // account, and Try again could never work. Ask it rather than
          // parsing the message.
          try { state = await window.filexApp.getState(); } catch { /* keep what we had */ }
          if (mountedFor !== account.id) return;
          const now = (state.accounts || []).find((a) => a.id === account.id);
          if (now && now.signedOut) { renderRail(); showSignedOut(now); return; }
          showBoot(
            `<div class="boot__title">${esc(T('boot.unreachable', { host: host(account.serverUrl) }))}</div>` +
            `<div class="boot__sub">${esc(T('boot.unreachable_sub'))}</div>` +
            `<div class="boot__err">${esc(e.message || e)}</div>` +
            // ⚠ One action. This surface used to offer "Settings" beside it,
            // 40px from the rail's gear, which is on screen in this exact state
            // — two controls for one job, in one view. The gear survives
            // because it is there in every other state too.
            `<div class="boot__actions"><button class="primary" id="boot-retry">${esc(T('boot.retry'))}</button></div>`,
          );
          $('#boot-retry').addEventListener('click', () => { mountedFor = null; void mountExplorer(account); });
          return;
        }
        if (mountedFor !== account.id) return;   // switched away while loading

        hideBoot();
        slot.innerHTML = '';
        explorer = document.createElement('filex-explorer');
        explorer.style.cssText = 'display:block;flex:1;min-height:0';
        explorer.config = {
          apiBase: account.serverUrl,
          auth: { kind: 'bearer', token: () => window.filexApp.token(account.id) },
          storages,
          multiStorageRoot: storages.length > 1,
          // gorunum:v3-shell — the product mark and wordmark at the far left
          // of the top bar. Without this the desktop window's top-left corner
          // is blank while the web app's is not: the same product, shipped two
          // ways, with a logo in only one of them. See brandMarkUrl().
          brand: { name: 'filex', markUrl: brandMarkUrl() },
          // One storage does not deserve a drive-picker in front of it: open the
          // files. More than one, and the root listing is the useful landing.
          // ⚠ A notification click wins over the default landing folder. The
          // component reads initialPath once, at construction, and this window
          // persists no path (below) — so "go there" means mounting there,
          // which is why openNotification() below remounts rather than poking
          // a live component.
          initialPath: pendingReveal
            ? `${pendingReveal.storage}://${pendingReveal.folder ?? ''}`
            : storages.length === 1 ? `${storages[0].name}://` : undefined,
          // ⚠ Deliberately not persisted. The stored path is a single global
          // key, so remembering it would try to open account A's folder after a
          // switch to account B.
          pathPersist: 'none',
          trashVisible: true,
          theme: 'auto',
          // Host-owned open: every file opens in its OWN window (openDoc below),
          // not the in-page overlay. One "open" path, one instance per document.
          openInHost: true,
          // Mouse open gesture — a per-machine setting (Settings → click). Touch
          // is untouched: a tap always opens. Default: double-click opens.
          openTrigger: openTriggerPref(),
          // One language for the whole window. The component defaults to
          // Turkish, so without this an English desktop showed English chrome
          // around a Turkish file list.
          locale: LANG,
          // Selective sync — folder menus grow "Keep on this computer".
          // The account id is captured HERE, at mount: a rail switch swaps
          // the whole explorer, so these hooks can never cross accounts.
          desktopSync: {
            kept: () => window.filexApp.syncKept(account.id),
            keep: (remote, kind) => window.filexApp.syncKeep(account.id, remote, kind === 'file'),
            unkeep: (remote) => window.filexApp.syncUnkeep(account.id, remote),
            reveal: (remote) => window.filexApp.syncReveal(account.id, remote),
            status: () => window.filexApp.syncStatus(account.id),
            // One subscriber — the mounted explorer. A rail switch remounts
            // and overwrites it, so a stale component never gets poked.
            onChange: (cb) => { explorerSyncCb = cb; },
          },
          // Drag out — onto the desktop / into another app. The browser can drop
          // a single file through its own download path; folders and multi-select
          // want REAL local paths, and this shell prepares them (src/dragout.ts).
          // The account id is captured here, at mount time: switching accounts on
          // the rail rebuilds the explorer from scratch.
          dragOut: {
            prepare: (items) => window.filexApp.dragPrepare(account.id, items),
            start: (items) => window.filexApp.dragStart(account.id, items),
            cancel: () => window.filexApp.dragCancel(),
            onProgress: (cb) => { explorerDragCb = cb; },
          },
        };
        explorer.addEventListener('error', (e) => console.error('[explorer]', e.detail));
        // Host-owned open (config.openInHost above): the explorer emits
        // `file-opened` instead of showing its in-page overlay, and we open the
        // file in its OWN window. The account id is captured at mount, so a rail
        // switch cannot open a file against the wrong server.
        explorer.addEventListener('file-opened', (e) => {
          // ⚠ Vue's defineCustomElement dispatches an emit's arguments as an
          // ARRAY in `detail` — so `file-opened({path,basename})` arrives as
          // `detail:[{path,basename}]`, not `detail:{...}`. Read both shapes.
          const d = Array.isArray(e.detail) ? e.detail[0] : e.detail;
          const path = d && d.path;
          if (path) void window.filexApp.openDoc(account.id, path);
        });
        slot.appendChild(explorer);
        applyWindowTitle();
        // From here on the explorer is the authority on light/dark, and the
        // chrome copies it. Re-pointed on every mount: a rail switch replaces
        // the element, and an observer left on the old one watches a node that
        // is no longer in the document.
        adoptExplorerTheme(explorer);
        if (pendingReveal) {
          const want = pendingReveal.select;
          pendingReveal = null;
          if (want) void revealRow(want);
        }
      }

      /**
       * A native notification was clicked (src/notifications.ts → preload
       * `onNotificationOpen`). The payload is the RESOLVED destination; this
       * function only carries it out. A share never reaches here — the main
       * process sends those to the system browser.
       */
      async function openNotification(payload) {
        const dest = payload && payload.dest;
        if (!dest || dest.kind !== 'folder') return;
        const active = (state.accounts || []).find((a) => a.id === state.activeId);
        // The account may have been switched between the toast and the click.
        if (!active || (payload.accountId && payload.accountId !== active.id)) return;
        pendingReveal = dest;
        // Force a remount: mountExplorer() is a no-op while the same account is
        // already mounted, and the component has no "navigate to" input.
        mountedFor = null;
        await mountExplorer(active);
      }

      // ── rail ──────────────────────────────────────────────────
      /** A stable colour per account, so the same server always looks the same
       *  and two accounts are told apart at a glance rather than by reading.
       *
       *  ⚠ FNV-1a with a final avalanche, not `h * 31`. Measured: `h*31` mod a
       *  10-colour palette used only 5 of the 10 colours across 200 accounts —
       *  the low bits resonate with the modulus. The palette is also ordered so
       *  that neighbouring entries are far apart in hue, because a hash
       *  collision between two similar colours is the failure that matters. */
      function avatarColor(seed) {
        let h = 0x811c9dc5;
        for (let i = 0; i < seed.length; i++) {
          h ^= seed.charCodeAt(i);
          h = Math.imul(h, 0x01000193) >>> 0;
        }
        h ^= h >>> 16; h = Math.imul(h, 0x7feb352d) >>> 0;
        h ^= h >>> 15; h = Math.imul(h, 0x846ca68b) >>> 0;
        // ⚠ `>>> 0` again: XOR yields a SIGNED int, so without it `h % length`
        // goes negative for half of all inputs and the lookup returns
        // undefined — a transparent avatar. Measured: 44% of 1100 accounts.
        h = (h ^ (h >>> 16)) >>> 0;
        const palette = [
          '#4f7ce8', '#c2643a', '#2f9e6e', '#8a5cd6',
          '#a5772a', '#2f8fa8', '#c0466e', '#5b6ad0',
          '#6f8f2a', '#b0503f', '#7a5cc0',
        ];
        return palette[h % palette.length];
      }

      function renderRail() {
        const rail = $('#rail');
        const statusOf = Object.fromEntries((state.syncStatuses || []).map((s) => [s.accountId, s]));
        rail.innerHTML = '';

        // ⚠ No app mark here — the top bar carries it, with the wordmark.
        // See the note where `.appmark` used to be styled. The rail is servers
        // and nothing else now: the rows, the "+", and the gear at the bottom.

        for (const a of state.accounts) {
          const st = statusOf[a.id];
          const slot = document.createElement('div');
          slot.className = 'slot' + (a.id === state.activeId ? ' active' : '');
          const b = document.createElement('button');
          b.className = 'avatar';
          const brand = brandOf(a.id);
          // ⭐ Each row IS a server, so the server's own logo is the truest
          // thing to draw on it — an admin who set one under Branding has
          // already answered "which install is this?". Initials are the
          // fallback for servers that never set a logo, not the default.
          if (brand) {
            b.classList.add('avatar--brand');
            b.title = `${brand.name || host(a.serverUrl)}\n${a.email}\n${host(a.serverUrl)}`;
            const img = document.createElement('img');
            img.src = brand.logoUrl;
            img.alt = brand.name || '';
            // ⚠ A logo URL that does not resolve would leave an empty white
            // plate where an identifiable account used to be — worse than no
            // logo at all. Drop back to the initials.
            img.addEventListener('error', () => {
              brands.set(a.id, { name: brand.name, logoUrl: '' });
              renderRail();
              repaintBoot();
            });
            b.appendChild(img);
          } else {
            b.style.background = avatarColor(a.email + a.serverUrl);
            b.title = `${a.email}\n${host(a.serverUrl)}`;
            b.appendChild(document.createTextNode(initials(a.email)));
          }
          if (st || a.signedOut) {
            const dot = document.createElement('span');
            dot.className = `dot ${a.signedOut || (st && st.lastError) ? 'err' : st && st.running ? 'ok' : ''}`;
            b.appendChild(dot);
          }
          b.addEventListener('click', async () => {
            state = await window.filexApp.switchAccount(a.id);
            render();
          });
          slot.appendChild(b);
          rail.appendChild(slot);
        }

        const add = document.createElement('button');
        add.className = 'rail-btn';
        add.innerHTML = ICON_PLUS;
        add.title = T('rail.add');
        add.addEventListener('click', () => window.filexApp.addAccount());
        rail.appendChild(add);

        const sp = document.createElement('div'); sp.className = 'spacer'; rail.appendChild(sp);

        const sep = document.createElement('div'); sep.className = 'rail-sep'; rail.appendChild(sep);

        const gear = document.createElement('button');
        gear.className = 'rail-btn';
        gear.innerHTML = ICON_GEAR;
        gear.title = T('rail.settings');
        gear.addEventListener('click', () => toggleSettings());
        rail.appendChild(gear);
      }

      // ── settings (the APP's settings, not the server's) ───────
      //
      // ⚠⚠ WHAT IS NOT HERE, AND WHY. This surface owns what this COMPUTER
      // does — the accounts signed in on it, the folders it mirrors, whether it
      // starts with the OS, how it updates. It deliberately carries NO copy of
      // a preference that belongs to the PERSON: theme, palette, density and
      // the row height already have exactly one control each, in the file
      // list's "⋯" menu (Theme, Compact view — measured: they are reachable in
      // this window, packages/core Toolbar.vue `utilityActions`). A second
      // switch here would be a second answer to a question the product has
      // already answered once, which is the thing this whole pass is removing.
      //
      // Language is the exception and it is not a copy: the TRAY MENU is a
      // native menu built in the main process, and nothing in the file list can
      // tell it what language to speak. One control, in the one place that can
      // reach all three surfaces (this window, the tray, the explorer).
      /** The engine's size ('1.2 GiB') with this window's decimal mark. */
      function localSize(s) {
        return LANG === 'tr' ? String(s).replace(/(\d)\.(\d)/, '$1,$2') : String(s);
      }

      /** The engine's estimate in this window's words; its own text when it
       *  said something this window cannot read. */
      function localEta(v) {
        const t = v.etaSeconds;
        if (typeof t !== 'number') return v.eta || '';
        if (t >= 3600) return T('sync.eta_h', { h: String(Math.floor(t / 3600)), m: String(Math.floor((t % 3600) / 60)) });
        if (t >= 60) return T('sync.eta_m', { m: String(Math.round(t / 60)) });
        return T('sync.eta_s', { s: String(t) });
      }

      /** One of the engine's phases, in words, for the folder line — with the
       *  bytes and the time left once the engine reports them. */
      function activityLine(v) {
        if (v.phase === 'transfer' && v.total > 0) {
          let line = T('sync.phase_transfer', { done: String(v.done), total: String(v.total) });
          if (v.bytesDone && v.bytesTotal) {
            line += ', ' + T('sync.phase_bytes', { bytes: localSize(v.bytesDone), size: localSize(v.bytesTotal) });
          }
          if (v.eta) line += ' — ' + T('sync.eta', { eta: localEta(v) });
          return line;
        }
        if (v.phase === 'plan') return T('sync.phase_plan');
        if (v.phase === 'settling') return T('sync.phase_settling');
        return T('sync.phase_inventory');
      }

      /** A bandwidth limit: the presets the main process offers, KiB/s. A
       *  stored value that is not one of them is named rather than hidden. */
      function limitRow(id, current, label, sub) {
        const presets = state.limitPresets || [0];
        const now = Number(current) || 0;
        const custom = !presets.includes(now);
        return `<div class="card"><div class="between">
            <div><div class="label">${esc(label)}</div>
              <div class="muted">${esc(sub)}</div>
              ${custom ? `<div class="muted">${esc(T('set.limit_custom', { n: String(now) }))}</div>` : ''}</div>
            <div class="segmented">${
              presets.map((kib) => `<button data-${id}="${kib}"${
                now === kib ? ' class="is-active" aria-pressed="true"' : ' aria-pressed="false"'
              }>${esc(kib === 0 ? T('set.limit_none') : T('set.limit_mb', { n: String(kib / 1024) }))}</button>`).join('')
            }</div>
          </div></div>`;
      }

      function settingsHtml() {
        const active = state.accounts.find((a) => a.id === state.activeId);

        /** A yes/no row: the label, what it means, and a switch that shows the
         *  state instead of a button whose text is the state. */
        const toggle = (id, on, label, sub, disabled) => `
          <div class="card"><div class="between">
            <div><div class="label">${esc(label)}</div>
              <div class="muted">${esc(sub)}</div></div>
            <button id="${id}" class="switch${on ? ' is-on' : ''}" role="switch"
              aria-checked="${on ? 'true' : 'false'}" aria-label="${esc(label)}"
              ${disabled ? 'disabled' : ''}><span class="switch__knob"></span></button>
          </div></div>`;

        const accounts = state.accounts.length ? state.accounts.map((a) => `
          <div class="card"><div class="between">
            <div style="min-width:0">
              <div class="label">${esc(a.email)}</div>
              <div class="muted" style="overflow-wrap:anywhere">${esc(a.serverUrl)}</div>
              ${a.signedOut ? `<div class="muted err">${esc(T('set.signed_out'))}</div>` : ''}
            </div>
            <div class="row">
              <button class="link" data-admin="${a.id}">${esc(T('set.admin'))}</button>
              ${a.signedOut ? `<button class="primary" data-reconnect="${a.id}">${esc(T('set.reconnect'))}</button>` : ''}
              <button class="danger" data-signout="${a.id}">${esc(T('set.signout'))}</button>
            </div>
          </div></div>`).join('') : `<div class="empty">${esc(T('set.no_accounts'))}</div>`;

        const pairs = state.syncFolders.length ? state.syncFolders.map((f) => {
          const acc = state.accounts.find((a) => a.id === f.accountId);
          // What to say is decided in the main process (src/sync-policy.ts
          // pairView); this only puts it into words.
          const v = f.view || { kind: 'starting' };
          let line = T('sync.waiting'), cls = 'muted';
          switch (v.kind) {
            case 'paused': line = T('sync.paused'); break;
            case 'signed-out': line = T('sync.signed_out'); cls = 'err'; break;
            case 'active': line = activityLine(v); cls = 'ok'; break;
            case 'window': line = T('sync.window_wait', { window: v.window.replace('-', '–') }); break;
            case 'error': line = v.message; cls = 'err'; break;
            case 'watching': line = T('sync.watching'); cls = 'ok'; break;
            case 'stopped': line = T('sync.stopped'); cls = 'err'; break;
          }
          return `
          <div class="card"><div class="between">
            <div style="min-width:0">
              <div><code>${esc(f.remotePath)}</code></div>
              <div class="muted" style="overflow-wrap:anywhere">↔ ${esc(f.localPath)}</div>
              <div class="muted">${esc(acc ? acc.email : T('set.unknown_account'))}</div>
              <div class="muted ${cls}">${esc(line)}</div>
            </div>
            <div class="row">
              <button data-openlocal="${esc(f.localPath)}">${esc(T('set.open_folder'))}</button>
              <button class="danger" data-rmsync="${f.id}">${esc(T('set.stop_sync'))}</button>
            </div>
          </div></div>`;
        }).join('') : `<div class="empty">${esc(T('set.no_folders'))}</div>`;

        const engineWarning = state.syncEngine === 'missing'
          ? `<div class="card"><div class="err">${esc(T('set.no_engine'))}</div></div>` : '';

        return `
        <div class="set">
          <div class="set__head">
            <div class="set__head-text">
              <h1>${esc(T('set.title'))}</h1>
              <p class="sub">${esc(T('set.sub'))}</p>
            </div>
            <button class="icon-btn" id="close-settings" aria-label="${esc(T('set.close'))}"
              title="${esc(T('set.close'))}">${ICON_X}</button>
          </div>

          <h2>${esc(T('set.accounts'))}</h2>
          ${accounts}
          <!-- ⚠ No "Add an account" button here. The rail's + is the app's one
               door to adding one and it is on screen at every moment, including
               this one; a second button in the list would be the duplicate this
               pass is removing. The hint names the survivor so nobody has to
               hunt for it. -->
          <p class="muted">${esc(T('set.add_hint'))}</p>

          <h2>${esc(T('set.connections'))}</h2>
          <!-- ⚠ ONE button, not two. "How to connect" used to sit beside it and
               open the same shared panel on its other tab — and the file list's
               own sidebar already has a "How to connect" entry that opens that
               exact component (packages/core SideNav → open-connections). The
               sidebar entry is always on screen and belongs to the shared
               package, so it keeps the job; this button keeps the half the
               sidebar does not name. -->
          <div class="card"><div class="between">
            <div><div class="label">${esc(T('set.connections'))}</div>
              <div class="muted">${esc(T('set.connections_sub'))}</div></div>
            <button id="conn-open" ${active ? '' : 'disabled'}>${esc(T('set.connections_open'))}</button>
          </div></div>

          <h2>${esc(T('set.folders'))}</h2>
          ${engineWarning}
          ${toggle('sync-pause', state.syncPaused === true, T('set.pause'), T('set.pause_sub'))}
          ${limitRow('limit-down', state.limitDownKiB, T('set.limit_down'), T('set.limit_down_sub'))}
          ${limitRow('limit-up', state.limitUpKiB, T('set.limit_up'), T('set.limit_up_sub'))}
          <div class="card"><div class="between">
            <div><div class="label">${esc(T('set.window'))}</div>
              <div class="muted">${esc(T('set.window_sub'))}</div></div>
            <div class="segmented">${
              (state.windowPresets || ['']).map((w) => `<button data-sync-window="${esc(w)}"${
                (state.syncWindow || '') === w ? ' class="is-active" aria-pressed="true"' : ' aria-pressed="false"'
              }${w ? ` title="${esc(w.replace('-', '–'))}"` : ''}>${esc(w ? T('set.window_' + w) : T('set.window_any'))}</button>`).join('')
            }</div>
          </div></div>
          ${active ? `<div class="card"><div class="between">
            <div style="min-width:0">
              <div class="label">${esc(T('set.sync_root'))}</div>
              <div class="muted" style="overflow-wrap:anywhere">${
                active.syncRoot ? esc(active.syncRoot) : esc(T('set.sync_root_none'))}</div>
              <div class="muted">${esc(T('set.sync_root_sub'))}</div>
            </div>
            <div class="row">
              <button data-openlocal="${esc(active.syncRoot || '')}" ${active.syncRoot ? '' : 'disabled'}>${esc(T('set.open_folder'))}</button>
              <button id="sync-root-change">${esc(T('set.sync_root_change'))}</button>
            </div>
          </div></div>` : ''}
          ${pairs}
          <div class="row" style="margin-top:6px">
            <button class="primary" id="add-sync" ${active ? '' : 'disabled'}>${esc(T('set.add_sync'))}</button>
            <button id="sync-trash">${esc(T('set.trash'))}</button>
          </div>
          <p class="muted" style="margin-top:10px">${esc(T('set.sync_note'))}</p>

          <h2>${esc(T('set.this_app'))}</h2>
          <div class="card"><div class="between">
            <div><div class="label">${esc(T('set.language'))}</div>
              <div class="muted">${esc(T('set.language_sub'))}</div></div>
            <div class="segmented">${
              // The names stay in their own language — a Turkish speaker looking
              // for Turkish scans for "Türkçe", not for "Turkish".
              [['system', T('set.language_system')], ['en', 'English'], ['tr', 'Türkçe']]
                .map(([code, label]) => `<button data-locale="${code}"${
                  (state.locale || 'system') === code ? ' class="is-active" aria-pressed="true"' : ' aria-pressed="false"'
                }>${esc(label)}</button>`).join('')
            }</div>
          </div></div>
          <div class="card"><div class="between">
            <div><div class="label">${esc(T('set.open_trigger'))}</div>
              <div class="muted">${esc(T('set.open_trigger_sub'))}</div></div>
            <div class="segmented">${
              [['double', T('set.open_double')], ['single', T('set.open_single')]]
                .map(([v, label]) => `<button data-opentrigger="${v}"${
                  openTriggerPref() === v ? ' class="is-active" aria-pressed="true"' : ' aria-pressed="false"'
                }>${esc(label)}</button>`).join('')
            }</div>
          </div></div>
          ${toggle('bg', state.runInBackground, T('set.background'), T('set.background_sub'))}
          ${toggle('notifs', state.notifications !== false, T('set.notifications'), T('set.notifications_sub'))}
          ${toggle('login-item', state.launchAtLogin, T('set.autostart'), T(
            // A dev run refuses to write a login item at all (it could only
            // register the bare electron binary), so the row says that rather
            // than offering a switch that silently does nothing.
            state.launchAtLoginSupported === false ? 'set.autostart_dev'
            : state.launchAtLoginEffective === false && state.launchAtLogin
              ? 'set.autostart_refused' : 'set.autostart_sub'),
            state.launchAtLoginSupported === false)}
          ${portableCard()}
          ${openWithCard()}
          <h2>${esc(T('upd.title'))}</h2>
          ${updateCard()}
          <p class="muted" style="margin-top:14px">filex ${esc(state.appVersion || '')}</p>
        </div>`;
      }

      // ── "Open with filex" ─────────────────────────────────────
      //
      // ⚠ Registration and DEFAULT are two different things and the panel says
      // so, because the app cannot pretend otherwise: the installer makes filex
      // AVAILABLE under "Open with", and only the person at the keyboard can
      // make it the default. On Windows that is not a policy this app chose —
      // the UserChoice key is hash-protected precisely so that no installer can
      // grab a file type — so the button opens the OS page instead of claiming
      // to have done something.
      let owState = null;
      let owJson = '';

      function refreshOpenWith() {
        if (!window.filexApp.openWith) return;
        window.filexApp.openWith().then((s) => {
          const j = JSON.stringify(s);
          if (j === owJson) return; // ⚠ no re-render on an identical answer, or
          owJson = j;               //   renderSettings would call this forever
          owState = s;
          if ($('#settings').classList.contains('open')) renderSettings();
        }).catch(() => {});
      }

      function openWithCard() {
        const ow = owState;
        if (!ow) return '';
        const route = ow.defaultRoute;
        const hint = route === 'settings' ? 'ow.default_win'
          : route === 'xdg' ? 'ow.default_linux' : 'ow.default_mac';
        const btn = route === 'settings' ? 'ow.default_btn_win'
          : route === 'xdg' ? 'ow.default_btn_linux' : 'ow.default_btn_mac';
        const live = (ow.sessions || []).map((s) => `
          <div class="muted" style="overflow-wrap:anywhere">${esc(s.localPath)}</div>`).join('');
        return `
          <h2>${esc(T('ow.title'))}</h2>
          <div class="card">
            <div class="label">${esc(T('ow.idea'))}</div>
            <div class="muted" style="margin-top:6px">${
              esc(T('ow.types', { types: (ow.extensions || []).map((e) => '.' + e).join('  ') }))}</div>
            <div class="muted">${esc(T(ow.registered ? 'ow.registered' : 'ow.dev'))}</div>
          </div>
          <div class="card"><div class="between">
            <div style="min-width:0">
              <div class="muted">${esc(T(hint))}</div>
              ${ow.lastError ? `<div class="err">${esc(ow.lastError)}</div>` : ''}
            </div>
            <button id="ow-default">${esc(T(btn))}</button>
          </div></div>
          ${live ? `<div class="card">
            <div class="label">${esc(T('ow.open_now'))}</div>${live}</div>` : ''}`;
      }

      /**
       * Where a portable copy keeps its files — shown only on a portable copy.
       *
       * The whole promise of the portable build is "delete one folder and
       * nothing of mine is left here", and a promise the user cannot verify is
       * just a claim. So the path is on screen, with the button that opens it.
       * When the .exe turned out to sit somewhere unwritable the card says THAT
       * instead: falling back to %APPDATA% silently would break the promise
       * without anybody finding out.
       */
      function portableCard() {
        const p = state.portable;
        if (!p) return '';
        return `<div class="card"><div class="between">
            <div style="min-width:0"><div class="label">${esc(T('set.portable'))}</div>
              <div class="muted">${esc(T(p.besideExe ? 'set.portable_sub' : 'set.portable_stuck'))}</div>
              <div class="muted"><code>${esc(p.dataDir || '')}</code></div></div>
            <button id="portable-show">${esc(T('set.portable_show'))}</button>
          </div></div>`;
      }

      /** The update row: what the app knows, plus the one button that matters. */
      function updateCard() {
        const u = state.update || { status: 'idle' };
        const supported = state.launchAtLoginSupported !== false; // packaged run
        // An ad-hoc sealed mac build cannot swap itself; its story is a
        // download, and pretending otherwise is what this card used to do.
        const manual = state.updateManualOnly === true;
        // Two builds cannot swap themselves and they cannot say the same thing:
        // the mac one is about a missing signature, the portable one about
        // there being no installation to replace. See src/main.ts.
        const portable = state.updateManualReason === 'windows-portable';
        let line = T('upd.current');
        if (!supported) line = T('upd.dev');
        else if (u.status === 'checking') line = T('upd.checking');
        else if (u.status === 'manual') line = T(portable ? 'upd.portable_manual' : 'upd.manual', { v: u.version || '' });
        else if (u.status === 'available') line = T('upd.available', { v: u.version || '' });
        else if (u.status === 'downloading') line = T('upd.downloading', { p: u.percent ?? 0 });
        else if (u.status === 'ready') line = T('upd.ready', { v: u.version || '' });
        else if (u.status === 'error') line = T('upd.error');
        const btn = u.status === 'ready'
          ? `<button class="primary" id="upd-install">${esc(T('upd.restart'))}</button>`
          : u.status === 'manual'
            ? `<button class="primary" id="upd-download">${esc(T('upd.download'))}</button>`
            : `<button id="upd-check" ${supported ? '' : 'disabled'}>${esc(T('upd.check'))}</button>`;
        return `<div class="card"><div class="between">
            <div><div class="label">${esc(line)}</div>
              <div class="muted">${esc(T(
                !(manual && supported) ? 'upd.idea'
                : portable ? 'upd.portable_idea' : 'upd.manual_idea'))}</div></div>
            ${btn}
          </div></div>`;
      }

      function toggleSettings(force) {
        const el = $('#settings');
        const open = force ?? !el.classList.contains('open');
        el.classList.toggle('open', open);
        // Hide the explorer, don't just cover it. The body class additionally
        // hides overlays the explorer parents to <body> — hiding the host alone
        // left the tour card sitting in the middle of Settings.
        syncOverlays();
        if (open) renderSettings();
      }

      function renderSettings() {
        const el = $('#settings');
        el.innerHTML = settingsHtml();
        $('#close-settings', el).addEventListener('click', () => toggleSettings(false));
        el.querySelectorAll('[data-signout]').forEach((b) => b.addEventListener('click', async () => {
          state = await window.filexApp.signOut(b.dataset.signout); render(); renderSettings();
        }));
        el.querySelectorAll('[data-admin]').forEach((b) => b.addEventListener('click', () =>
          window.filexApp.openAdmin(b.dataset.admin)));
        el.querySelectorAll('[data-reconnect]').forEach((b) => b.addEventListener('click', () => {
          void window.filexApp.reconnect(b.dataset.reconnect);
        }));
        el.querySelectorAll('[data-openlocal]').forEach((b) => b.addEventListener('click', () =>
          window.filexApp.openLocal(b.dataset.openlocal)));
        el.querySelectorAll('[data-rmsync]').forEach((b) => b.addEventListener('click', async () => {
          try { state = await window.filexApp.removeSync(b.dataset.rmsync); }
          catch (e) { alert(String(e.message || e)); }
          render(); renderSettings();
        }));
        const connOpen = $('#conn-open', el);
        if (connOpen) connOpen.addEventListener('click', () => openConnections('storages'));
        const addSync = $('#add-sync', el);
        if (addSync) addSync.addEventListener('click', () => openPicker());
        const rootChange = $('#sync-root-change', el);
        if (rootChange) rootChange.addEventListener('click', async () => {
          state = await window.filexApp.setSyncRoot(state.activeId);
          renderSettings();
        });
        $('#sync-trash', el).addEventListener('click', () => void openTrash());
        $('#bg', el).addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ runInBackground: !state.runInBackground });
          renderSettings();
        });
        $('#notifs', el).addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ notifications: state.notifications === false });
          renderSettings();
        });
        $('#sync-pause', el).addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ syncPaused: state.syncPaused !== true });
          render(); renderSettings();
        });
        // Limits and the window restart the watchers in the main process.
        el.querySelectorAll('[data-limit-down]').forEach((b) => b.addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ limitDownKiB: Number(b.dataset.limitDown) });
          renderSettings();
        }));
        el.querySelectorAll('[data-limit-up]').forEach((b) => b.addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ limitUpKiB: Number(b.dataset.limitUp) });
          renderSettings();
        }));
        el.querySelectorAll('[data-sync-window]').forEach((b) => b.addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ syncWindow: b.dataset.syncWindow || '' });
          renderSettings();
        }));
        el.querySelectorAll('[data-locale]').forEach((b) => b.addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ locale: b.dataset.locale });
          // The main process resolves 'system'; taking its answer keeps this
          // window and the tray menu in the same language.
          applyLang(state.effectiveLocale);
          relabelStatic();
          render();
          renderSettings();
        }));
        // Open gesture (single/double click) — a per-machine preference. Store
        // it and remount the explorer so the new config.openTrigger takes hold.
        el.querySelectorAll('[data-opentrigger]').forEach((b) => b.addEventListener('click', () => {
          try { localStorage.setItem('filex.openTrigger', b.dataset.opentrigger); } catch {}
          mountedFor = null;
          const active = state.accounts.find((a) => a.id === state.activeId);
          if (active) void mountExplorer(active);
          renderSettings();
        }));
        const portableShow = $('#portable-show', el);
        if (portableShow) portableShow.addEventListener('click', () => {
          if (state.portable?.dataDir) window.filexApp.openLocal(state.portable.dataDir);
        });
        const updCheck = $('#upd-check', el);
        if (updCheck) updCheck.addEventListener('click', async () => {
          state = await window.filexApp.checkUpdate();
          renderSettings();
        });
        const updInstall = $('#upd-install', el);
        if (updInstall) updInstall.addEventListener('click', () => window.filexApp.installUpdate());
        const updDownload = $('#upd-download', el);
        if (updDownload) updDownload.addEventListener('click', () => window.filexApp.downloadUpdate());
        $('#login-item', el).addEventListener('click', async () => {
          state = await window.filexApp.setSettings({ launchAtLogin: !state.launchAtLogin });
          renderSettings();
        });
        const owBtn = $('#ow-default', el);
        if (owBtn) owBtn.addEventListener('click', async () => {
          const r = await window.filexApp.openWithSetDefault();
          // Only the Linux route actually performs the change, so it is the
          // only one with a result worth reporting. The other two hand the user
          // to the OS and have nothing to claim.
          if (r && r.route === 'xdg') {
            alert(r.ok ? T('ow.default_done') : T('ow.default_failed', { err: r.detail || '' }));
          }
          refreshOpenWith();
        });
        refreshOpenWith();
      }

      // ── storage connections ───────────────────────────────────
      // ⚠⚠ NOT a form written here. `<filex-connections>` is the same
      // component the web admin panel mounts, from the same npm package as
      // the explorer above — the driver fields come from the server's own
      // descriptors and the instructions from the live deployment. A
      // hand-written copy in this file would be the exact split the shared
      // package exists to prevent (v0.16.0 shipped one; Ada was right to
      // be angry about it).
      //
      // The only genuinely desktop-specific parts stay here: which server
      // is active, and where the bearer token comes from.
      let connFor = null;
      let connTab = null;

      function openConnections(tab) {
        const active = state.accounts.find((a) => a.id === state.activeId);
        if (!active) return;
        const slot = $('#conn-host');
        // Recreated when the account OR the requested half changes: the
        // panel picks its opening tab once, at setup.
        if (connFor !== active.id || connTab !== tab) {
          slot.innerHTML = '';
          const el = document.createElement('filex-connections');
          el.setAttribute('closable', '');
          el.initialTab = tab;
          el.config = {
            apiBase: active.serverUrl,
            // The same function-token the explorer gets: the credential is
            // fetched from the main process per call rather than handed to
            // this page up front.
            auth: { kind: 'bearer', token: () => window.filexApp.token(active.id) },
            locale: LANG,
            theme: 'auto',
          };
          el.addEventListener('close', () => toggleConnections(false));
          // A storage that was just added has to show up in the file list,
          // otherwise the user adds it and nothing happens.
          el.addEventListener('changed', () => {
            mountedFor = null;
            void mountExplorer(active);
          });
          el.addEventListener('error', (e) => console.error('[connections]', e.detail));
          slot.appendChild(el);
          connFor = active.id;
          connTab = tab;
        }
        toggleConnections(true);
      }

      function toggleConnections(open) {
        $('#conn').classList.toggle('open', open);
        syncOverlays();
      }

      /** Explorer visibility is a function of BOTH overlays.
       *
       *  ⚠ Not of the one being toggled: closing connections while Settings
       *  is still open would otherwise un-hide the explorer underneath it,
       *  and the tour card it parents to <body> would land in the middle of
       *  the settings page — the failure that is already commented twice
       *  above. */
      function syncOverlays() {
        const any =
          $('#conn').classList.contains('open') || $('#settings').classList.contains('open');
        $('#explorer-host').style.display = any ? 'none' : 'flex';
        document.body.classList.toggle('settings-open', any);
      }

      // ── remote folder picker ──────────────────────────────────
      // Typing `storage://some/path` by hand is a guess about someone else's
      // server. This walks the real listing instead.
      let pkPath = '';
      async function openPicker(path = '') {
        pkPath = path;
        $('#picker').classList.add('open');
        const list = $('#pk-list');
        list.innerHTML = `<li class="muted">${esc(T('pick.loading'))}</li>`;
        $('#pk-path').textContent = path || T('pick.storages');
        try {
          const entries = await window.filexApp.browse(state.activeId, path);
          list.innerHTML = '';
          if (!entries.length) list.innerHTML = `<li class="muted">${esc(T('pick.empty'))}</li>`;
          for (const e of entries) {
            const li = document.createElement('li');
            li.textContent = `📁 ${e.name}`;
            li.addEventListener('click', () => openPicker(e.path));
            list.appendChild(li);
          }
        } catch (e) {
          list.innerHTML = `<li class="err">${esc(e.message || e)}</li>`;
        }
      }
      $('#pk-close').addEventListener('click', () => $('#picker').classList.remove('open'));
      $('#pk-up').addEventListener('click', () => {
        if (!pkPath) return;
        const i = pkPath.lastIndexOf('/');
        openPicker(i > pkPath.indexOf('://') + 2 ? pkPath.slice(0, i) : '');
      });
      $('#pk-use').addEventListener('click', async () => {
        if (!pkPath) { alert(T('pick.pick_storage')); return; }
        try {
          state = await window.filexApp.addSync(pkPath);
          $('#picker').classList.remove('open');
          render(); renderSettings();
        } catch (e) { alert(String(e.message || e)); }
      });

      // ── what sync removed from THIS computer ──────────────────
      // A surface, not an alert(). The native box is the one thing in this
      // window the product's palette cannot reach, it blocks the renderer
      // while it is up, and it was printing a date-stamped list as plain text
      // in a proportional system font.
      async function openTrash() {
        const dlg = $('#trash');
        const list = $('#tr-list');
        dlg.classList.add('open');
        list.innerHTML = `<li class="muted">${esc(T('pick.loading'))}</li>`;
        try {
          const items = await window.filexApp.syncTrash();
          list.innerHTML = '';
          if (!items.length) {
            list.innerHTML = `<li class="muted">${esc(T('sync.trash_empty'))}</li>`;
            return;
          }
          for (const i of items.slice(0, 200)) {
            const li = document.createElement('li');
            const name = document.createElement('code');
            name.textContent = i.rel;
            const when = document.createElement('span');
            when.className = 'muted';
            when.textContent = new Date(i.deleted).toLocaleDateString();
            li.append(name, when);
            list.appendChild(li);
          }
        } catch (e) {
          list.innerHTML = `<li class="err">${esc(e.message || e)}</li>`;
        }
      }
      $('#tr-close').addEventListener('click', () => $('#trash').classList.remove('open'));
      // Both dialogs close on the backdrop and on Escape, like every other
      // dialog in the product.
      for (const id of ['#picker', '#trash']) {
        $(id).addEventListener('mousedown', (e) => {
          if (e.target === $(id)) $(id).classList.remove('open');
        });
      }
      window.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        for (const id of ['#picker', '#trash']) {
          if ($(id).classList.contains('open')) { $(id).classList.remove('open'); return; }
        }
      });

      // ── boot ──────────────────────────────────────────────────
      function render() {
        const active = state.accounts.find((a) => a.id === state.activeId);
        // ⚠ EVERY account, not just the active one: the rail draws all of them
        // at once, so fetching only the active server's branding left the other
        // rows on initials until you clicked them.
        for (const a of state.accounts) void loadBrand(a);
        renderRail();
        void mountExplorer(active);
        // The rail stays clickable while the connections surface is open, so
        // a switch there must re-point it — otherwise it would keep showing
        // the previous server's storages under the new server's name.
        if ($('#conn').classList.contains('open')) openConnections(connTab || 'storages');
      }

      async function refresh() {
        state = await window.filexApp.getState();
        // The language the main process resolved (the choice, or the OS behind
        // 'system'). Everything already on screen is relabelled when it moves.
        if (applyLang(state.effectiveLocale)) relabelStatic();
        render();
        if ($('#settings').classList.contains('open')) renderSettings();
      }

      // The picker's chrome is static markup — labelled here rather than on
      // every open, and again whenever the language changes (a switch that
      // leaves half the window in the old language is worse than no switch).
      function relabelStatic() {
        $('#pk-title').textContent = T('pick.title');
        $('#pk-up').textContent = T('pick.up');
        $('#pk-use').textContent = T('pick.use');
        $('#tr-title').textContent = T('set.trash');
        $('#tr-sub').textContent = T('set.trash_sub');
        for (const id of ['#pk-close', '#tr-close']) {
          const b = $(id);
          b.innerHTML = ICON_X;
          b.title = T('pick.close');
          b.setAttribute('aria-label', T('pick.close'));
        }
        // Our window-control tooltips follow the language too.
        document.querySelectorAll('#winctl button[data-lk]').forEach((b) => {
          b.title = T(b.dataset.lk);
          b.setAttribute('aria-label', T(b.dataset.lk));
        });
      }
      setupTitlebar();
      relabelStatic();

      window.filexApp.onChanged(() => {
        refresh();
        if (explorerSyncCb) explorerSyncCb();
      });
      window.filexApp.onDragProgress((p) => {
        if (explorerDragCb) explorerDragCb(p);
      });
      window.filexApp.onOpenSettings(() => toggleSettings(true));
      window.filexApp.onNotificationOpen((p) => void openNotification(p));
      refresh();
    </script>
  </body>
</html>
