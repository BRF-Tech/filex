<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>boot</title></head>
  <body>
    <!-- Smoke fixture standing in for the app page. Reports what the preload
         exposed so the smoke can assert the bridge's shape — in particular that
         it does NOT contain a credential. -->
    <script>
      const api = window.filexApp || {};
      const out = {
        isDesktop: !!api.isDesktop,
        // ⚠ Must be a function, not a string. The explorer is handed
        // `token: () => …` so the credential is fetched per request instead of
        // living in the renderer for the whole session.
        tokenIsFunction: typeof api.token === 'function',
        tokenType: typeof api.token,
        // The bridge's job is accounts + sync + app settings. Anything the
        // server's admin console does belongs in the browser.
        hasAccountApi:
          typeof api.signOut === 'function' &&
          typeof api.switchAccount === 'function' &&
          typeof api.addSync === 'function' &&
          typeof api.openAdmin === 'function',
        origin: location.origin,
      };
      document.title = 'SMOKE:' + JSON.stringify(out);
    </script>
  </body>
</html>
