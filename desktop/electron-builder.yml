appId: sh.brf.filex.desktop
productName: filex
copyright: © BRF Tech

directories:
  output: release
  buildResources: build

# What ends up inside the packaged app: the compiled main/preload (dist),
# the embedded web bundle (app), and our own chrome (ui: connect/settings/sync).
# The tray reads the icon at runtime, so it has to exist next to the app as
# well as being baked into the executable.
extraResources:
  - from: build/icon.png
    to: icon.png
  # The sync engine. It is the same `filex` binary the project releases as a
  # CLI, not a cut-down copy: syncing is `filex sync run`, so the app and a
  # terminal act on one implementation and one pairing file. Built per platform
  # by scripts/fetch-cli.mjs before packaging.
  - from: build/bin
    to: bin
    filter:
      - filex
      - filex.exe

# ⚠⚠ node_modules MUST be listed. An explicit `files` list replaces the default
# — and the default is what pulls production dependencies in. Without this line
# `electron-updater` was simply absent from the asar, the main process threw on
# its import before creating a window, and the app started to nothing: no error
# dialog, no window, just a process. Caught by scripts/update-e2e.mjs (the
# launch timed out); a package that opens is not a package that WORKS.
files:
  - dist/**/*
  - app/**/*
  - ui/**/*
  - package.json
  - node_modules/**/*

# First release is UNSIGNED (Dilim 2, trap #4): Windows SmartScreen and macOS
# Gatekeeper will warn. This is a deliberate, separate decision (a code-signing
# certificate is paid + its own task) — not a bug.
# Artifact names come from productName, not the npm package name. Without this
# the .deb is built as "@brftech/filex-desktop_0.1.0_amd64.deb" — a scoped npm
# name is not a legal Debian package name (it contains a slash), so the file is
# both wrong and awkward to install.
#
# ⚠ NO VERSION in the filename, deliberately. The web app links straight to
# `releases/latest/download/<name>`, which GitHub only resolves for a FIXED
# filename — with the version baked in, every download link would 404 the moment
# a new release went out, and the alternative (pointing at the release page) is
# what made people ask "which of these ten files do I want?". The app reports
# its own version in Settings.
artifactName: ${productName}-desktop-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Utility
  # Required by the deb target; without it electron-builder refuses to build.
  maintainer: BRF Tech <security@brf.sh>
  # The binary users actually type, and what the Debian package is named after.
  # Defaults to the npm name otherwise, which would be "@brftech/filex-desktop"
  # — not a legal Debian package name.
  executableName: filex
  # ── "Open with filex" ───────────────────────────────────────────────
  # The office documents this app can open. desktop/src/openwith.ts
  # (OFFICE_EXTENSIONS / OFFICE_MIME_TYPES) is the source; a YAML file cannot
  # import TypeScript, so the two lists are kept in step by hand and the code
  # says so where it defines them.
  #
  # ⚠ `mimeTypes`, NOT `fileAssociations`. These are standard types that
  # shared-mime-info already defines on every desktop; `fileAssociations` would
  # additionally ship OUR OWN `<mime-type>` XML redeclaring them with our own
  # glob — a second opinion about what a `.docx` is, on a system that already
  # has one. All this app needs to say is that it can open them.
  #
  # ⚠ This makes filex APPEAR under "Open with". It does not make it the
  # default: that lives in the user's `mimeapps.list`, and Settings has a button
  # that runs `xdg-mime default` for exactly these types when they ask for it.
  mimeTypes:
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/msword
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.ms-excel
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
    - application/vnd.ms-powerpoint
    - application/vnd.oasis.opendocument.text
    - application/vnd.oasis.opendocument.spreadsheet
    - application/vnd.oasis.opendocument.presentation
    - application/rtf
win:
  target:
    # The installed app: Start menu entry, per-user, updates itself silently.
    - nsis
    # ⚠ And ONE .exe that runs from wherever it is put — a USB stick, a
    # Downloads folder, a locked-down work machine where nothing may be
    # installed. Linux and macOS already had this (the AppImage runs
    # unextracted, the mac .zip is unzip-and-run); Windows was the only
    # platform with no way to run filex without an installer.
    #
    # The portable stub unpacks the app into a temp directory and runs it from
    # there, so `process.execPath` points at something that is deleted on exit.
    # It hands the app the real location in PORTABLE_EXECUTABLE_DIR, and
    # desktop/src/portable.ts moves userData next to the .exe on the strength
    # of that variable alone — never a guess.
    - portable
mac:
  target:
    # dmg is the human download; zip is what electron-updater's mac feed
    # (latest-mac.yml) points at — without it the feed file names an artifact
    # that does not exist. Auto-update on mac stays INERT until the app is
    # signed with a real identity (Squirrel.Mac refuses to swap an unsigned
    # app); the zip ships anyway so the feed is already correct the day a
    # Developer ID lands.
    - dmg
    - zip
  category: public.app-category.productivity
  # ── "Open with filex" ───────────────────────────────────────────────
  # CFBundleDocumentTypes: what shows up in Finder's "Open with" menu.
  #
  # ⚠⚠ `rank: Alternate`, deliberately — NOT the `Default` electron-builder
  # would otherwise write. `Owner`/`Default` tells LaunchServices this app is a
  # or the natural handler for `.docx`, and on a Mac with nothing else claiming
  # the type that is enough for macOS to hand it over WITHOUT the user ever
  # choosing. Installing an app must never quietly take a file type; `Alternate`
  # says "offer me in the list", which is the whole of what is wanted here.
  # Becoming the default stays a Finder → Get Info → "Change All…" decision, and
  # Settings says so rather than pretending it can do it (LaunchServices' API
  # for it has no Electron binding, and this app ships no native module).
  fileAssociations:
    - ext:
        - docx
        - doc
        - xlsx
        - xls
        - pptx
        - ppt
        - odt
        - ods
        - odp
        - rtf
      name: Office document
      role: Editor
      rank: Alternate

# Unsigned macOS builds get a deep ad-hoc re-seal (see the script for why a
# half-signed bundle reads as MALWARE to macOS 26 while an ad-hoc-sealed one
# gets the "Open Anyway" path). No-op off macOS and when a real cert is set.
afterPack: scripts/adhoc-sign.cjs

# ⚠⚠ nsis and portable BOTH emit `.exe`, so under the shared artifactName
# template above they would both be `filex-desktop-x64.exe` — the same file,
# written twice, with whichever target ran last winning. The override is
# mandatory, and it obeys the same rule as the template it replaces: NO
# ${version}, because the download links point at
# `releases/latest/download/<name>` and GitHub only resolves that for a fixed
# filename.
portable:
  artifactName: ${productName}-desktop-portable-${arch}.${ext}
  # Never ask for administrator rights. This is the build somebody runs BECAUSE
  # they do not have them; a UAC prompt would be the one thing that makes it
  # useless. (`user` is already the default — written out because the
  # alternative is a single word in this file and the failure is total.)
  requestExecutionLevel: user
  # ⚠ `unpackDirName` is deliberately NOT set. Read templates/nsis/portable.nsi
  # before adding it: the stub does `RMDir /r $INSTDIR` BEFORE extracting, so a
  # fixed name means launching one portable copy wipes the extraction directory
  # of another one that is still running. The default is a per-build id, and
  # the same script removes the directory again once the app exits — so nothing
  # is left in %TEMP% either way.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # ⚠⚠ PER-USER, always. Not a preference — it is what makes a silent update
  # possible at all. An install under C:\Program Files needs administrator
  # rights to replace its own files, so every background update ends in a UAC
  # prompt: the app cannot update itself while nobody is at the machine, and
  # "it updates itself quietly" becomes a promise it can only half keep.
  # Discord, Slack and VS Code's user installer all land in %LOCALAPPDATA% for
  # exactly this reason.
  #
  # `perMachine: false` is already the default, but it is written out because
  # the default ALSO shows an install-mode page and offers elevation — and one
  # click on "for all users" puts the app somewhere its own updater cannot
  # reach. `allowElevation: false` removes that page and that choice.
  # (Measured 2026-08-14: the installed copy was C:\Program Files\filex with
  # `/allusers`, which is why its updates asked for elevation.)
  perMachine: false
  allowElevation: false

# ── auto-update feed ─────────────────────────────────────────────────
# Generic (a plain static directory), NOT the GitHub provider: this repo's
# GitHub mirror is private, and the GitHub provider would need a token shipped
# inside the app to read its releases. filex.sh already serves the CLI's update
# manifest from the same static site, so the desktop feed lives beside it.
#
# Declaring `publish` is also what makes electron-builder WRITE `latest.yml`
# next to the installer — without it there is nothing for the updater to read,
# and the app would check forever and find nothing.
publish:
  provider: generic
  url: https://filex.sh/desktop/
  # We upload by hand (goreleaser owns the CLI release; these packages do not
  # come from CI), so never let a build try to push.
  publishAutoUpdate: true
