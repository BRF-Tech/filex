appId: sh.brf.filex.desktop
productName: filex
copyright: © BRF Tech

directories:
  output: release
  buildResources: build

# What ends up inside the packaged app: the compiled main/preload (dist),
# the embedded web bundle (app), and our own chrome (ui: connect/settings/sync).
# The tray reads the icon at runtime, so it has to exist next to the app as
# well as being baked into the executable.
extraResources:
  - from: build/icon.png
    to: icon.png
  # The sync engine. It is the same `filex` binary the project releases as a
  # CLI, not a cut-down copy: syncing is `filex sync run`, so the app and a
  # terminal act on one implementation and one pairing file. Built per platform
  # by scripts/fetch-cli.mjs before packaging.
  - from: build/bin
    to: bin
    filter:
      - filex
      - filex.exe

# ⚠⚠ node_modules MUST be listed. An explicit `files` list replaces the default
# — and the default is what pulls production dependencies in. Without this line
# `electron-updater` was simply absent from the asar, the main process threw on
# its import before creating a window, and the app started to nothing: no error
# dialog, no window, just a process. Caught by scripts/update-e2e.mjs (the
# launch timed out); a package that opens is not a package that WORKS.
files:
  - dist/**/*
  - app/**/*
  - ui/**/*
  - package.json
  - node_modules/**/*

# First release is UNSIGNED (Dilim 2, trap #4): Windows SmartScreen and macOS
# Gatekeeper will warn. This is a deliberate, separate decision (a code-signing
# certificate is paid + its own task) — not a bug.
# Artifact names come from productName, not the npm package name. Without this
# the .deb is built as "@brftech/filex-desktop_0.1.0_amd64.deb" — a scoped npm
# name is not a legal Debian package name (it contains a slash), so the file is
# both wrong and awkward to install.
#
# ⚠ NO VERSION in the filename, deliberately. The web app links straight to
# `releases/latest/download/<name>`, which GitHub only resolves for a FIXED
# filename — with the version baked in, every download link would 404 the moment
# a new release went out, and the alternative (pointing at the release page) is
# what made people ask "which of these ten files do I want?". The app reports
# its own version in Settings.
artifactName: ${productName}-desktop-${arch}.${ext}

linux:
  # The downloads on the GitHub Release. The snap is NOT here: it is built on
  # its own (`pnpm dist:snap`, see `snap:` below) because it goes to the Snap
  # Store, whose confinement and updates are a different product.
  target:
    - AppImage
    - deb
    # Fedora / openSUSE. Like the .deb it carries `resources/package-type`, so
    # electron-updater's RpmUpdater updates it from the filex.sh feed (pkexec +
    # dnf / zypper / rpm). fpm needs `rpmbuild` on the build machine — CI
    # installs the `rpm` package for it.
    - rpm
  category: Utility
  # Required by the deb target; without it electron-builder refuses to build.
  maintainer: BRF Tech <security@brf.sh>
  # The binary users actually type, and what the desktop entry, the icon and
  # the snap are named after. Defaults to the npm name otherwise, which would be
  # "@brftech/filex-desktop" — not a legal Debian package name.
  #
  # ⚠⚠ `filex-app`, not `filex` (decision 2026-09-25): `filex` is the CLI, on
  # every platform and in every package manager. Until 0.43.x this package was
  # called `filex` and put /usr/bin/filex on PATH — the CLI's command, so which
  # of the two a terminal ran depended on PATH order. The window, the menu entry
  # and the tray still say "filex" (productName); only the Linux command and
  # package names changed. Upgrading from the old package: `deb:`/`rpm:` below;
  # the user's autostart entry and defaults: main.ts → migrateLegacyLinuxNames.
  # src/channel.ts → LINUX_APP_NAME must say the same (a test holds them equal).
  executableName: filex-app
  # ⚠ The .deb/.rpm PACKAGE name is a separate setting (`deb.packageName`,
  # `rpm.packageName` below): electron-builder takes it from the npm name, and
  # for a scoped one (`@brftech/…`) from productName — `filex` — NOT from
  # executableName.
  # ── "Open with filex" ───────────────────────────────────────────────
  # The office documents this app can open. desktop/src/openwith.ts
  # (OFFICE_EXTENSIONS / OFFICE_MIME_TYPES) is the source; a YAML file cannot
  # import TypeScript, so the two lists are kept in step by hand and the code
  # says so where it defines them.
  #
  # ⚠ `mimeTypes`, NOT `fileAssociations`. These are standard types that
  # shared-mime-info already defines on every desktop; `fileAssociations` would
  # additionally ship OUR OWN `<mime-type>` XML redeclaring them with our own
  # glob — a second opinion about what a `.docx` is, on a system that already
  # has one. All this app needs to say is that it can open them.
  #
  # ⚠ This makes filex APPEAR under "Open with". It does not make it the
  # default: that lives in the user's `mimeapps.list`, and Settings has a button
  # that runs `xdg-mime default` for exactly these types when they ask for it.
  mimeTypes:
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/msword
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.ms-excel
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
    - application/vnd.ms-powerpoint
    - application/vnd.oasis.opendocument.text
    - application/vnd.oasis.opendocument.spreadsheet
    - application/vnd.oasis.opendocument.presentation
    - application/rtf
    # ── filex:// — the browser sign-in hands the code back on it ──────
    # The one entry here that is not a document type: `x-scheme-handler/filex`
    # in the desktop entry is how a Linux desktop learns who opens filex://
    # links — the .deb's, the .rpm's, the AppImage's embedded one and the
    # snap's alike. Without it NOTHING on Linux handled the link: measured on
    # the v0.43.0 .deb, `xdg-mime query default x-scheme-handler/filex` was
    # empty before and after a launch (the app's own runtime registration named
    # `@brftech/filex-desktop.desktop`, a file nothing installs — see
    # `desktopName` in package.json). Sign-in worked only by pasting the code.
    #
    # ⚠⚠ Here, NOT as `linux.protocols` — which is the documented way and does
    # the same, but electron-builder 24.13.3 appends the scheme to THIS list
    # object once per target it builds (LinuxTargetHelper pushes onto
    # `asArray(mimeTypes)`, the config's own array): measured `…filex;` twice
    # in the .deb and three times in the .rpm of one `dist:linux`. The
    # extension-list test skips `x-scheme-handler/*`; test/
    # linux-desktop-entry.test.ts keeps the scheme here and `protocols` out.
    - x-scheme-handler/filex
win:
  target:
    # The installed app: Start menu entry, per-user, updates itself silently.
    - nsis
    # ⚠ And ONE .exe that runs from wherever it is put — a USB stick, a
    # Downloads folder, a locked-down work machine where nothing may be
    # installed. Linux and macOS already had this (the AppImage runs
    # unextracted, the mac .zip is unzip-and-run); Windows was the only
    # platform with no way to run filex without an installer.
    #
    # The portable stub unpacks the app into a temp directory and runs it from
    # there, so `process.execPath` points at something that is deleted on exit.
    # It hands the app the real location in PORTABLE_EXECUTABLE_DIR, and
    # desktop/src/portable.ts moves userData next to the .exe on the strength
    # of that variable alone — never a guess.
    - portable
mac:
  target:
    # dmg is the human download; zip is what electron-updater's mac feed
    # (latest-mac.yml) points at — without it the feed file names an artifact
    # that does not exist. Auto-update on mac stays INERT until the app is
    # signed with a real identity (Squirrel.Mac refuses to swap an unsigned
    # app); the zip ships anyway so the feed is already correct the day a
    # Developer ID lands.
    - dmg
    - zip
  category: public.app-category.productivity
  # ── "Open with filex" ───────────────────────────────────────────────
  # CFBundleDocumentTypes: what shows up in Finder's "Open with" menu.
  #
  # ⚠⚠ `rank: Alternate`, deliberately — NOT the `Default` electron-builder
  # would otherwise write. `Owner`/`Default` tells LaunchServices this app is a
  # or the natural handler for `.docx`, and on a Mac with nothing else claiming
  # the type that is enough for macOS to hand it over WITHOUT the user ever
  # choosing. Installing an app must never quietly take a file type; `Alternate`
  # says "offer me in the list", which is the whole of what is wanted here.
  # Becoming the default stays a Finder → Get Info → "Change All…" decision, and
  # Settings says so rather than pretending it can do it (LaunchServices' API
  # for it has no Electron binding, and this app ships no native module).
  fileAssociations:
    - ext:
        - docx
        - doc
        - xlsx
        - xls
        - pptx
        - ppt
        - odt
        - ods
        - odp
        - rtf
      name: Office document
      role: Editor
      rank: Alternate

# Unsigned macOS builds get a deep ad-hoc re-seal (see the script for why a
# half-signed bundle reads as MALWARE to macOS 26 while an ad-hoc-sealed one
# gets the "Open Anyway" path). No-op off macOS and when a real cert is set.
afterPack: scripts/adhoc-sign.cjs

# ⚠⚠ nsis and portable BOTH emit `.exe`, so under the shared artifactName
# template above they would both be `filex-desktop-x64.exe` — the same file,
# written twice, with whichever target ran last winning. The override is
# mandatory, and it obeys the same rule as the template it replaces: NO
# ${version}, because the download links point at
# `releases/latest/download/<name>` and GitHub only resolves that for a fixed
# filename.
portable:
  artifactName: ${productName}-desktop-portable-${arch}.${ext}
  # Never ask for administrator rights. This is the build somebody runs BECAUSE
  # they do not have them; a UAC prompt would be the one thing that makes it
  # useless. (`user` is already the default — written out because the
  # alternative is a single word in this file and the failure is total.)
  requestExecutionLevel: user
  # ⚠ `unpackDirName` is deliberately NOT set. Read templates/nsis/portable.nsi
  # before adding it: the stub does `RMDir /r $INSTDIR` BEFORE extracting, so a
  # fixed name means launching one portable copy wipes the extraction directory
  # of another one that is still running. The default is a per-build id, and
  # the same script removes the directory again once the app exits — so nothing
  # is left in %TEMP% either way.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # ⚠⚠ PER-USER, always. Not a preference — it is what makes a silent update
  # possible at all. An install under C:\Program Files needs administrator
  # rights to replace its own files, so every background update ends in a UAC
  # prompt: the app cannot update itself while nobody is at the machine, and
  # "it updates itself quietly" becomes a promise it can only half keep.
  # Discord, Slack and VS Code's user installer all land in %LOCALAPPDATA% for
  # exactly this reason.
  #
  # `perMachine: false` is already the default, but it is written out because
  # the default ALSO shows an install-mode page and offers elevation — and one
  # click on "for all users" puts the app somewhere its own updater cannot
  # reach. `allowElevation: false` removes that page and that choice.
  # (Measured 2026-08-14: the installed copy was C:\Program Files\filex with
  # `/allusers`, which is why its updates asked for elevation.)
  perMachine: false
  allowElevation: false

# ── Microsoft Store (MSIX) ───────────────────────────────────────────
# Built on its own, never by `dist:win`: `pnpm dist:store` → `--win appx`. The
# package goes to Partner Center, NOT to the filex.sh feed — the Store signs it
# (no certificate of ours involved), hosts it, and updates it. The app notices
# it is a Store copy (process.windowsStore, src/channel.ts) and leaves updating
# to the Store.
#
# ⚠⚠ identityName, publisher and publisherDisplayName are the values Partner
# Center shows under Product management → Product identity once the name is
# reserved, character for character (case and punctuation included). The
# placeholders below build a package that installs for a local test (signed
# with a matching self-signed certificate) and that the Store would refuse.
appx:
  identityName: BRFTeknoloji.filex
  publisher: CN=BRF Teknoloji
  publisherDisplayName: BRF Teknoloji
  # Required as soon as the identity comes from Partner Center: those names
  # usually start with a digit, and electron-builder refuses an Application.Id
  # that does ("AppX Application.Id can't start with numbers").
  applicationId: filex
  displayName: filex
  # Tiles are drawn on the Start menu's own background.
  backgroundColor: transparent
  languages:
    - en-US
    - tr-TR
  # The link, "Open with filex" and the login item — see the file.
  customExtensionsPath: build/appx-extensions.xml

# The Store version (0.43.1 → 1.0.4301.0), the uap3/uap10 namespaces and the
# Windows range, rewritten after electron-builder writes the manifest. Read the
# script before changing the version scheme: the Store refuses any package that
# is not higher than the last one.
appxManifestCreated: scripts/appx-manifest.cjs

# ── Upgrading from the package that was called `filex` (≤ 0.43.x) ────
# A different package NAME is a different package to dpkg and rpm: without
# these, `apt install ./filex-desktop-amd64.deb` next to the old one fails on
# the files both put under /opt/filex, and the old one would never go away.
# Conflicts + Replaces (deb) / Conflicts + Obsoletes (rpm, fpm's `--replaces`)
# make the new package take the old one's place in the same transaction.
#
# ⚠⚠ VERSION-BOUNDED, on purpose: `filex` is the CLI's name from now on, and
# the day the CLI ships as a package called `filex`, an unbounded Replaces
# would uninstall it. Only the desktop builds that carried the name — every
# version before the first `filex-app` release — are replaced. 0.44.0 is that
# release; if the rename ships in a 0.43.x, lower both bounds to that version
# (test/linux-desktop-entry.test.ts checks they are above package.json's).
#
# ⚠ `packageName` too, per target (`linux:` does not take it in electron-builder
# 24): without it the package is still named `filex` after productName.
# Measured: with only executableName changed, the new .deb said
# `Package: filex`, and `apt install` upgraded the old package in place
# ("Unpacking filex (0.43.1) over (0.43.0)") — the CLI's name still taken.
#
# `afterRemove` — the .deb's postrm and the .rpm's %postun, per target (again
# not a `linux:` key). electron-builder's own passes the wrong path to
# `update-alternatives --remove` and runs on upgrades too: on Fedora
# `dnf remove filex-app` failed the scriptlet and left /usr/bin/filex-app
# dangling (measured). See the file.
deb:
  packageName: filex-app
  afterRemove: build/linux/after-remove.tpl
  fpm:
    - "--conflicts=filex (<< 0.44.0)"
    - "--replaces=filex (<< 0.44.0)"
rpm:
  packageName: filex-app
  afterRemove: build/linux/after-remove.tpl
  fpm:
    - "--conflicts=filex < 0.44.0"
    - "--replaces=filex < 0.44.0"

# ── Snap Store ───────────────────────────────────────────────────────
# Built on its own, never by `dist:linux`: `pnpm dist:snap` → `--linux snap`.
# The package goes to the Snap Store (`snapcraft upload` in CI, when the
# credentials exist) and is attached to the GitHub Release as well. snapd
# updates it; the app recognises a snap (SNAP + SNAP_NAME, src/channel.ts) and
# never wires its own updater there.
#
# What a STRICT snap changes, and where the app answers it (src/channel.ts):
#   - HOME is `~/snap/filex-app/<rev>`: the default filex folder comes from
#     SNAP_REAL_HOME (userHome), the sync engine's state from SNAP_USER_COMMON
#     (engineStateDir) — the real `~/.filex` is a hidden directory the `home`
#     interface does not reach.
#   - The desktop entry snapd installs is `filex-app_filex-app.desktop`
#     (linuxDesktopEntry); `filex://` and "Open with" come from it, and
#     Settings explains the file manager's "Open with" instead of running
#     `xdg-mime` in the sandbox (defaultHandlerRoute).
#   - No keyring until `password-manager-service` is connected: the app then
#     refuses to store the sign-in and says which command connects it
#     (src/keychain.ts).
snap:
  # ⚠ core20, explicitly — the base electron-builder's prebuilt snap TEMPLATE
  # is made for (Electron runtime libraries from the `gnome-3-28-1804` content
  # snap). It needs no snapcraft on the build machine (the package is
  # assembled with mksquashfs), which is what lets an ordinary Ubuntu CI
  # runner and a plain Docker build produce it. core22/core24 need snapcraft
  # in LXD or multipass, and a proper core24 snap (the `gnome` extension) only
  # comes with electron-builder 26 — move to `base: core24` together with that
  # upgrade, not before. Written out so a newer electron-builder with another
  # default does not change the base silently.
  base: core20
  confinement: strict
  grade: stable
  summary: Your filex server's files in a window, with folder sync
  # snapd starts `~/snap/filex-app/current/.config/autostart/filex-app.desktop`
  # (`<snap name>.desktop`) at sign-in, with the arguments on its Exec line.
  # Inside the snap HOME is `~/snap/filex-app/<rev>`, so the file "Start when
  # I sign in" already writes (`$HOME/.config/autostart/filex-app.desktop`,
  # login-item.ts → LINUX_AUTOSTART_NAME) is exactly that file, `--hidden`
  # included; test/linux-desktop-entry.test.ts keeps the names equal.
  autoStart: true
  plugs:
    # electron-builder's list: desktop, desktop-legacy, home, x11, wayland,
    # unity7 (the tray's StatusNotifier), browser-support, network, gsettings,
    # audio-playback, pulseaudio, opengl. `home` connects by itself on classic
    # distributions.
    - default
    # The keyring (libsecret over D-Bus). Does NOT connect by itself: until it
    # is (`snap connect filex-app:password-manager-service`, or a store
    # auto-connect grant) Chromium falls back to `basic_text` and the app
    # refuses to store the sign-in, saying why.
    - password-manager-service
    # Folders under /media, /run/media and /mnt. Also manual until granted.
    - removable-media
  # Same fixed-name rule as every other artifact (see artifactName above).
  artifactName: ${productName}-desktop-${arch}.${ext}

# ── auto-update feed ─────────────────────────────────────────────────
# Generic (a plain static directory), NOT the GitHub provider: this repo's
# GitHub mirror is private, and the GitHub provider would need a token shipped
# inside the app to read its releases. filex.sh already serves the CLI's update
# manifest from the same static site, so the desktop feed lives beside it.
#
# Declaring `publish` is also what makes electron-builder WRITE `latest.yml`
# next to the installer — without it there is nothing for the updater to read,
# and the app would check forever and find nothing.
publish:
  provider: generic
  url: https://filex.sh/desktop/
  # We upload by hand (goreleaser owns the CLI release; these packages do not
  # come from CI), so never let a build try to push.
  publishAutoUpdate: true
